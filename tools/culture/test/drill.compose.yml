# The restore drill's additions to deploy/culture/docker-compose.yml (backup-restore.test.sh): the secrets come from
# the drill, so that the system after the restore (whose secrets volume was lost too) accepts the same administrator,
# and only the application's port is published, on the drill's own port.
services:
  db:
    ports: !reset []
  culture:
    ports: !override ["127.0.0.1:${CULTURE_PORT:-18080}:8080"]
    environment:
      JABIZ_JWT_SECRET: ${DRILL_JWT_SECRET:?}
      JABIZ_BOOTSTRAP_ADMIN_USER: admin
      JABIZ_BOOTSTRAP_ADMIN_PASSWORD: ${DRILL_ADMIN_PASSWORD:?}
