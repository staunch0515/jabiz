name: CI
on:
  # Pushes run only on the platform branches of every line ('1.1/platform'). Everything else runs as a pull request:
  # work branches ('1.1/phase-12a-x', '1.1/culture-3-x') and what is merged into an application branch ('1.1/culture')
  # were checked as pull requests before the merge, so a commit is not checked twice
  # (docs/design/17-apps-and-branches.md section 2).
  push:
    branches:
      - '[0-9]*.[0-9]*/platform'
  pull_request:
    # ready_for_review: a draft skips the end-to-end jobs below, so they run when it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to a pull request cancels its run in progress; runs on the long-lived branches all complete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the branch is: an application branch (one with .jabiz-app-paths) changes only its own paths (the app-paths job
  # below), so the platform's code on it is a platform commit already checked on the platform branch. There only the
  # application's modules are checked (build-application); the platform's own jobs (build, frontend, e2e, compose)
  # run on the platform branch and its pull requests.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      application: ${{ steps.scope.outputs.application }}
      tasks: ${{ steps.scope.outputs.tasks }}
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request is checked out as its merge commit: its first parent is the base, so two commits are enough
          # to list what the pull request changes.
          fetch-depth: 2
      # The application's modules as backend/settings.gradle.kts includes them: every direct subdirectory of backend/
      # with a build script that is not one of the platform's.
      - id: scope
        run: |
          if [ ! -f .jabiz-app-paths ]; then
            echo "application=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tasks=
          for script in backend/*/build.gradle.kts; do
            module="$(basename "$(dirname "$script")")"
            case "$module" in core|ext-geo|runtime|app|build-logic|buildSrc|gradle|.*) ;; *) tasks="$tasks :$module:check" ;; esac
          done
          echo "application=true" >> "$GITHUB_OUTPUT"
          echo "tasks=${tasks# }" >> "$GITHUB_OUTPUT"
          echo "application modules:${tasks:- none}"
      # Whether the backend's check (build, build-application) runs (ROADMAP 17zg): always on pushes and manual runs;
      # a pull request skips it only when every path it changes is a document or listed in .jabiz-ci-no-backend
      # (tools/ci-backend-scope.sh). The jobs that need build (e2e, compose) are skipped with it.
      - id: backend
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            backend="$(git diff --name-only HEAD^1 HEAD | tools/ci-backend-scope.sh)"
          else
            backend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend check: $backend"

  build:
    needs: scope
    if: needs.scope.outputs.application != 'true' && needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Caches the Gradle wrapper and dependencies. By default only the repository's default branch ('main') writes
      # the cache; the long-lived branches write it here, and pull requests read what their base branch wrote.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Compile, unit tests, integration tests (Testcontainers postgres:16), the core coverage gate,
      # platformCheck (the startup self-checks against a freshly migrated database, docs/design/07-quality.md),
      # the validation cases shared with the frontend and the OpenAPI snapshot the frontend is generated from.
      - run: ./gradlew check
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            backend/*/build/reports/tests/
            backend/*/build/test-results/
            backend/core/build/reports/jacoco/
          retention-days: 7

  # An application branch: its modules' check (their unit and integration tests, platformCheck, the SPAs' version checks
  # spaCheck<name>), which compiles the platform's modules without testing them again.
  # The application's tests in three shards on three machines (ROADMAP 17zz13): -Pjabiz.test.shard=<i>/3 runs a third
  # of each module's test classes, dealt out by the module's test-timings.txt (backend/build-logic TestShards). Shard 1
  # runs the modules' whole check (also platformCheck and the SPAs' checks), the others their tests only.
  build-application-shard:
    needs: scope
    if: needs.scope.outputs.application == 'true' && needs.scope.outputs.tasks != '' && needs.scope.outputs.backend == 'true'
    name: build-application (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # QuizBuks's whole suite on one machine took 43-45 minutes in November 2026 (17zz12); a shard takes about a third
    # of the tests plus the compilation: 13-18 minutes in its first sharded runs (#551, #557), so 40 leaves room
    # for growth and stops a hung run early (17zz16).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check (shard ${{ matrix.shard }}/3)
        working-directory: backend
        env:
          TASKS: ${{ needs.scope.outputs.tasks }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = 1 ]; then
            tasks="$TASKS"
          else
            tasks="${TASKS//:check/:test}"
          fi
          echo "shard $SHARD/3: $tasks"
          # shellcheck disable=SC2086 # one argument per task
          ./gradlew $tasks -Pjabiz.test.shard="$SHARD/3"
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-shard-${{ matrix.shard }}
          path: |
            backend/*/build/reports/tests/
            backend/*/build/test-results/
          retention-days: 7

  # The check branch protection requires: green when every shard is, skipped when they are (as before the split).
  build-application:
    needs: [scope, build-application-shard]
    if: always() && needs.scope.outputs.application == 'true' && needs.scope.outputs.tasks != '' && needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.build-application-shard.result }}
        run: |
          echo "shards: $RESULT"
          [ "$RESULT" = success ]

  # The metadata-driven frontend (docs/design/12-frontend.md): lint, types, generated API types up to date,
  # unit tests of the adapter layer (including the validation cases shared with the backend) and the build.
  frontend:
    needs: scope
    if: needs.scope.outputs.application != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/app/portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build
      # The demo application's admin extension (docs/design/12-frontend.md section 9, decision D22): its types, lint
      # rules (only @jabiz/admin) and tests, checked with this project's tools.
      - run: pnpm ext:check
        env:
          JABIZ_ADMIN_EXTENSION: ../backend/app/admin-extension
      # The demo's customer portal (docs/guide/app-spa.md, decision D43): an application's own SPA with its own
      # lockfile, linking the platform's packages; the same versions as the platform (app:check), then its own checks.
      - run: pnpm app:check ../backend/app/portal
      - name: Customer portal
        working-directory: backend/app/portal
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      # The admin frontend under a sub-path (docs/design/16-content-authoring.md section 6): assets resolve below it.
      - name: Build under /admin/
        run: |
          VITE_BASE=/admin/ pnpm exec vite build --outDir "$RUNNER_TEMP/admin" --emptyOutDir
          grep -q 'src="/admin/assets/' "$RUNNER_TEMP/admin/index.html"
          ! grep -qE '(src|href)="/(assets|favicon)' "$RUNNER_TEMP/admin/index.html"

  # Platform and applications (docs/design/17-apps-and-branches.md section 2): an application branch (one with
  # .jabiz-app-paths) changes only its own paths, measured against the platform branch of its version line
  # (.jabiz-platform-line, decision D21); a branch named after a line ('1.1/...') must be on that line. The script's
  # own tests run on every branch.
  app-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/test/check-app-paths.test.sh
      - run: tools/test/ci-backend-scope.test.sh
      # The alert rules rendered with a deployment's settings (docker/grafana/alerting, 13 section 7).
      - run: tools/test/alert-render.test.sh
      # The test-fire script: made-up data for every platform rule, an application's rules (ALERT_FAKES), offline.
      - run: tools/test/alert-fire.test.sh
      # The wiki's publishing scripts (docs/guide/wiki.md), tested on every branch like the script above.
      - run: node --test tools/wiki/*.test.mjs && tools/test/wiki-publish.test.sh
      # The read-only check of production settings (docs/guide/platform-operations.md section 1).
      - run: tools/test/env-check.test.sh
      - run: tools/test/restore-drill.test.sh
      - run: tools/test/test-timings.test.sh
      - name: Application paths and version line
        env:
          # HEAD is detached in CI; the script needs the branch's name for the line check.
          APP_PATHS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -f .jabiz-app-paths ]; then
            if [ -f .jabiz-platform-line ]; then base="$(tr -d '[:space:]' < .jabiz-platform-line)/platform"; else base=platform; fi
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          tools/check-app-paths.sh

  # Migrations stay in order (17zz8): every Flyway migration a pull request adds or renames comes after the highest one
  # of its sequence on the target branch's latest commit, and no version occurs twice (tools/check-migration-order.sh;
  # 2026-11-08 a V80 merged after a V81 failed its deployment); no migration the target branch already has is edited,
  # deleted or renamed, nor its .sql.conf (17zz18: Flyway's checksum check). The platform's sequences are the script's own; an
  # application branch adds its own in .jabiz-migration-sequences (one directory regex per line, # comments). Drafts too.
  migration-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/test/check-migration-order.test.sh
      - name: Migration order against the target branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        # HEAD is the pull request merged into the target branch's latest commit (GitHub's merge ref).
        run: |
          git fetch --no-tags origin "$BASE_REF"
          sequences=(backend/runtime/src/main/resources/db/jabiz backend/app/src/main/resources/db/migration
            backend/app/src/test/resources/db/testmigration)
          if [ -f .jabiz-migration-sequences ]; then
            while IFS= read -r line; do
              line=${line%%#*}; line=${line#"${line%%[![:space:]]*}"}; line=${line%"${line##*[![:space:]]}"}
              [ -n "$line" ] && sequences+=("$line")
            done < .jabiz-migration-sequences
          fi
          tools/check-migration-order.sh "origin/$BASE_REF" HEAD "${sequences[@]}"

  # End-to-end: the packaged application (API + frontend in one jar) against PostgreSQL, driven by Playwright.
  # The two slow jobs below start only after the fast ones pass (so not on an application branch), and not on draft pull
  # requests.
  e2e:
    needs: [build, frontend]
    if: ${{ !github.event.pull_request.draft }}
    # Pinned: ubuntu-latest became 26.04, where Playwright 1.56 has no Chromium ("does not support chromium on
    # ubuntu26.04-x64"). Back to ubuntu-latest once Playwright is upgraded to a version that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jabiz_e2e
          POSTGRES_USER: jabiz
          POSTGRES_PASSWORD: jabiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jabiz -d jabiz_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Builds the frontend with pnpm and packages it into the boot jar.
      - run: ./gradlew :app:bootJar
        working-directory: backend
      - name: Start the application
        working-directory: backend
        run: |
          # A throwaway signing key for this run only.
          export JABIZ_JWT_SECRET=$(openssl rand -base64 48)
          export JABIZ_INTEGRITY_KEY=$(openssl rand -base64 48)
          export JABIZ_MFA_KEY=$(openssl rand -base64 48)
          # The demo's external AI service (decision D38): no provider is called by the end-to-end tests.
          export JABIZ_DEMO_AI_KEY=$(openssl rand -hex 24)
          # The shared administrator of the end-to-end tests has no second factor; step-up is tested with a
          # process that always requires one (e2e/mfa.spec.ts).
          export JABIZ_SECURITY_MFA_ADMINISTRATION=false
          # The end-to-end tests sign in to the administration with roles of their own, so it accepts every role;
          # the sample's portal therefore takes no registrations (decision D36: the startup check refuses both).
          export JABIZ_ADMIN_ROLES='*'
          export JABIZ_PORTAL_SELF_REGISTRATION=false
          # No mail is sent here, so nobody could verify an address: the portal lets customers sign in without
          # (ordering itself still requires one, PORTAL_ORDER_PLACE).
          export JABIZ_PORTAL_REQUIRE_VERIFIED_EMAIL=false
          # The shared administrator signs in dozens of times from this machine: the limit of one name from one
          # address (decision D47, a burst of 10 by default) is raised; the per-address limits keep their defaults.
          export JABIZ_SECURITY_SIGN_IN_RATE_LIMIT_PER_USER_ADDRESS=6000
          export JABIZ_SECURITY_SIGN_IN_RATE_LIMIT_USER_BURST=1000
          nohup java -Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true -jar app/build/libs/app-0.0.1-SNAPSHOT.jar \
            > ../app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat ../app.log; exit 1
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/jabiz_e2e
          SPRING_R2DBC_USERNAME: jabiz
          SPRING_R2DBC_PASSWORD: jabiz
          SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/jabiz_e2e
          SPRING_FLYWAY_USER: jabiz
          SPRING_FLYWAY_PASSWORD: jabiz
          JABIZ_BOOTSTRAP_ADMIN_USER: ${{ env.E2E_ADMIN_USER }}
          JABIZ_BOOTSTRAP_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          # Uploaded files of this run (docs/design/14-files.md section 6).
          JABIZ_FILES_LOCAL_ROOT: ${{ runner.temp }}/jabiz-files
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            app.log
          retention-days: 7

  # One command starts the whole system (ROADMAP phase 11): the image is built from source, the first administrator's
  # password is generated on first start, and the demo seed signs in and places and ships an order through the API.
  compose:
    needs: [build, frontend]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait --wait-timeout 300 app
      - name: Sign in and use the system
        run: |
          PASSWORD=$(docker compose exec -T app cat /var/lib/jabiz/secrets/admin-password)
          JABIZ_PASSWORD="$PASSWORD" tools/demo/seed.sh
          curl -sf localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs app
