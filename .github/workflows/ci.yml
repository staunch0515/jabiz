name: CI
on:
  push:
    branches: [main, alpha, 'phase-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches the Gradle wrapper and dependencies.
      - uses: gradle/actions/setup-gradle@v4
      # Compile, unit tests, integration tests (Testcontainers postgres:16) and the core coverage gate.
      # Packaging (bootJar, which also builds the frontend) is not part of CI yet: the frontend does not
      # compile today and is rebuilt in ROADMAP phase 10.
      - run: ./gradlew check
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/*/build/reports/tests/
            backend/*/build/test-results/
            backend/core/build/reports/jacoco/
          retention-days: 7
