name: CI
on:
  # Every branch: platform and its work branches, and application branches, which cannot change this file
  # (docs/design/17-apps-and-branches.md section 3.3).
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches the Gradle wrapper and dependencies.
      - uses: gradle/actions/setup-gradle@v4
      # Compile, unit tests, integration tests (Testcontainers postgres:16), the core coverage gate,
      # platformCheck (the startup self-checks against a freshly migrated database, docs/design/07-quality.md),
      # the validation cases shared with the frontend and the OpenAPI snapshot the frontend is generated from.
      - run: ./gradlew check
        working-directory: backend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/*/build/reports/tests/
            backend/*/build/test-results/
            backend/core/build/reports/jacoco/
          retention-days: 7

  # The metadata-driven frontend (docs/design/12-frontend.md): lint, types, generated API types up to date,
  # unit tests of the adapter layer (including the validation cases shared with the backend) and the build.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:api
      - run: pnpm test
      - run: pnpm build
      # The demo application's admin extension (docs/design/12-frontend.md section 9, decision D22): its types, lint
      # rules (only @jabiz/admin) and tests, checked with this project's tools.
      - run: pnpm ext:check
        env:
          JABIZ_ADMIN_EXTENSION: ../backend/app/admin-extension
      # The admin frontend under a sub-path (docs/design/16-content-authoring.md section 6): assets resolve below it.
      - name: Build under /admin/
        run: |
          VITE_BASE=/admin/ pnpm exec vite build --outDir "$RUNNER_TEMP/admin" --emptyOutDir
          grep -q 'src="/admin/assets/' "$RUNNER_TEMP/admin/index.html"
          ! grep -qE '(src|href)="/(assets|favicon)' "$RUNNER_TEMP/admin/index.html"

  # Platform and applications (docs/design/17-apps-and-branches.md section 2): an application branch (one with
  # .jabiz-app-paths) changes only its own paths, measured against the platform branch of its version line
  # (.jabiz-platform-line, decision D21); a branch named after a line ('1.1/...') must be on that line. The script's
  # own tests run on every branch.
  app-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: tools/test/check-app-paths.test.sh
      - name: Application paths and version line
        env:
          # HEAD is detached in CI; the script needs the branch's name for the line check.
          APP_PATHS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -f .jabiz-app-paths ]; then
            if [ -f .jabiz-platform-line ]; then base="$(tr -d '[:space:]' < .jabiz-platform-line)/platform"; else base=platform; fi
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
          fi
          tools/check-app-paths.sh

  # End-to-end: the packaged application (API + frontend in one jar) against PostgreSQL, driven by Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jabiz_e2e
          POSTGRES_USER: jabiz
          POSTGRES_PASSWORD: jabiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jabiz -d jabiz_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Builds the frontend with pnpm and packages it into the boot jar.
      - run: ./gradlew :app:bootJar
        working-directory: backend
      - name: Start the application
        working-directory: backend
        run: |
          # A throwaway signing key for this run only.
          export JABIZ_JWT_SECRET=$(openssl rand -base64 48)
          export JABIZ_INTEGRITY_KEY=$(openssl rand -base64 48)
          nohup java -Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true -jar app/build/libs/app-0.0.1-SNAPSHOT.jar \
            > ../app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat ../app.log; exit 1
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/jabiz_e2e
          SPRING_R2DBC_USERNAME: jabiz
          SPRING_R2DBC_PASSWORD: jabiz
          SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/jabiz_e2e
          SPRING_FLYWAY_USER: jabiz
          SPRING_FLYWAY_PASSWORD: jabiz
          JABIZ_BOOTSTRAP_ADMIN_USER: ${{ env.E2E_ADMIN_USER }}
          JABIZ_BOOTSTRAP_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          # Uploaded files of this run (docs/design/14-files.md section 6).
          JABIZ_FILES_LOCAL_ROOT: ${{ runner.temp }}/jabiz-files
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            app.log
          retention-days: 7

  # One command starts the whole system (ROADMAP phase 11): the image is built from source, the first administrator's
  # password is generated on first start, and the demo seed signs in and places and ships an order through the API.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 300 app
      - name: Sign in and use the system
        run: |
          PASSWORD=$(docker compose exec -T app cat /var/lib/jabiz/secrets/admin-password)
          JABIZ_PASSWORD="$PASSWORD" tools/demo/seed.sh
          curl -sf localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs app
