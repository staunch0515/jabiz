name: QuizBuks
on:
  # As the platform's ci.yml: pushes run only on the long-lived line branches ('1.3/quizbuks');
  # work branches ('1.3/quizbuks-50-china-web') run as pull requests, so a commit is not checked twice.
  push:
    branches:
      - '[0-9]*.[0-9]*/*'
      - '!*/phase-*'
      - '!*/*-[0-9]*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      stripe-test-mode:
        description: Also run the money flow against Stripe's test mode (needs the STRIPE_TEST_SECRET_KEY secret; docs/quizbuks/stripe-test-mode.md)
        type: boolean
        default: false

# A new push to a pull request cancels its run in progress; runs on the long-lived branches all complete.
concurrency:
  group: quizbuks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: the jobs only check out the repository and upload reports.
permissions:
  contents: read

# The application's own checks (docs/quizbuks/plans/Q1-skeleton.md item 9); the backend (./gradlew check, which
# includes :quizbuks:check with platformCheck and the SPAs' version checks spaCheckRoot / spaCheckSponsor) and the
# application-path check run in the platform's ci.yml.
jobs:
  # The QuizBuks front ends (docs/quizbuks/plans/QP-pages.md section 7): the app and the sponsor console use the
  # platform's versions (app:check), pass their own lint, types and tests, and keep the shared folder src/qb the same.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            quizbuks-web/app/pnpm-lock.yaml
            quizbuks-web/sponsor/pnpm-lock.yaml
            quizbuks-web/shopify/pnpm-lock.yaml
            quizbuks-web/storefront/pnpm-lock.yaml
            quizbuks-web/shopify-site/pnpm-lock.yaml
            quizbuks-web/e2e/pnpm-lock.yaml
      # The SPAs link the platform's packages, which resolve their dependencies from the platform frontend.
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: |
          pnpm app:check ../quizbuks-web/app
          pnpm app:check ../quizbuks-web/sponsor
          pnpm app:check ../quizbuks-web/shopify
        working-directory: frontend
      # The admin extension (backend/quizbuks/admin-extension, Q9a): types, lint and tests with the platform's tools.
      - run: JABIZ_ADMIN_EXTENSION=../backend/quizbuks/admin-extension pnpm ext:check
        working-directory: frontend
      - name: The shared folder is the same in both SPAs
        run: diff -r quizbuks-web/app/src/qb quizbuks-web/sponsor/src/qb
      - name: The content tool (tools/quizbuks/content, Q36)
        run: node --test tools/quizbuks/content/lib.test.mjs
      - name: The store listing texts (docs/quizbuks/store, Q49d)
        run: node --test tools/quizbuks/store/listing.test.mjs
      - name: App
        working-directory: quizbuks-web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Sponsor console
        working-directory: quizbuks-web/sponsor
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Shopify embedded pages (S1)
        working-directory: quizbuks-web/shopify
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          # S4b: the first load of the embedded pages against its budget (scripts/size.mjs).
          VITE_BASE=/shopify/ pnpm build
          VITE_BASE=/shopify/ pnpm size
      # S2b: the storefront's block, a plain Web Component (no React, no @jabiz/ui components); the build checks its
      # size budget, `pnpm versions` its tools against the platform's (app:check is for SPAs on @jabiz/ui).
      - name: Shopify storefront block (S2b)
        working-directory: quizbuks-web/storefront
        run: |
          pnpm install --frozen-lockfile
          pnpm versions
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      # S4a: QuizBuks for Shopify's public pages (/shopify-app/): every page in every language, the privacy policy's
      # required parts, no script or inline style.
      - name: Shopify public pages (S4a)
        working-directory: quizbuks-web/shopify-site
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: End-to-end tests (types only; they run in the e2e job)
        working-directory: quizbuks-web/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

  # The image's entrypoint (deploy/quizbuks/entrypoint.sh): Stripe placeholders for a plain local compose only, never
  # over a set value or in live mode. Then the stack as a person starts it on this machine: built and started with
  # compose and no .env, it must become healthy with the placeholders' warnings (deploy/quizbuks/README.md).
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f deploy/quizbuks/compose.dev.yaml
      # A local demonstration: the image makes the platform's keys (compose's default is false, Q10b review L5).
      QB_LOCAL_SECRETS: 'true'
    steps:
      - uses: actions/checkout@v5
      - run: tools/quizbuks/test/entrypoint.test.sh
      # The Stripe test-mode script's guard and arguments, offline (the run itself: the stripe-test-mode job).
      - run: tools/quizbuks/test/stripe-test-mode.test.sh
      - run: $COMPOSE config --quiet
      - name: No .env
        run: test ! -e deploy/quizbuks/.env
      - name: Build and start the stack
        run: $COMPOSE up -d --build
      - name: Healthy, with the placeholders' warnings and no failed platform check
        run: |
          healthy=false
          for i in $(seq 1 72); do
            if curl -sf localhost:8080/actuator/health; then healthy=true; break; fi
            sleep 5
          done
          $COMPOSE logs app > quizbuks-compose.log 2>&1
          $healthy || { echo "not healthy after 6 minutes"; exit 1; }
          if grep -q 'Platform check failed' quizbuks-compose.log; then echo "platform check failed"; exit 1; fi
          for name in STRIPE_API_KEY STRIPE_WEBHOOK_SECRET STRIPE_CONNECT_WEBHOOK_SECRET; do
            grep -q "quizbuks: WARNING: $name is not set" quizbuks-compose.log || { echo "no warning for $name"; exit 1; }
          done
      - if: failure()
        run: $COMPOSE logs app
      - if: always()
        run: $COMPOSE down -v

  # The packaged application starts on an empty database, migrates, passes its startup checks, reports healthy and
  # serves its three front ends.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizbuks_smoke
          POSTGRES_USER: quizbuks
          POSTGRES_PASSWORD: quizbuks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quizbuks -d quizbuks_smoke" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Pull requests read the cache their base branch wrote (as ci.yml).
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew :quizbuks:bootJar
        working-directory: backend
      - name: Start the application and wait for health
        working-directory: backend
        run: |
          # Throwaway keys for this run only.
          export JABIZ_JWT_SECRET=$(openssl rand -base64 48)
          export JABIZ_INTEGRITY_KEY=$(openssl rand -base64 48)
          export JABIZ_MFA_KEY=$(openssl rand -base64 48)
          export JABIZ_SEAL_KEY=$(openssl rand -base64 48)
          # Stripe (Q6a): startup refuses a missing webhook secret or API key; a test-mode key passes the mode check.
          export STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)
          export STRIPE_CONNECT_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)
          export STRIPE_API_KEY=sk_test_ci_throwaway
          # Claude (Q8a): startup refuses a missing key; AI stays off, so nothing is sent.
          export ANTHROPIC_API_KEY=ci-throwaway-not-a-claude-key
          # QuizBuks for Shopify (S1): startup refuses a missing app key or secret.
          export SHOPIFY_API_KEY=ci-throwaway-shopify-key
          export SHOPIFY_API_SECRET=ci_throwaway_shopify_$(openssl rand -hex 16)
          nohup java -Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true \
            -jar quizbuks/build/libs/quizbuks-0.0.1-SNAPSHOT.jar > ../quizbuks.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat ../quizbuks.log; exit 1
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/quizbuks_smoke
          SPRING_R2DBC_USERNAME: quizbuks
          SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/quizbuks_smoke
          SPRING_FLYWAY_USER: quizbuks
          DB_PASSWORD: quizbuks
          JABIZ_BOOTSTRAP_ADMIN_USER: admin
          JABIZ_BOOTSTRAP_ADMIN_PASSWORD: smoke-admin-password
          JABIZ_FILES_LOCAL_ROOT: ${{ runner.temp }}/quizbuks-files
      - name: The front ends are served
        run: |
          # The app at /taker/ (docs/quizbuks/plans/QP-pages.md, Q30), the sponsor console at /sponsor/, the admin
          # frontend at /admin/, the business site at /biz/; a client-side route of each falls back to its own page.
          # The bare address opens the business site; the app's old addresses go on to /taker/ (platform 16zf-a).
          curl -sf localhost:8080/taker/ | grep -q 'id="root"'
          curl -sf localhost:8080/taker/welcome | grep -q '<title>QuizBuks</title>'
          curl -sf localhost:8080/biz/ | grep -q 'QuizBuks'
          curl -sf localhost:8080/shopify-app/privacy/ | grep -q 'Privacy policy'
          # The embedded pages carry the deployment's Client ID, written in at startup (S4a, platform 17g).
          curl -sf localhost:8080/shopify/ | grep -q 'content="ci-throwaway-shopify-key"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/)" = 302
          curl -sI 'localhost:8080/?ref=card' | tr -d '\r' | grep -qi '^location: /biz/?ref=card$'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/p/some-id)" = 301
          curl -sI localhost:8080/p/some-id | tr -d '\r' | grep -qi '^location: /taker/p/some-id$'
          curl -sf localhost:8080/sponsor/ | grep -q '<title>QuizBuks Sponsor</title>'
          curl -sf localhost:8080/sponsor/wallet | grep -q '<title>QuizBuks Sponsor</title>'
          curl -sf localhost:8080/admin/ | grep -q 'id="root"'
          curl -sf localhost:8080/admin/datasets | grep -q 'id="root"'
          # The app is a PWA: its manifest and the site's only Service Worker.
          curl -sf localhost:8080/taker/manifest.webmanifest | grep -q '"start_url": "/taker/"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Service-Worker: script' localhost:8080/taker/sw.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Service-Worker: script' localhost:8080/sponsor/sw.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Service-Worker: script' localhost:8080/sw.js)" = 404
      - name: Each front end carries the content security policy
        run: |
          # The platform's default policy (docs/design/17-apps-and-branches.md section 3.2) on every SPA's pages,
          # client routes included: everything from this origin only (no inline scripts), workers too.
          for path in /taker/ /taker/welcome /sponsor/ /admin/ /biz/; do
            policy=$(curl -sI "localhost:8080$path" | tr -d '\r' | grep -i '^content-security-policy:')
            echo "$path: $policy"
            echo "$policy" | grep -q "default-src 'self'"
            echo "$policy" | grep -q "worker-src 'self'"
          done
      - name: The API still needs a token
        run: test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/meta/datasets)" = 401
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quizbuks-package-log
          path: quizbuks.log
          retention-days: 7

  # End to end (docs/quizbuks/plans/QP-pages.md section 7): the packaged jar against PostgreSQL, its mail caught by
  # Mailpit, Stripe and Claude answered by the local stubs (tools/quizbuks/stripe-stub, claude-stub), driven by Playwright through the app,
  # the sponsor console and the mailed links; axe in both appearances.
  e2e:
    needs: [web]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizbuks_e2e
          POSTGRES_USER: quizbuks
          POSTGRES_PASSWORD: quizbuks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quizbuks -d quizbuks_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ['1025:1025', '8025:8025']
    env:
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_BASE_URL: http://localhost:8080
      E2E_MAILPIT_URL: http://localhost:8025
      # The sponsors' mail server of the tests (Q29): its SMTP port for the console's form, its API for the mail.
      E2E_MERCHANT_SMTP_PORT: '1026'
      E2E_MERCHANT_MAILPIT_URL: http://localhost:8026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Builds the three SPAs with pnpm and packages them into the boot jar.
      - run: ./gradlew :quizbuks:bootJar
        working-directory: backend
      # Japanese and Chinese in the PDFs (receipts, reports; Q9d): the fonts the image installs (deploy/quizbuks/Dockerfile).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-ipafont-gothic fonts-droid-fallback
      # The sponsors' own mail server (Q29): a second Mailpit that offers STARTTLS (a throwaway certificate) and takes
      # any login, as a merchant's SMTP server would; the application trusts a server on this machine only
      # (JABIZ_MAIL_SENDERS_TRUST_ALL_FOR_TESTS, platform decision D56 item 5). A step, not a service: a service
      # starts before the certificate can be made.
      - name: Start the sponsors' mail server
        run: |
          mkdir -p "$RUNNER_TEMP/merchant-mail"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/merchant-mail/key.pem" -out "$RUNNER_TEMP/merchant-mail/cert.pem"
          chmod 644 "$RUNNER_TEMP/merchant-mail/key.pem" "$RUNNER_TEMP/merchant-mail/cert.pem"
          docker run -d --name merchant-mail -p 1026:1025 -p 8026:8025 -v "$RUNNER_TEMP/merchant-mail:/certs:ro" \
            -e MP_SMTP_TLS_CERT=/certs/cert.pem -e MP_SMTP_TLS_KEY=/certs/key.pem -e MP_SMTP_AUTH_ACCEPT_ANY=1 \
            axllent/mailpit:v1.27.10
          for i in $(seq 1 30); do curl -sf localhost:8026/api/v1/info && exit 0; sleep 1; done
          docker logs merchant-mail; exit 1
      - name: Start the Stripe stub and the application
        working-directory: backend
        run: |
          # Throwaway keys and webhook secrets for this run only.
          export JABIZ_JWT_SECRET=$(openssl rand -base64 48)
          export JABIZ_INTEGRITY_KEY=$(openssl rand -base64 48)
          export JABIZ_MFA_KEY=$(openssl rand -base64 48)
          export JABIZ_SEAL_KEY=$(openssl rand -base64 48)
          export STRIPE_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)
          export STRIPE_CONNECT_WEBHOOK_SECRET=whsec_$(openssl rand -hex 24)
          export STRIPE_API_KEY=sk_test_e2e_throwaway
          # The stub answers Stripe's API and signs its events with the same secrets (QP4's tests use it).
          nohup java ../tools/quizbuks/stripe-stub/StripeStub.java 8093 http://localhost:8080/api/inbound/stripe \
            "$STRIPE_WEBHOOK_SECRET" http://localhost:8080/api/inbound/stripe-connect "$STRIPE_CONNECT_WEBHOOK_SECRET" \
            > ../stripe-stub.log 2>&1 &
          # Claude is the local stub too (Q8a): it answers from the request alone and never calls the network.
          export ANTHROPIC_API_KEY=e2e-throwaway-not-a-claude-key
          # QuizBuks for Shopify (S1): the app's key and secret; nothing calls Shopify.
          export SHOPIFY_API_KEY=e2e-throwaway-shopify-key
          export SHOPIFY_API_SECRET=e2e_throwaway_shopify_$(openssl rand -hex 16)
          nohup java ../tools/quizbuks/claude-stub/ClaudeStub.java 8094 > ../claude-stub.log 2>&1 &
          # The tests' administrator has no second factor; the publisher of QB_SETUP's proposals and the accountant of
          # the journal export are roles of the tests' own (QB_E2E_PUBLISHER: control.publish only; QB_E2E_FINANCE:
          # the export without a second factor, Q9d; QB_E2E_CONTENT: publishing the legal texts, with a TOTP set up by
          # the tests, Q7b), which the administration therefore accepts here.
          export JABIZ_SECURITY_MFA_ADMINISTRATION=false
          export QB_ADMIN_ROLES=ADMIN,QB_ADMIN_SUPER,QB_ADMIN_CONTENT,QB_ADMIN_FINANCE,QB_E2E_PUBLISHER,QB_E2E_FINANCE,QB_E2E_CONTENT
          # Every test registers from the same address.
          export JABIZ_SECURITY_SIGN_UP_RATE_LIMIT_PER_ADDRESS=1000
          # And signs in from it, the shared administrator dozens of times (platform 16q, D47): as the platform's e2e.
          export JABIZ_SECURITY_SIGN_IN_RATE_LIMIT_PER_USER_ADDRESS=6000
          export JABIZ_SECURITY_SIGN_IN_RATE_LIMIT_USER_BURST=1000
          # The daily transfers every minute (Q9c): finance's test waits for a large transfer to need review.
          export QB_TRANSFER_RUN_CRON='0 * * * * *'
          # The daily reconciliation every minute (Q9d): the journal export waits for a clean run after its month.
          export QB_RECONCILE_RUN_CRON='30 * * * * *'
          # The sponsors' analytics every minute (Q9e2): the analytics test waits for its attempts to be counted.
          # (a privacy control: another schedule needs the end-to-end switch, which live mode refuses).
          export QB_ANALYTICS_RUN_CRON='15 * * * * *'
          export QB_E2E_ENABLED=true
          export JABIZ_REPORTS_PDF_FONTS=/usr/share/fonts/opentype/ipafont-gothic/ipag.ttf,/usr/share/fonts/truetype/droid/DroidSansFallbackFull.ttf
          nohup java -Dreactor.schedulers.defaultBoundedElasticOnVirtualThreads=true \
            -jar quizbuks/build/libs/quizbuks-0.0.1-SNAPSHOT.jar > ../quizbuks.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat ../quizbuks.log; exit 1
        env:
          SPRING_R2DBC_URL: r2dbc:postgresql://localhost:5432/quizbuks_e2e
          SPRING_R2DBC_USERNAME: quizbuks
          SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/quizbuks_e2e
          SPRING_FLYWAY_USER: quizbuks
          DB_PASSWORD: quizbuks
          JABIZ_BOOTSTRAP_ADMIN_USER: ${{ env.E2E_ADMIN_USER }}
          JABIZ_BOOTSTRAP_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          JABIZ_FILES_LOCAL_ROOT: ${{ runner.temp }}/quizbuks-files
          # Mail to Mailpit; links on this host's root, each entry's front end below it.
          JABIZ_MAIL_ENABLED: 'true'
          JABIZ_MAIL_FROM: noreply@quizbuks.test
          JABIZ_MAIL_BASE_URL: http://localhost:8080
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: '1025'
          # The sponsors' mail servers of the tests are on this machine, with a throwaway certificate (Q29).
          JABIZ_MAIL_SENDERS_TRUST_ALL_FOR_TESTS: 'true'
          # Stripe is the stub on this machine (PayoutSettings and CheckoutRequest accept localhost).
          QB_STRIPE_API_URL: http://localhost:8093
          QB_STRIPE_API_HOSTS: localhost
          QB_STRIPE_CHECKOUT_URL_PREFIX: http://localhost:8093/
          QB_STRIPE_CONNECT_URL_PREFIX: http://localhost:8093/
          QB_ANTHROPIC_API_URL: http://localhost:8094
          QB_ANTHROPIC_API_HOSTS: localhost
          QB_SPONSOR_LINK: http://localhost:8080/sponsor/
          QB_APP_LINK: http://localhost:8080/taker/
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: quizbuks-web/e2e/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quizbuks-web/e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: quizbuks-web/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: quizbuks-web/e2e
      - run: pnpm e2e
        working-directory: quizbuks-web/e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: quizbuks-e2e-report
          path: |
            quizbuks-web/e2e/playwright-report/
            quizbuks-web/e2e/test-results/
            quizbuks.log
            stripe-stub.log
            claude-stub.log
          retention-days: 7

  # tools/quizbuks/local-demo.sh as a person runs it: start with the demo data on a fresh database, then stop.
  local-demo:
    needs: [web]
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizbuks
          POSTGRES_USER: quizbuks
          POSTGRES_PASSWORD: quizbuks
        ports: ['5440:5432']
        options: >-
          --health-cmd "pg_isready -U quizbuks -d quizbuks" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Start with demo data
        run: tools/quizbuks/local-demo.sh start --seed
      - name: The taker sees the demo quiz
        run: |
          token=$(curl -sf -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"userName":"taker@quizbuks.local","password":"quizbuks-demo-1","entry":"app"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["accessToken"])')
          curl -sf -X POST localhost:8080/api/queries/qb.app.feed -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' -d "{\"params\":{\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"country\":\"JP\"},\"limit\":10}" \
            | grep -q 'World capitals'
      - name: A second start is safe, then stop
        run: |
          tools/quizbuks/local-demo.sh start --seed
          tools/quizbuks/local-demo.sh stop
      - if: failure()
        run: cat deploy/quizbuks/.local-demo/app.log

  # Q10c (docs/quizbuks/stripe-test-mode.md section 6): the money flow against Stripe's TEST mode with the repository's
  # test key: top-up, reward, Express onboarding, transfer, refund, dispute and payout, each verified through the API.
  # Only when started by hand with the input stripe-test-mode, and only when the secret STRIPE_TEST_SECRET_KEY exists
  # (sk_test_ of a test account kept for this job; the script refuses anything else); otherwise every step after the
  # first is skipped. Stripe's events reach the application through the Stripe CLI (stripe listen), Stripe's pages are
  # driven by browser.mjs (best effort: Stripe's pages are not an API).
  stripe-test-mode:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stripe-test-mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time: the runs share one Stripe test account (its balance, payouts and events).
    concurrency:
      group: quizbuks-stripe-test-mode
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quizbuks_stripe_test
          POSTGRES_USER: quizbuks
          POSTGRES_PASSWORD: quizbuks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quizbuks -d quizbuks_stripe_test" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27.10
        ports: ['1025:1025', '8025:8025']
    # The test key is given only to the steps that use it, not to the build, the tests or the third-party actions.
    env:
      STRIPE_TM_DB_PORT: '5432'
      STRIPE_TM_STATE: ${{ github.workspace }}/stripe-test-mode-state
    steps:
      - name: Skip without the test key
        id: key
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "::notice::No STRIPE_TEST_SECRET_KEY secret: the Stripe test-mode run is skipped (docs/quizbuks/stripe-test-mode.md section 6)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.key.outputs.ready == 'true'
        run: tools/quizbuks/test/stripe-test-mode.test.sh
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - if: steps.key.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - if: steps.key.outputs.ready == 'true'
        run: ./gradlew :quizbuks:bootJar
        working-directory: backend
      - name: Stripe CLI (Stripe's apt repository, https://docs.stripe.com/stripe-cli)
        if: steps.key.outputs.ready == 'true'
        run: |
          curl -fsSL https://packages.stripe.dev/api/security/keypair/stripe-cli-gpg/public \
            | gpg --dearmor | sudo tee /usr/share/keyrings/stripe.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/stripe.gpg] https://packages.stripe.dev/stripe-cli-debian-local stable main" \
            | sudo tee /etc/apt/sources.list.d/stripe.list > /dev/null
          sudo apt-get update && sudo apt-get install -y --no-install-recommends stripe
          stripe version
      # Playwright for browser.mjs, from the end-to-end tests' lockfile.
      - if: steps.key.outputs.ready == 'true'
        uses: pnpm/action-setup@v5
        with:
          package_json_file: quizbuks-web/e2e/package.json
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quizbuks-web/e2e/pnpm-lock.yaml
      - if: steps.key.outputs.ready == 'true'
        working-directory: quizbuks-web/e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start QuizBuks with the test key and stripe listen
        if: steps.key.outputs.ready == 'true'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: tools/quizbuks/stripe-test-mode/run.sh serve
      - name: The money flow
        if: steps.key.outputs.ready == 'true'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: tools/quizbuks/stripe-test-mode/run.sh run --fund-balance --browser "node tools/quizbuks/stripe-test-mode/browser.mjs"
      - if: always() && steps.key.outputs.ready == 'true'
        run: tools/quizbuks/stripe-test-mode/run.sh stop
      # The logs, results and screenshots; never the state's secrets (env, run.env) or stripe listen's log, which
      # holds its signing secret.
      - if: failure() && steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: quizbuks-stripe-test-mode
          path: |
            stripe-test-mode-state/app.log
            stripe-test-mode-state/results-*.json
            stripe-test-mode-state/browser-*.png
          retention-days: 7
