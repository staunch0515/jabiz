name: QuizBuks deploy

# Deploys QuizBuks to the shared Docker server (deploy/quizbuks/DEPLOY.md) in two environments from one repository:
#   staging     the line branch 1.2/quizbuks          APP_NAME quizbuks-staging  staging.<base domain>
#   production  the release branch 1.2/quizbuks-release  APP_NAME quizbuks          <base domain>
# Every push to either branch is tested, built into one image (the backend with its three front ends) and deployed by
# the server's deploy-app.sh under that environment's APP_NAME. A manual run with an image tag skips the tests and the
# build and deploys that tag again (a rollback). Other branches never deploy: a manual run from one stops at once.
on:
  push:
    branches: ['1.2/quizbuks', '1.2/quizbuks-release']
  workflow_dispatch:
    inputs:
      image-tag:
        description: Deploy this existing image tag (a full 40-character commit SHA) instead of building; empty builds the branch
        type: string
        default: ''

# One deployment at a time per branch (environment); a newer one waits rather than cancelling one in progress.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The environment follows the branch. The base domain is quizbuks.com unless the repository variable
# QUIZBUKS_BASE_DOMAIN (Settings → Secrets and variables → Actions → Variables) names another.
env:
  APP_NAME: ${{ github.ref == 'refs/heads/1.2/quizbuks-release' && 'quizbuks' || 'quizbuks-staging' }}
  BASE_DOMAIN: ${{ vars.QUIZBUKS_BASE_DOMAIN || 'quizbuks.com' }}
  DOMAIN_PREFIX: ${{ github.ref == 'refs/heads/1.2/quizbuks-release' && '' || 'staging.' }}

jobs:
  # The application's checks: the backend module with its startup checks (platformCheck) and integration tests
  # (Testcontainers postgres:16 on the runner, never the server's database), and the two front ends.
  test:
    if: (github.ref == 'refs/heads/1.2/quizbuks' || github.ref == 'refs/heads/1.2/quizbuks-release') && inputs.image-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew :quizbuks:check
        working-directory: backend
      - run: tools/quizbuks/test/entrypoint.test.sh
      - name: The shared folder is the same in both SPAs
        run: diff -r quizbuks-web/app/src/qb quizbuks-web/sponsor/src/qb
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            quizbuks-web/app/pnpm-lock.yaml
            quizbuks-web/sponsor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: |
          pnpm app:check ../quizbuks-web/app
          pnpm app:check ../quizbuks-web/sponsor
          JABIZ_ADMIN_EXTENSION=../backend/quizbuks/admin-extension pnpm ext:check
        working-directory: frontend
      - name: App
        working-directory: quizbuks-web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Sponsor console
        working-directory: quizbuks-web/sponsor
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

  build:
    needs: test
    if: github.ref == 'refs/heads/1.2/quizbuks' || github.ref == 'refs/heads/1.2/quizbuks-release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-quizbuks" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/quizbuks/Dockerfile
          platforms: linux/amd64
          push: true
          # Both environments run the same image of a commit; only the commit SHA is a tag (no moving "latest").
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=quizbuks
          cache-to: type=gha,mode=max,scope=quizbuks

  deploy:
    needs: build
    # After a successful build, or alone for a manual run with a tag (the build is then skipped).
    if: >-
      !cancelled() && (github.ref == 'refs/heads/1.2/quizbuks' || github.ref == 'refs/heads/1.2/quizbuks-release') &&
      (needs.build.result == 'success' || (inputs.image-tag != '' && needs.build.result == 'skipped'))
    # Protection rules (required reviewers, branch restrictions) and environment-scoped secrets are set per
    # environment in the repository's settings.
    environment:
      name: ${{ github.ref == 'refs/heads/1.2/quizbuks-release' && 'production' || 'staging' }}
      url: >-
        https://${{ github.ref != 'refs/heads/1.2/quizbuks-release' && 'staging.' || ''
        }}${{ vars.QUIZBUKS_BASE_DOMAIN || 'quizbuks.com' }}/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      # Without the server's secrets ssh fails with a bare usage message: name what is missing instead.
      - name: Check the server secrets
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          missing=
          [ -n "$SERVER_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$SERVER_USER" ] || missing="$missing SERVER_USER"
          [ -n "$SSH_KEY" ] || missing="$missing SERVER_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing SERVER_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::secrets not set for this repository or the environment:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      # The tag goes into a command on the server: only a full commit SHA (the only tags the build pushes) is
      # accepted, matched as a whole string so that no second line can follow it.
      - name: Check the image tag and the domain
        shell: bash
        run: |
          if [[ ! $IMAGE_TAG =~ ^[0-9a-f]{40}$ ]]; then
            echo "image tag must be a full commit SHA" >&2
            exit 1
          fi
          domain="$DOMAIN_PREFIX$BASE_DOMAIN"
          # The domain goes into sed and the Caddy site: a plain lower-case host name only.
          if [[ ! $domain =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "not a host name: $domain" >&2
            exit 1
          fi
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"
      # The compose file and site of the deployed commit itself, so that a rollback runs the old image with the files
      # it was released with.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IMAGE_TAG }}
      # A commit from before the two environments has a compose with a fixed project and container name: deploying it
      # as staging would replace production's containers. Such a commit is refused rather than deployed.
      - name: The commit's deploy files take the environment's name
        run: |
          test -f deploy/quizbuks/server/site.caddy.tpl || { echo "no site template in $IMAGE_TAG" >&2; exit 1; }
          grep -q '^name: \${APP_NAME' deploy/quizbuks/server/compose.yaml \
            || { echo "the compose of $IMAGE_TAG does not take APP_NAME" >&2; exit 1; }
      - name: Render the Caddy site
        run: |
          sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__APP_NAME__/$APP_NAME/g" \
            deploy/quizbuks/server/site.caddy.tpl > site.caddy
          if grep -q '__[A-Z_]*__' site.caddy; then echo "unrendered placeholder in site.caddy" >&2; exit 1; fi
          cat site.caddy
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Only the compose file and the site; the server's .env is never touched.
      - name: Upload deploy files
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/$APP_NAME"
          scp deploy/quizbuks/server/compose.yaml "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/compose.yaml"
          scp site.caddy "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/site.caddy"
      # One session: the environment's .env must name this environment (a copied .env naming the other one would make
      # compose replace that environment's containers); the registry login goes into a Docker configuration of this
      # deployment alone (other applications' logins on the shared server are neither replaced nor removed), the
      # deploy script pulls with it, and it is deleted afterwards. The job's token expires with the job anyway.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SERVER_USER@$SERVER_HOST" "set -e
            grep -qx 'APP_NAME=$APP_NAME' /opt/apps/$APP_NAME/.env \\
              || { echo '/opt/apps/$APP_NAME/.env must contain the line APP_NAME=$APP_NAME' >&2; exit 1; }
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u '$REGISTRY_USER' --password-stdin
            /opt/infra/scripts/deploy-app.sh $APP_NAME $IMAGE_TAG"
