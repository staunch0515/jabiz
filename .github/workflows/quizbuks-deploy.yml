name: QuizBuks deploy

# Deploys QuizBuks to the shared Docker server (deploy/quizbuks/DEPLOY.md): every push to the line branch is tested,
# built into one image (the backend with its three front ends) and deployed by the server's deploy-app.sh.
# A manual run with an image tag skips the tests and the build and deploys that tag again (a rollback).
on:
  push:
    branches: ['1.2/quizbuks']
  workflow_dispatch:
    inputs:
      image-tag:
        description: Deploy this existing image tag (a commit SHA) instead of building; empty builds the branch
        type: string
        default: ''

# One deployment at a time; a newer one waits rather than cancelling a deployment in progress.
concurrency:
  group: deploy-${{ github.repository }}-quizbuks
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: quizbuks

jobs:
  # The application's checks: the backend module with its startup checks (platformCheck) and integration tests
  # (Testcontainers postgres:16 on the runner, never the server's database), and the two front ends.
  test:
    if: inputs.image-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew :quizbuks:check
        working-directory: backend
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            quizbuks-web/app/pnpm-lock.yaml
            quizbuks-web/sponsor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: App
        working-directory: quizbuks-web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Sponsor console
        working-directory: quizbuks-web/sponsor
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-quizbuks" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/quizbuks/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=quizbuks
          cache-to: type=gha,mode=max,scope=quizbuks

  deploy:
    needs: build
    # After a successful build, or alone for a manual run with a tag (the build is then skipped).
    if: >-
      !cancelled() &&
      (needs.build.result == 'success' || (inputs.image-tag != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v5
      # The tag goes into a command on the server: only a commit SHA is accepted.
      - name: Check the image tag
        run: |
          if ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "image tag must be a commit SHA: $IMAGE_TAG" >&2
            exit 1
          fi
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Only the compose file and the site; the server's .env is never touched.
      - name: Upload deploy files
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/$APP_NAME"
          scp deploy/quizbuks/server/compose.yaml "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/compose.yaml"
          scp deploy/quizbuks/server/site.caddy "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/site.caddy"
      - name: Registry login on server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SERVER_USER@$SERVER_HOST" \
            "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
      - name: Deploy
        run: ssh "$SERVER_USER@$SERVER_HOST" "/opt/infra/scripts/deploy-app.sh $APP_NAME $IMAGE_TAG"
      # The job's token expires with the job; nothing stays logged in on the server.
      - name: Registry logout on server
        if: always()
        run: ssh "$SERVER_USER@$SERVER_HOST" "docker logout ghcr.io" || true
