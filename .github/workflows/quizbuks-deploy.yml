name: QuizBuks deploy

# Deploys QuizBuks to the shared Docker server (deploy/quizbuks/DEPLOY.md) in two environments from one repository:
#   staging     the line branch 1.3/quizbuks          APP_NAME quizbuks-staging  staging.<base domain>
#   production  the release branch 1.3/quizbuks-release  APP_NAME quizbuks          <base domain>
# Every push to either branch is tested, built into one image (the backend with its three front ends) and deployed by
# the server's deploy-app.sh under that environment's APP_NAME. A manual run with an image tag skips the tests and the
# build and deploys that tag again (a rollback). Other branches never deploy: a manual run from one stops at once.
# Line 1.3 deploys since 2026-10-28 (docs/quizbuks/03-plan.md); line 1.2 is a backup that deploys only by a confirmed
# manual run. A rollback names a commit of line 1.3: 1.2 cannot start on a database that 1.3 has migrated.
on:
  push:
    branches: ['1.3/quizbuks', '1.3/quizbuks-release']
  workflow_dispatch:
    inputs:
      image-tag:
        description: Deploy this existing image tag (a full 40-character commit SHA) instead of building; empty builds the branch
        type: string
        default: ''

# One deployment at a time per branch (environment); a newer one waits rather than cancelling one in progress.
concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The environment follows the branch. The base domain is quizbuks.com unless the repository variable
# QUIZBUKS_BASE_DOMAIN (Settings → Secrets and variables → Actions → Variables) names another. The server's /opt/apps
# appears in the Caddy container at the same path unless QUIZBUKS_CADDY_APPS_DIR names where it is mounted there
# (the maintenance page and its lock file are read by Caddy, DEPLOY.md "维护模式").
env:
  APP_NAME: ${{ github.ref == 'refs/heads/1.3/quizbuks-release' && 'quizbuks' || 'quizbuks-staging' }}
  BASE_DOMAIN: ${{ vars.QUIZBUKS_BASE_DOMAIN || 'quizbuks.com' }}
  CADDY_APPS_DIR: ${{ vars.QUIZBUKS_CADDY_APPS_DIR || '/opt/apps' }}
  DOMAIN_PREFIX: ${{ github.ref == 'refs/heads/1.3/quizbuks-release' && '' || 'staging.' }}

jobs:
  # The application's checks: the backend module with its startup checks (platformCheck) and integration tests
  # (Testcontainers postgres:16 on the runner, never the server's database), and the two front ends.
  test:
    if: (github.ref == 'refs/heads/1.3/quizbuks' || github.ref == 'refs/heads/1.3/quizbuks-release') && inputs.image-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - run: ./gradlew :quizbuks:check
        working-directory: backend
      - run: tools/quizbuks/test/entrypoint.test.sh
      - run: tools/quizbuks/test/check-env.test.sh
      - name: The shared folder is the same in both SPAs
        run: diff -r quizbuks-web/app/src/qb quizbuks-web/sponsor/src/qb
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            quizbuks-web/app/pnpm-lock.yaml
            quizbuks-web/sponsor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: |
          pnpm app:check ../quizbuks-web/app
          pnpm app:check ../quizbuks-web/sponsor
          JABIZ_ADMIN_EXTENSION=../backend/quizbuks/admin-extension pnpm ext:check
        working-directory: frontend
      - name: App
        working-directory: quizbuks-web/app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Sponsor console
        working-directory: quizbuks-web/sponsor
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

  build:
    needs: test
    if: github.ref == 'refs/heads/1.3/quizbuks' || github.ref == 'refs/heads/1.3/quizbuks-release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-quizbuks" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/quizbuks/Dockerfile
          platforms: linux/amd64
          push: true
          # Both environments run the same image of a commit; only the commit SHA is a tag (no moving "latest").
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Shown under the admin's sign-in form, so the running version can be checked at a glance (platform 16z).
          build-args: JABIZ_BUILD_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=quizbuks
          cache-to: type=gha,mode=max,scope=quizbuks

  deploy:
    needs: build
    # After a successful build, or alone for a manual run with a tag (the build is then skipped).
    if: >-
      !cancelled() && (github.ref == 'refs/heads/1.3/quizbuks' || github.ref == 'refs/heads/1.3/quizbuks-release') &&
      (needs.build.result == 'success' || (inputs.image-tag != '' && needs.build.result == 'skipped'))
    # Protection rules (required reviewers, branch restrictions) and environment-scoped secrets are set per
    # environment in the repository's settings.
    environment:
      name: ${{ github.ref == 'refs/heads/1.3/quizbuks-release' && 'production' || 'staging' }}
      url: >-
        https://${{ github.ref != 'refs/heads/1.3/quizbuks-release' && 'staging.' || ''
        }}${{ vars.QUIZBUKS_BASE_DOMAIN || 'quizbuks.com' }}/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      IMAGE_TAG: ${{ inputs.image-tag || github.sha }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      # Without the server's secrets ssh fails with a bare usage message: name what is missing instead.
      - name: Check the server secrets
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          missing=
          [ -n "$SERVER_HOST" ] || missing="$missing SERVER_HOST"
          [ -n "$SERVER_USER" ] || missing="$missing SERVER_USER"
          [ -n "$SSH_KEY" ] || missing="$missing SERVER_SSH_KEY"
          [ -n "$KNOWN_HOSTS" ] || missing="$missing SERVER_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::secrets not set for this repository or the environment:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
      # The tag goes into a command on the server: only a full commit SHA (the only tags the build pushes) is
      # accepted, matched as a whole string so that no second line can follow it.
      - name: Check the image tag, the domain and Caddy's directory
        shell: bash
        run: |
          if [[ ! $IMAGE_TAG =~ ^[0-9a-f]{40}$ ]]; then
            echo "image tag must be a full commit SHA" >&2
            exit 1
          fi
          domain="$DOMAIN_PREFIX$BASE_DOMAIN"
          # The domain goes into sed and the Caddy site: a plain lower-case host name only.
          if [[ ! $domain =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "not a host name: $domain" >&2
            exit 1
          fi
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"
          # Also into sed and the site: an absolute path of plain segments only.
          if [[ ! $CADDY_APPS_DIR =~ ^(/[A-Za-z0-9._-]+)+$ ]]; then
            echo "not a plain absolute path: $CADDY_APPS_DIR" >&2
            exit 1
          fi
      # The compose file and site of the deployed commit itself, so that a rollback runs the old image with the files
      # it was released with.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.IMAGE_TAG }}
      # A commit from before the two environments has a compose with a fixed project and container name: deploying it
      # as staging would replace production's containers. Such a commit is refused rather than deployed.
      - name: The commit's deploy files take the environment's name
        run: |
          test -f deploy/quizbuks/server/site.caddy.tpl || { echo "no site template in $IMAGE_TAG" >&2; exit 1; }
          grep -q '^name: \${APP_NAME' deploy/quizbuks/server/compose.yaml \
            || { echo "the compose of $IMAGE_TAG does not take APP_NAME" >&2; exit 1; }
      - name: Render the Caddy site
        run: |
          sed -e "s/__DOMAIN__/$DOMAIN/g" -e "s/__APP_NAME__/$APP_NAME/g" -e "s|__APP_DIR__|$CADDY_APPS_DIR/$APP_NAME|g" \
            deploy/quizbuks/server/site.caddy.tpl > site.caddy
          if grep -q '__[A-Z_]*__' site.caddy; then echo "unrendered placeholder in site.caddy" >&2; exit 1; fi
          cat site.caddy
      # The Android app's Digital Asset Links (docs/quizbuks/plans/Q49b-android.md), served by the site above until the
      # platform does (17l). Only with both of the environment's variables (Settings → Environments → Variables): the
      # package name and the SHA-256 fingerprints of Play App Signing's app signing key and the upload key; without
      # them the environment has no statement and the upload below removes an earlier one.
      - name: Render the Android app's asset links
        env:
          ANDROID_PACKAGE: ${{ vars.QUIZBUKS_ANDROID_PACKAGE }}
          ANDROID_CERT_SHA256: ${{ vars.QUIZBUKS_ANDROID_CERT_SHA256 }}
        run: |
          if [ ! -f deploy/quizbuks/assetlinks.sh ]; then
            # A commit from before Q49b (a rollback): its site does not serve the file, the server's is left as it is.
            touch assetlinks.keep
          elif [ -n "$ANDROID_PACKAGE" ] && [ -n "$ANDROID_CERT_SHA256" ]; then
            bash deploy/quizbuks/assetlinks.sh "$ANDROID_PACKAGE" "$ANDROID_CERT_SHA256" > assetlinks.json
            cat assetlinks.json
          elif [ -n "$ANDROID_PACKAGE$ANDROID_CERT_SHA256" ]; then
            echo "::error::set both QUIZBUKS_ANDROID_PACKAGE and QUIZBUKS_ANDROID_CERT_SHA256, or neither"
            exit 1
          else
            echo "no Android app configured for this environment"
          fi
      # The site is imported by the server's shared Caddy: one that does not parse would break the reload for every
      # application on the server, so it is checked here before it is uploaded.
      - name: Validate the Caddy site
        run: docker run --rm -v "$PWD/site.caddy:/etc/caddy/site.caddy:ro" caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/site.caddy
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      # Before anything on the server changes: the environment's .env gives every variable this commit needs to start
      # (deploy/quizbuks/server/required-env). Without one, the new image would migrate the database and then fail its
      # startup checks, and the previous image could not start on the migrated database (DEPLOY.md, "从 1.2 切到 1.3").
      # The check runs on the server and names what is missing, never a value; a commit from before it (a rollback) is
      # deployed unchecked.
      - name: Check the server's .env
        run: |
          if [ ! -f deploy/quizbuks/server/check-env.sh ]; then
            echo "this commit has no check of the .env"
            exit 0
          fi
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/$APP_NAME/deploy-check"
          scp deploy/quizbuks/server/check-env.sh deploy/quizbuks/server/required-env \
            "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/deploy-check/"
          ssh "$SERVER_USER@$SERVER_HOST" "sh /opt/apps/$APP_NAME/deploy-check/check-env.sh /opt/apps/$APP_NAME/.env \
            /opt/apps/$APP_NAME/deploy-check/required-env"
      # Only the compose file, the site, the maintenance page and the Android asset links; the server's .env and the
      # maintenance lock file are never touched. A commit from before the maintenance page (a rollback) leaves the page
      # on the server as it is.
      - name: Upload deploy files
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/$APP_NAME/maintenance"
          scp deploy/quizbuks/server/compose.yaml "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/compose.yaml"
          scp site.caddy "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/site.caddy"
          if [ -f deploy/quizbuks/server/maintenance.html ]; then
            scp deploy/quizbuks/server/maintenance.html "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/maintenance/maintenance.html"
          fi
          if [ -f assetlinks.json ]; then
            ssh "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/$APP_NAME/well-known"
            scp assetlinks.json "$SERVER_USER@$SERVER_HOST:/opt/apps/$APP_NAME/well-known/assetlinks.json"
          elif [ ! -f assetlinks.keep ]; then
            ssh "$SERVER_USER@$SERVER_HOST" "rm -f /opt/apps/$APP_NAME/well-known/assetlinks.json"
          fi
      # One session: the environment's .env must name this environment (a copied .env naming the other one would make
      # compose replace that environment's containers); the registry login goes into a Docker configuration of this
      # deployment alone (other applications' logins on the shared server are neither replaced nor removed), the
      # deploy script pulls with it, and it is deleted afterwards. The job's token expires with the job anyway.
      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$SERVER_USER@$SERVER_HOST" "set -e
            grep -qx 'APP_NAME=$APP_NAME' /opt/apps/$APP_NAME/.env \\
              || { echo '/opt/apps/$APP_NAME/.env must contain the line APP_NAME=$APP_NAME' >&2; exit 1; }
            if [ '$APP_NAME' = quizbuks ]; then
              grep -qx 'JABIZ_WEB_ENVIRONMENT=production' /opt/apps/$APP_NAME/.env \\
                || { echo '/opt/apps/$APP_NAME/.env must contain the line JABIZ_WEB_ENVIRONMENT=production (platform 16zd)' >&2; exit 1; }
            elif grep -qix 'JABIZ_WEB_ENVIRONMENT=production' /opt/apps/$APP_NAME/.env; then
              echo '/opt/apps/$APP_NAME/.env says JABIZ_WEB_ENVIRONMENT=production, but $APP_NAME is not production' >&2; exit 1
            fi
            export DOCKER_CONFIG=\$(mktemp -d)
            trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
            docker login ghcr.io -u '$REGISTRY_USER' --password-stdin
            /opt/infra/scripts/deploy-app.sh $APP_NAME $IMAGE_TAG"
