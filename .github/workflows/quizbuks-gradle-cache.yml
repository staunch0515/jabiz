name: QuizBuks Gradle cache
# The Gradle dependencies of the line branch (platform 17zz28, .github/actions/gradle-deps). GitHub keeps a branch's
# caches to that branch: a pull request into '1.3/quizbuks' reads what a push to '1.3/quizbuks' (or the default branch)
# saved, never what '1.3/platform' saved. QuizBuks's checks run on pull requests only (quizbuks.yml) and never save, so
# without this every pull request downloaded the whole set at once and Maven Central answered 429 when several ran
# together (#751). This one job resolves what the application's jobs build and saves it under the build scripts' hash.
on:
  push:
    branches: ['[0-9]*.[0-9]*/quizbuks']
  workflow_dispatch:

# One save at a time per branch; a newer push supersedes a run still resolving.
concurrency:
  group: quizbuks-gradle-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Starts from the newest entry, so only what the build scripts newly ask for is downloaded.
      - uses: ./.github/actions/gradle-deps
      # Compiling every module's tests and packaging the jar resolves the classpaths the pull requests' jobs use
      # (build-application's check, the e2e jobs' bootJar, the docs job's tests); nothing is tested here.
      - run: ./gradlew testClasses :quizbuks:bootJar
        working-directory: backend
      - uses: ./.github/actions/gradle-deps
        with:
          save: 'true'
