# ---- rules and refusals
FIN_ACCOUNT_CODE_FORMAT=An account code is up to 20 digits, capitals and hyphens.
FIN_STATEMENT_LINE_BLANK=Name the statement line.
FIN_DIMENSION_CODE_FORMAT=A code is up to 20 digits, capitals, hyphens and underscores.
FIN_DIMENSION_NAME_BLANK=Enter a name.
FIN_CURRENCY_CODE_FORMAT=A currency is its three-letter ISO 4217 code.
FIN_CURRENCY_NAME_BLANK=Enter the currency's name.
FIN_CURRENCY_MINOR_UNITS=A currency has 0 to 4 decimals.
FIN_EXCHANGE_RATE_POSITIVE=A rate is more than zero.
FIN_EXCHANGE_RATE_SAME_CURRENCY=A rate converts between two different currencies.
FIN_FISCAL_YEAR_DATES=A fiscal year ends after it starts.
FIN_ACCOUNT_CODE_TAKEN=Account {accountCode} already exists.
FIN_ACCOUNT_NOT_FOUND=There is no account {accountCode}.
FIN_ACCOUNT_PARENT_NOT_FOUND=There is no account {accountCode} to roll up into.
FIN_ACCOUNT_HAS_POSTINGS=Account {accountCode} has postings and cannot be deleted; deactivate it instead.
FIN_ACCOUNT_HAS_CHILDREN=Account {accountCode} has sub-accounts and cannot be deleted.
FIN_ACCOUNT_INVALID_VALUE={value} is not allowed here.
FIN_CHART_NOT_EMPTY=The books have accounts already; the template only starts new books.
FIN_FISCAL_YEAR_OVERLAP=Fiscal year {fiscalYear} would overlap fiscal year {other}.
FIN_FISCAL_YEAR_INVALID=Fiscal year {fiscalYear} must start on the first of a month and end in {fiscalYear}.
FIN_PERIOD_NOT_FOUND=There is no period {periodKey}.
FIN_PERIOD_INVALID_STATE={value} is not a state of a period.
FIN_PERIOD_CLOSED=Period closed.
FIN_PERIOD_SOFT_CLOSED=The period is soft-closed: only adjusting entries by the close permission.
FIN_SUBLEDGER_CLOSED=This subledger is closed for the period.
