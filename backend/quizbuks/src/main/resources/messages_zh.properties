# Quiz content: rules and refusals.
QB_QUIZ_TITLE_BLANK=模版需要标题。
QB_QUIZ_TIME_LIMIT_RANGE=时限必须在 {min} 到 {max} 秒之间。
QB_QUESTION_POINTS_RANGE=每题分值为 {min} 到 {max} 分。
QB_MATERIAL_URL_FORMAT=链接必须以 http:// 或 https:// 开头，且不含空白。
QB_QUIZ_CHANGED=模版已在其他窗口中修改（修订号 {revision}）。请重新加载后再试。
QB_CONTENT_NOT_IN_QUIZ=该项不属于此模版。
QB_QUIZ_TOO_MANY_QUESTIONS=每个模版最多 {max} 道题。
QB_QUIZ_TOO_MANY_MATERIALS=每个模版最多 {max} 条资料。
QB_ORDER_MISMATCH=新顺序必须列出模版的每一项且只列一次。请重新加载后再试。
QB_MATERIAL_KIND_FIXED=资料的类型（{kind}）不能更改。
QB_MATERIAL_FIELD_NOT_ALLOWED={kind} 类型的资料没有 {field}。
QB_QUIZ_VERSION_NOT_FOUND=模版没有版本 {versionNo}。
QB_QUIZ_NO_QUESTIONS=模版至少需要一道题。
QB_QUESTION_STEM_REQUIRED=第 {question} 题没有题干。
QB_QUESTION_OPTION_COUNT=第 {question} 题需要 {min} 到 {max} 个选项。
QB_QUESTION_NO_CORRECT=第 {question} 题至少需要一个正确选项。
QB_OPTION_EMPTY=第 {question} 题的选项 {option} 需要文字或图片。
QB_MATERIAL_TITLE_REQUIRED=资料 {material} 需要标题。
QB_MATERIAL_CONTENT_REQUIRED=资料 {material} 没有内容。
QB_MATERIAL_NO_IMAGES=资料 {material} 需要 1 到 {max} 张图片。
QB_QUIZ_VERSION_UNCHANGED=自版本 {label} 以来没有修改。
QB_QUIZ_TOO_LARGE=模版内容过大，无法保存为版本。
