QB_JOURNAL_ACCOUNT_INVALID=以下科目的代码不是以字母或数字开头的 1 至 20 个字母、数字、"."、"_" 或 "-"：{accounts}。
QB_JOURNAL_RECON_NOT_OK=月末之后的每日核对尚未通过。请先处理差异（或等待下一次核对）再导出。
QB_JOURNAL_PERIOD_OPEN={month} 尚未结束（结束于 {endsAt}）。
QB_JOURNAL_PERIOD_NOT_NEXT=下一个要导出的月份是 {next}，不是 {month}。请重新加载页面。
QB_JOURNAL_NOTHING_POSTED=账本中还没有任何分录，没有可导出的月份。
QB_JOURNAL_UNBALANCED=凭证的借方（{debit}）与贷方（{credit}）不相等，未导出。
QB_JOURNAL_ALREADY_CONFIRMED=此导出已记录财务系统的凭证号 {externalVoucherNo}。
QB_JOURNAL_TOO_LARGE=一笔交易的明细（{rows} 行、{bytes} 字节）过大，无法在平台的单次读取与单个文件的限制内保存。请联系平台运维调高 jabiz.process.max-read-rows 或 jabiz.files.generated.max-bytes。
QB_JOURNAL_TRANSACTION_OPEN=另一个数据库事务已打开 {seconds} 秒，其写入的分录可能被遗漏。请几分钟后再试。
QB_RECEIPT_NOT_PAID=只有已到账的充值才能开具收据。
QB_RECEIPT_NO_ISSUER=暂时无法开具收据：运营方信息尚未设置。请稍后再试。
