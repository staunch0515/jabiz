# QuizBuks 文案（backend/quizbuks/CLAUDE.md 第 4 节）。产品显示名只写在这里。
app.name=QuizBuks

# 国家字典的规则代码。
QB_COUNTRY_CODE_FORMAT=国家代码必须是两个大写字母（ISO 3166-1）。
QB_COUNTRY_REGIONS_FORMAT=地区必须以 GLOBAL 开头，其余地区按 JP、CN、US、EUROPE、ASIA、NORTH_AMERICA、SOUTH_AMERICA 的顺序列出、各至多一次，以逗号分隔。

# 实体与字段。
entity.QbCountry=国家
entity.QbCountry.countryId=国家 ID
entity.QbCountry.code=代码
entity.QbCountry.name=名称
entity.QbCountry.regions=地区

# 流程。
process.QB_SETUP=初始化 QuizBuks

# 业务参数。
param.qb.creator-fee-rate=平台抽成比例
param.qb.transfer.threshold=自动转账门槛（Kudos）
param.qb.transfer.review-above=转账人工审核额（Kudos）
param.qb.transfer.enabled=启用自动转账
param.qb.review.sponsor.auto=商家入驻自动通过
param.qb.review.publication.auto=发布自动通过
param.qb.ai.model=AI 模型
param.qb.app.min-version=App 最低版本
