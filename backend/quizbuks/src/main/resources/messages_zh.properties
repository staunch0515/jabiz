# Quiz content: rules and refusals.
QB_QUIZ_TITLE_BLANK=模版需要标题。
QB_QUIZ_TIME_LIMIT_RANGE=时限必须在 {min} 到 {max} 秒之间。
QB_QUESTION_POINTS_RANGE=每题分值为 {min} 到 {max} 分。
QB_MATERIAL_URL_FORMAT=链接必须以 http:// 或 https:// 开头，且不含空白。
QB_QUIZ_CHANGED=模版已在其他窗口中修改（修订号 {revision}）。请重新加载后再试。
QB_CONTENT_NOT_IN_QUIZ=该项不属于此模版。
QB_QUIZ_TOO_MANY_QUESTIONS=每个模版最多 {max} 道题。
QB_QUIZ_TOO_MANY_MATERIALS=每个模版最多 {max} 条资料。
QB_ORDER_MISMATCH=新顺序必须列出模版的每一项且只列一次。请重新加载后再试。
QB_MATERIAL_KIND_FIXED=资料的类型（{kind}）不能更改。
QB_QUIZ_BASE_HAS_TRANSLATIONS=模版有其他语言时不能更改基准语言。请先去掉其他语言。
QB_QUIZ_LANGUAGE_IS_BASE={language} 是模版的基准语言。
QB_TRANSLATION_LANGUAGE={language} 不是模版的其他语言之一。
QB_TRANSLATION_KEY=模版中没有可翻译的 {key}。
QB_TRANSLATION_NO_SOURCE=基准语言在这里没有可翻译的文字。
QB_TRANSLATION_TOO_LONG=译文有 {length} 个字，超过 {max}。
QB_TRANSLATION_FIELD=图片处请给图片，文字处请给文字。
QB_MATERIAL_VARIANT_EXISTS=资料 {material} 已有 {language} 的版本。
QB_MATERIAL_VARIANT_FIXED=资料的语言和它所对应的基准资料不能更改。
QB_QUIZ_KIND_FIXED=模版的类型（{kind}）不能更改：要换类型请复制成新的。
QB_QUESTION_SELECTION_NOT_ALLOWED=只有问卷的题目分单选与多选。
QB_MATERIAL_FIELD_NOT_ALLOWED={kind} 类型的资料没有 {field}。
QB_CONTENT_FILE_NOT_OWN=只能使用自己上传的文件。
QB_QUIZ_FILE_UNSUPPORTED=无法导入此文件（格式版本 {version}；本系统支持 {oldest} 至 {current} 版）。较新版本的文件需要相应版本的@QB_BRAND_NAME@；其他文件不是@QB_BRAND_NAME@的 Quiz 文件。
QB_QUIZ_FILE_VALUE=文件中的某个值不符合 Quiz 的要求：{field}。
QB_QUIZ_FILE_TOO_MANY=文件的 {field} 有 {count} 个，Quiz 最多只能有 {max} 个。
QB_QUIZ_FILE_MISSING=文件用到了文件 {file}，但其中没有包含它。
QB_QUIZ_FILE_TYPE=文件 {file}（{type}）的类型或大小不适用于这个位置。
QB_QUIZ_FILE_NOT_UPLOADED=文件 {file} 还没有为本次导入上传。请重新导入 Quiz 文件。
QB_QUIZ_VERSION_NOT_FOUND=模版没有版本 {versionNo}。
QB_QUIZ_NO_QUESTIONS=模版至少需要一道题。
QB_QUESTION_STEM_REQUIRED=第 {question} 题没有题干。
QB_QUESTION_OPTION_COUNT=第 {question} 题需要 {min} 到 {max} 个选项。
QB_QUESTION_NO_CORRECT=第 {question} 题至少需要一个正确选项。
QB_QUESTION_SELECTION_REQUIRED=请选择第 {question} 题是单选还是多选。
QB_QUESTION_SURVEY_SCORED=问卷的第 {question} 题有分值或正确选项：问卷两者都没有。
QB_OPTION_EMPTY=第 {question} 题的选项 {option} 需要文字或图片。
QB_MATERIAL_TITLE_REQUIRED=资料 {material} 需要标题。
QB_MATERIAL_CONTENT_REQUIRED=资料 {material} 没有内容。
QB_MATERIAL_NO_IMAGES=资料 {material} 需要 1 到 {max} 张图片。
QB_QUIZ_VERSION_UNCHANGED=自版本 {label} 以来没有修改。
QB_QUIZ_TOO_LARGE=模版内容过大，无法保存为版本。
