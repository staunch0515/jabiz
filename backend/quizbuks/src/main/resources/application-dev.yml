# Development only: lets requests name their actor through X-Jabiz-* headers (docs/design/01 section 5).
jabiz:
  dev:
    actor-headers: true
  files:
    local:
      root: ${JABIZ_FILES_LOCAL_ROOT:build/jabiz-files}
# Stripe in development (docs/quizbuks/plans/Q6-payments.md, D-Q6-1): the local stub
# (java tools/quizbuks/stripe-stub/StripeStub.java, port 8093), whose page posts signed events back here with the same
# secret. Fixed values for development only. Against Stripe's real test mode, set STRIPE_API_KEY and
# STRIPE_WEBHOOK_SECRET (the environment wins over these), QB_STRIPE_API_URL=https://api.stripe.com,
# QB_STRIPE_API_HOSTS=api.stripe.com and QB_STRIPE_CHECKOUT_URL_PREFIX=https://checkout.stripe.com/.
  external-services:
    stripe:
      base-url: ${QB_STRIPE_API_URL:http://localhost:8093}
      allowed-hosts: ${QB_STRIPE_API_HOSTS:localhost}
  inbound-webhooks:
    providers:
      stripe:
        scheme: stripe
        secrets: ["${STRIPE_WEBHOOK_SECRET:whsec_development_only_quizbuks_stripe_0000}"]
        event-types: [checkout.session.completed, checkout.session.expired, charge.refunded,
          charge.dispute.created, charge.dispute.closed, transfer.reversed, payout.paid, payout.failed]
      stripe-connect:
        scheme: stripe
        secrets: ["${STRIPE_CONNECT_WEBHOOK_SECRET:whsec_development_only_quizbuks_connect_0000}"]
        event-types: [account.updated, account.application.deauthorized]
STRIPE_API_KEY: sk_test_development_only_quizbuks_stub
# The development credit is kept for development and tests (docs/quizbuks/plans/Q6-payments.md, D-Q6-9): wallets
# credited without money, never in production (a startup check refuses it next to live mode or a live key).
quizbuks:
  links:
    sponsor: ${QB_SPONSOR_LINK:http://localhost:8080/sponsor/}
    app: ${QB_APP_LINK:http://localhost:8080/}
  stripe:
    checkout-url-prefix: ${QB_STRIPE_CHECKOUT_URL_PREFIX:http://localhost:8093/}
    connect-url-prefix: ${QB_STRIPE_CONNECT_URL_PREFIX:http://localhost:8093/}
  wallet:
    dev-credit:
      enabled: true
