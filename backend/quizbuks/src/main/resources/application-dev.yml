# Development only: lets requests name their actor through X-Jabiz-* headers (docs/design/01 section 5).
jabiz:
  dev:
    actor-headers: true
  files:
    local:
      root: ${JABIZ_FILES_LOCAL_ROOT:build/jabiz-files}
# The development credit stands in for top-ups until Q6 (docs/quizbuks/plans/Q5-answering.md, D-Q5-8); never in
# production.
quizbuks:
  wallet:
    dev-credit:
      enabled: true
