# QuizBuks texts (backend/quizbuks/CLAUDE.md section 4). The product's display name is written once here.
app.name=QuizBuks

# Rule codes of the country dictionary.
QB_COUNTRY_CODE_FORMAT=The country code must be two capital letters (ISO 3166-1).
QB_COUNTRY_REGIONS_FORMAT=Regions must start with GLOBAL and list each further region at most once, in the order JP, CN, US, EUROPE, ASIA, NORTH_AMERICA, SOUTH_AMERICA, separated by commas.
# Entities and fields (entity.<Entity>, entity.<Entity>.<field>).
entity.QbCountry=Country
entity.QbCountry.countryId=Country ID
entity.QbCountry.code=Code
entity.QbCountry.name=Name
entity.QbCountry.regions=Regions

# Processes.
process.QB_SETUP=Set up QuizBuks

# Business parameters (param.<key>).
param.qb.creator-fee-rate=Platform commission rate
param.qb.transfer.threshold=Automatic transfer threshold (Kudos)
param.qb.transfer.review-above=Transfers reviewed above (Kudos)
param.qb.transfer.enabled=Automatic transfers on
param.qb.review.sponsor.auto=Approve sponsors without review
param.qb.review.publication.auto=Approve publications without review
param.qb.ai.model=AI model
param.qb.app.min-version=Oldest app version allowed
