# Quiz content: rules and refusals.
QB_QUIZ_TITLE_BLANK=The quiz needs a title.
QB_QUIZ_TIME_LIMIT_RANGE=The time limit must be between {min} and {max} seconds.
QB_QUESTION_POINTS_RANGE=A question is worth {min} to {max} points.
QB_MATERIAL_URL_FORMAT=The link must start with http:// or https:// and contain no spaces.
QB_QUIZ_CHANGED=The quiz was changed in another window (revision {revision}). Reload it and try again.
QB_CONTENT_NOT_IN_QUIZ=This item does not belong to the quiz.
QB_QUIZ_TOO_MANY_QUESTIONS=A quiz has at most {max} questions.
QB_QUIZ_TOO_MANY_MATERIALS=A quiz has at most {max} materials.
QB_ORDER_MISMATCH=The new order must list every item of the quiz once. Reload the quiz and try again.
QB_MATERIAL_KIND_FIXED=A material keeps its kind ({kind}).
QB_MATERIAL_FIELD_NOT_ALLOWED=A material of kind {kind} has no {field}.
QB_QUIZ_VERSION_NOT_FOUND=The quiz has no version {versionNo}.
QB_QUIZ_NO_QUESTIONS=A quiz needs at least one question.
QB_QUESTION_STEM_REQUIRED=Question {question} has no text.
QB_QUESTION_OPTION_COUNT=Question {question} needs {min} to {max} options.
QB_QUESTION_NO_CORRECT=Question {question} needs at least one correct option.
QB_OPTION_EMPTY=Option {option} of question {question} needs text or an image.
QB_MATERIAL_TITLE_REQUIRED=Material {material} needs a title.
QB_MATERIAL_CONTENT_REQUIRED=Material {material} has no content.
QB_MATERIAL_NO_IMAGES=Material {material} needs 1 to {max} images.
QB_QUIZ_VERSION_UNCHANGED=Nothing changed since version {label}.
QB_QUIZ_TOO_LARGE=The quiz is too large to save as a version.
