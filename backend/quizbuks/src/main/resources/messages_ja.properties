process.QB_EXPOSURE_PRICE_SET=運営パートナーの露出料の単価を保存
process.QB_OPERATOR_EXPOSURE_PRICE_SET=自社の露出料の単価を保存
QB_EXPOSURE_PRICE_REQUIRED=単価を入力してください。
QB_EXPOSURE_PRICE_RANGE=0 より大きく、{min} から {max} の単価を入力してください。
QB_EXPOSURE_RANGE_MISSING=露出料の単価の範囲が本部でまだ公開されていません。本部に qb.exposure.unit.min と qb.exposure.unit.max の公開を依頼してください。
QB_EXPOSURE_DEPOSIT_RANGE={purchased} 回の露出を 1 回 {unit} 円で購入すると、税込みで 1 件の料金の上限（{max} 円）を超えます。購入数を減らしてください。
QB_EXPOSURE_PURCHASE_REQUIRED=この公開は他の主催者の動画を使っています。申請の前に露出を {min} 回以上購入してください。
QB_EXPOSURE_PURCHASED_CHANGED=ページを開いてから購入済みの露出が変わりました（現在 {purchased}）。確認してもう一度お試しください。
QB_EXPOSURE_PREPAYMENT_CLOSED=この公開の露出料はすでに精算または返却されています。これ以上露出を購入できません。
QB_EXPOSURE_TOP_UP_RANGE=一度に追加できる露出は最大 {max} 回です。
QB_EXPOSURE_NOT_BOUGHT=露出を追加購入できるのは、露出を購入済みで進行中の公開だけです（審査中の公開は先に取り下げてください）。
QB_EXPOSURE_PARTS_LIMIT=この前払金の分割数が上限に達したため、これ以上追加できません。残りは別の公開で購入してください。
param.qb.exposure.billing.enabled=露出料のスイッチ（公開の申請時に読み取る）
param.qb.exposure.unit.min=露出料：運営パートナーが設定できる 1 回の露出の最低単価（円。仮の値で、スイッチを入れる前に依頼者が確認）
param.qb.exposure.unit.max=露出料：運営パートナーが設定できる 1 回の露出の最高単価（円。仮の値で、依頼者が確認）
param.qb.exposure.min-purchase=露出料：申請時に購入する最低の露出回数（仮の値で、スイッチを入れる前に依頼者が設定）
param.qb.exposure.final.end-grace-sec=露出料：公開の終了後、最終精算まで待つ秒数
param.qb.exposure.unsettled-after-hours=露出料：月の初めから何時間後に、前月が未精算の公開を差異として報告するか
param.qb.exposure.final-missing-after-hours=露出料：公開の終了から何時間後に、最終精算がないものを差異として報告するか
param.qb.exposure.top-up.max=露出料：1 回の追加購入で買える露出回数の上限
param.qb.exposure.low-ratio=露出料：購入済みの露出の残りがこの割合以下になったら主催者に知らせる（0 は知らせない）
