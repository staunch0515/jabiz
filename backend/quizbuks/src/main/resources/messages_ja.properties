# 公開：ルールと拒否。
QB_PUBLICATION_NAME_BLANK=公開には名前が必要です。
QB_PUBLICATION_REGIONS_FORMAT=地域は GLOBAL、JP、CN、US、EUROPE、ASIA、NORTH_AMERICA、SOUTH_AMERICA から、それぞれ1回まで選んでください。
QB_PUBLICATION_TIME_LIMIT_RANGE=制限時間は {min} ～ {max} 秒にしてください。
QB_PUBLICATION_SCORE_RANGE=点数は {min} ～ {max} にしてください。
QB_PUBLICATION_BUDGET_RANGE=予算上限は {min} クドス以上にしてください。
QB_PUBLICATION_MAX_WINNERS_RANGE=最大当選者数は {min} ～ {max} にしてください。
QB_TIER_REWARD_RANGE=報酬を負の値にすることはできません。
QB_PUBLICATION_TIME_ORDER=終了日時は開始日時より後にしてください。
QB_PUBLICATION_NOT_DRAFT=変更できるのは下書きだけです（現在は {status}）。変更するには公開をコピーしてください。
QB_PUBLICATION_ADMIN_PAUSED=この公開は管理者が一時停止しました。再開できるのは管理者だけです。
QB_PUBLICATION_NOT_ADMIN_PAUSED=この公開は主催者自身が一時停止したもので、管理者によるものではありません。
QB_PUBLICATION_SPONSOR_BANNED=この公開の主催者は利用停止中です。再開する前に利用停止を解除してください。
QB_PUBLICATION_TAKEN_DOWN=この公開は管理者により取り下げられたため、コピーできません。
QB_PUBLICATION_REVIEW_REQUIRED=このクイズの公開が管理者により取り下げられたため、この公開は担当者の審査を経てからでないと公開できません。サポートにお問い合わせください。
QB_ACCOUNT_SUSPENDED=アカウントが利用停止されました。
QB_ACCOUNT_DELETED=主催者がアカウントを削除しました。
QB_PUBLICATION_CHANGED=公開は別のウィンドウで変更されました（改訂番号 {revision}）。再読み込みしてからやり直してください。
QB_PUBLICATION_QUIZ_REMOVED=このバージョンのクイズは削除されています。別のバージョンを選んでください。
QB_TIER_NOT_IN_PUBLICATION=この段階はこの公開のものではありません。
QB_REVIEW_NOT_CONFIGURED=審査ルールがまだ有効でないため、審査できません。管理者にお問い合わせください。
QB_SPONSOR_NOT_APPROVED=主催者アカウントはまだ承認されていません。
QB_PUBLICATION_EXPIRED_IN_REVIEW=審査中に終了日時を過ぎました。日時を変更して再度提出してください。
QB_PUBLICATION_SWITCH_NOT_RUNNING=公開中・開始待ち・一時停止中の公開だけがバージョンを切り替えられます。
QB_PUBLICATION_SWITCH_TAKEN_DOWN=この公開は管理者により停止されたため、バージョンを切り替えられません。
QB_PUBLICATION_SWITCH_PENDING=バージョン切り替えの申請がすでに審査中です。結果を待つか、先に取り下げてください。
QB_PUBLICATION_SWITCH_SAME_VERSION=この公開はすでにこのバージョンを使っています。
QB_PUBLICATION_SWITCH_OTHER_QUIZ=同じテンプレートの別のバージョンにだけ切り替えられます。
QB_PUBLICATION_SWITCH_FULL_SCORE=新しいバージョンの満点（{newFullScore}）が公開の満点（{fullScore}）と異なるため、段階が合いません。このバージョンを使うには公開を複製してください。
QB_PUBLICATION_SWITCH_NOT_PENDING=審査中のバージョン切り替えはありません。
QB_PUBLICATION_SWITCH_ENDED=切り替えが承認される前に公開が終了したため、切り替えは取り消されました。
QB_PUBLICATION_SWITCH_PICK=バージョン {label} では一人 {pickCount} 問を出題できません。この公開は同じ配点の {pickCount} 問を抽出するため、新しいバージョンには同じ配点の問題が {pickCount} 問より多く必要です。
QB_PUBLICATION_PICK_RANGE=出題数は 1 からバージョンの問題数（{questionCount}）より一つ少ない数までです。全問出題する場合は空のままにしてください。
QB_PUBLICATION_PICK_REQUIRED=このバージョンは {questionCount} 問あり、1 回の解答は最大 {max} 問です。出題数を設定してください。
QB_PUBLICATION_PICK_TOO_MANY=1 回の解答は最大 {max} 問です。出題数はそれ以下にしてください。
QB_PUBLICATION_PICK_UNEQUAL_POINTS=抽出するにはバージョンの全問題の配点が同じでなければなりません。全員の満点を同じにするためです。
QB_PUBLICATION_PICK_SURVEY=アンケートは全問に回答するもので、抽出はできません。
QB_PUBLICATION_PICK_DIFFICULTY_SHORT=このバージョンの難易度 {difficulty} の問題は {available} 問です。この難易度の出題数はそれ以下にしてください。
QB_PUBLICATION_PICK_DIFFICULTY_UNSET=難易度別に出題するには、バージョンの全問題に難易度が必要です。難易度のない問題が {unset} 問あります。
QB_PUBLICATION_PICK_DIFFICULTY_INVALID=難易度（やさしい・ふつう・むずかしい）ごとに 0 以上の問題数を入力してください。
QB_PUBLICATION_NO_VERSION=クイズのバージョンを選んでください。
QB_PUBLICATION_FIELD_REQUIRED=提出する前に、この項目を入力してください。
QB_PUBLICATION_END_PASSED=終了日時を過ぎています。
QB_PUBLICATION_TOO_LONG=公開期間は最長 {days} 日です。
QB_PASS_SCORE_RANGE=合格点は 0 ～ 満点 {fullScore} にしてください。
QB_BUDGET_BELOW_MAX_REWARD=予算上限（{budgetCap} クドス）が最高報酬（{maxReward} クドス）を下回っています。
QB_REWARD_ABOVE_MAX=ティア {tier} の報酬（{reward} クドス）が許可される最高報酬（{max} クドス）を超えています。
QB_TIER_NOT_FROM_ZERO=最も低い段階は 0 点から始めてください。
QB_TIER_RANGE=第 {tier} 段階の終了点が開始点より前です。
QB_TIER_GAP={fromScore} ～ {toScore} 点をカバーする段階がありません。
QB_TIER_OVERLAP=第 {other} 段階と第 {tier} 段階がどちらも {score} 点をカバーしています。
QB_TIER_NOT_TO_FULL=最も高い段階は満点 {fullScore} で終わるようにしてください。
QB_TIER_NO_REWARD=報酬が 0 より大きい段階が少なくとも1つ必要です。
QB_PUBLICATION_SURVEY_PASS_SCORE=アンケートはすべての問題に回答して完了です。合格点は {fullScore} です。
QB_PUBLICATION_SURVEY_TIERS=アンケートの報酬は完了した回答だけです。段階 {tier} が未完了の回答に報酬を出しています。
