# Q9d：仕訳の出力（勘定科目の対応、集計伝票の CSV）とチャージの領収書。
process.QB_JOURNAL_PREVIEW=次の仕訳出力をプレビュー
process.QB_JOURNAL_EXPORT=次の月の集計伝票を出力
process.QB_JOURNAL_EXPORT_CONFIRM=会計システムの伝票番号を記録
process.QB_JOURNAL_DETAIL_PART=仕訳出力の明細の一部を書き出す
process.QB_TOPUP_RECEIPT_ISSUE=チャージの領収書を発行
QB_JOURNAL_ACCOUNT_UNMAPPED=次の科目に会計システムの勘定科目コードがまだありません：{accounts}。先に勘定科目の対応（管理された変更）で設定してください。
QB_JOURNAL_ACCOUNT_INVALID=次の科目のコードが英数字で始まる 1～20 文字の英数字・「.」「_」「-」ではありません：{accounts}。
QB_JOURNAL_RECON_NOT_OK=月末以降の日次照合がまだ問題なく完了していません。差異を解消する（または次の照合を待つ）まで出力できません。
QB_JOURNAL_PERIOD_OPEN={month} はまだ終わっていません（{endsAt} に終了）。
QB_JOURNAL_PERIOD_NOT_NEXT=次に出力する月は {month} ではなく {next} です。ページを再読み込みしてください。
QB_JOURNAL_NOTHING_POSTED=元帳にまだ仕訳がないため、出力する月がありません。
QB_JOURNAL_UNBALANCED=伝票の借方（{debit}）と貸方（{credit}）が一致しないため、出力しませんでした。
QB_JOURNAL_ALREADY_CONFIRMED=この出力には会計システムの伝票番号 {externalVoucherNo} が記録済みです。
QB_JOURNAL_TOO_LARGE=1 件の取引の明細（{rows} 行、{bytes} バイト）が大きすぎ、プラットフォームの 1 回の読み取りと 1 ファイルの上限に収まりません。プラットフォームの運用者に jabiz.process.max-read-rows または jabiz.files.generated.max-bytes の引き上げを依頼してください。
QB_JOURNAL_TRANSACTION_OPEN=別のデータベーストランザクションが {seconds} 秒間開いたままです。その仕訳が漏れるおそれがあります。数分後にもう一度お試しください。
QB_RECEIPT_NOT_PAID=領収書は入金済みのチャージにのみ発行できます。
QB_RECEIPT_NO_ISSUER=運営者の情報が未設定のため、まだ領収書を発行できません。しばらくしてからお試しください。
QB_RECEIPT_REFUNDED=このチャージは返金済みまたは異議申し立て中（もしくは敗訴）のため、領収書を発行できません。
