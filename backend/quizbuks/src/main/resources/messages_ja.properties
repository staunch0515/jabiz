QB_HELP_DISABLED=AI ヘルプは現在停止しています。質問を担当者に引き継ぐことができます。
QB_HELP_DAILY_LIMIT=本日の AI ヘルプへの質問は上限の {limit} 回に達しました。明日もう一度お試しいただくか、担当者に引き継いでください。
QB_HELP_MONTHLY_LIMIT=AI ヘルプは今月の上限に達しました。質問を担当者に引き継いでください。
QB_HELP_WAITING=前の質問に回答中です。回答をお待ちください。
QB_HELP_CLOSED=この会話は終了しています。新しい会話を始めてください。
QB_HELP_ALREADY_ESCALATED=この会話はすでに担当者に引き継がれています。
QB_HELP_NOT_ESCALATED=返信できるのは担当者に引き継がれた会話だけです。
QB_HELP_ENTRY=ご自身のページから質問してください。テイカーはアプリ、主催者は主催者ページからです。
QB_HELP_NOT_RATABLE=評価できるのは回答または返信だけです。
QB_HELP_TEXT_REQUIRED=内容を入力してください。
QB_HELP_MODEL=AI ヘルプの設定に誤りがあります。質問を担当者に引き継いでください。
QB_HELP_QUIZ_REFUSED=AI ヘルプはクイズの回答には協力できません。
QB_HELP_STOPPED=この質問はプラットフォームで停止されました。もう一度質問するか、担当者に引き継いでください。
qb.help.quiz-refusal=申し訳ありませんが、クイズの問題や答えについてはお手伝いできません。プラットフォームの使い方はご説明できます。
qb.help.no-answer=申し訳ありませんが、この質問にはお答えできるか分かりません。担当者に引き継いでください。
qb.msg.HELP_REPLY.title=サポートから返信がありました
qb.msg.HELP_REPLY.body=ヘルプの会話に担当者から返信がありました。会話を開いてご確認ください。
