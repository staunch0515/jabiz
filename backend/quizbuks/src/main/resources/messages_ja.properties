# QuizBuks の文言（backend/quizbuks/CLAUDE.md 第 4 節）。製品の表示名はここにだけ書く。
app.name=QuizBuks

# 国辞書のルールコード。
QB_COUNTRY_CODE_FORMAT=国コードは大文字 2 文字（ISO 3166-1）で入力してください。
QB_COUNTRY_REGIONS_FORMAT=地域はカンマ区切りの地域コード（GLOBAL、JP、CN、US、EUROPE、ASIA、NORTH_AMERICA、SOUTH_AMERICA）で入力してください。

# エンティティとフィールド。
entity.QbCountry=国
entity.QbCountry.countryId=国 ID
entity.QbCountry.code=コード
entity.QbCountry.name=名称
entity.QbCountry.regions=地域

# プロセス。
process.QB_SETUP=QuizBuks の初期設定

# 業務パラメータ。
param.qb.creator-fee-rate=プラットフォーム手数料率
param.qb.transfer.threshold=自動送金のしきい値（Kudos）
param.qb.transfer.review-above=送金の人手審査額（Kudos）
param.qb.transfer.enabled=自動送金を有効にする
param.qb.review.sponsor.auto=スポンサー登録を自動承認
param.qb.review.publication.auto=公開を自動承認
param.qb.ai.model=AI モデル
param.qb.app.min-version=App の最低バージョン
