# Quiz content: rules and refusals.
QB_QUIZ_TITLE_BLANK=クイズにはタイトルが必要です。
QB_QUIZ_TIME_LIMIT_RANGE=制限時間は {min}〜{max} 秒にしてください。
QB_QUESTION_POINTS_RANGE=配点は {min}〜{max} 点です。
QB_MATERIAL_URL_FORMAT=リンクは http:// または https:// で始まり、空白を含まないでください。
QB_QUIZ_CHANGED=クイズは別の画面で変更されました（リビジョン {revision}）。再読み込みしてからやり直してください。
QB_CONTENT_NOT_IN_QUIZ=この項目はこのクイズに属していません。
QB_QUIZ_TOO_MANY_QUESTIONS=クイズの問題は最大 {max} 問です。
QB_QUIZ_TOO_MANY_MATERIALS=クイズの資料は最大 {max} 件です。
QB_ORDER_MISMATCH=新しい順序にはクイズのすべての項目を一度ずつ含めてください。再読み込みしてからやり直してください。
QB_MATERIAL_KIND_FIXED=資料の種類（{kind}）は変更できません。
QB_MATERIAL_FIELD_NOT_ALLOWED={kind} の資料には {field} はありません。
QB_QUIZ_VERSION_NOT_FOUND=クイズにバージョン {versionNo} はありません。
QB_QUIZ_NO_QUESTIONS=クイズには少なくとも1問必要です。
QB_QUESTION_STEM_REQUIRED=問題 {question} に問題文がありません。
QB_QUESTION_OPTION_COUNT=問題 {question} には {min}〜{max} 個の選択肢が必要です。
QB_QUESTION_NO_CORRECT=問題 {question} には少なくとも1つの正解が必要です。
QB_OPTION_EMPTY=問題 {question} の選択肢 {option} にはテキストか画像が必要です。
QB_MATERIAL_TITLE_REQUIRED=資料 {material} にはタイトルが必要です。
QB_MATERIAL_CONTENT_REQUIRED=資料 {material} に内容がありません。
QB_MATERIAL_NO_IMAGES=資料 {material} には1〜{max} 枚の画像が必要です。
QB_QUIZ_VERSION_UNCHANGED=バージョン {label} から変更はありません。
QB_QUIZ_TOO_LARGE=クイズが大きすぎるため、バージョンとして保存できません。
