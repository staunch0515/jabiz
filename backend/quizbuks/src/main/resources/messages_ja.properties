# Quiz content: rules and refusals.
QB_QUIZ_TITLE_BLANK=クイズにはタイトルが必要です。
QB_QUIZ_TIME_LIMIT_RANGE=制限時間は {min}〜{max} 秒にしてください。
QB_QUESTION_POINTS_RANGE=配点は {min}〜{max} 点です。
QB_MATERIAL_URL_FORMAT=リンクは http:// または https:// で始まり、空白を含まないでください。
QB_QUIZ_CHANGED=クイズは別の画面で変更されました（リビジョン {revision}）。再読み込みしてからやり直してください。
QB_CONTENT_NOT_IN_QUIZ=この項目はこのクイズに属していません。
QB_QUIZ_TOO_MANY_QUESTIONS=クイズの問題は最大 {max} 問です。
QB_QUIZ_TOO_MANY_MATERIALS=クイズの資料は最大 {max} 件です。
QB_ORDER_MISMATCH=新しい順序にはクイズのすべての項目を一度ずつ含めてください。再読み込みしてからやり直してください。
QB_MATERIAL_KIND_FIXED=資料の種類（{kind}）は変更できません。
QB_QUIZ_BASE_HAS_TRANSLATIONS=ほかの言語があるあいだは基準言語を変更できません。先にほかの言語を外してください。
QB_QUIZ_LANGUAGE_IS_BASE={language} はクイズの基準言語です。
QB_TRANSLATION_LANGUAGE={language} はクイズのほかの言語ではありません。
QB_TRANSLATION_KEY=このクイズに翻訳できる {key} はありません。
QB_TRANSLATION_NO_SOURCE=基準言語のここには翻訳する文章がありません。
QB_TRANSLATION_TOO_LONG=訳文が {length} 文字で、上限の {max} を超えています。
QB_TRANSLATION_FIELD=画像の欄には画像を、文章の欄には文章を指定してください。
QB_MATERIAL_VARIANT_EXISTS=資料 {material} にはすでに {language} の版があります。
QB_MATERIAL_VARIANT_FIXED=資料の言語と、対応する基準の資料は変更できません。
QB_QUIZ_KIND_FIXED=クイズの種類（{kind}）は変更できません。別の種類にするには複製してください。
QB_QUESTION_SELECTION_NOT_ALLOWED=単一選択・複数選択はアンケートの問題だけに設定できます。
QB_QUESTION_SURVEY_POINTS_FIXED=アンケートの問題は 1 問 1 点に固定されています。
QB_IMPORT_BATCH_TOO_LARGE=1 回に取り込める問題は {max} 問までです。
QB_IMPORT_QUESTIONS_ONLY=既存のクイズには問題だけを取り込めます。クイズファイル全体は新しいクイズとして取り込んでください。
QB_IMPORT_LANGUAGE=ファイルの問題の言語（{file}）がクイズの言語（{quiz}）と異なります。
QB_IMPORT_UNDONE=この取り込みはすでに取り消されています。
QB_MATERIAL_FIELD_NOT_ALLOWED={kind} の資料には {field} はありません。
QB_CONTENT_FILE_NOT_OWN=ご自身でアップロードしたファイルを使用してください。
QB_QUIZ_FILE_UNSUPPORTED=このファイルはインポートできません（形式バージョン {version}。このシステムが読めるのは {oldest}〜{current} です）。新しいバージョンのファイルにはそのバージョンの@QB_BRAND_NAME@が必要です。それ以外は@QB_BRAND_NAME@のクイズファイルではありません。
QB_QUIZ_FILE_VALUE=ファイル内の値がクイズの条件に合いません：{field}。
QB_QUIZ_FILE_TOO_MANY=ファイルの {field} には {count} 件ありますが、クイズに入れられるのは最大 {max} 件です。
QB_QUIZ_FILE_MISSING=ファイルが使っているファイル {file} が含まれていません。
QB_QUIZ_FILE_TYPE=ファイル {file}（{type}）は、この場所に使える種類またはサイズではありません。
QB_QUIZ_FILE_NOT_UPLOADED=ファイル {file} がこのインポート用にアップロードされていません。クイズファイルをもう一度インポートしてください。
QB_QUIZ_VERSION_NOT_FOUND=クイズにバージョン {versionNo} はありません。
QB_QUIZ_NO_QUESTIONS=クイズには少なくとも1問必要です。
QB_QUESTION_STEM_REQUIRED=問題 {question} に問題文がありません。
QB_QUESTION_OPTION_COUNT=問題 {question} には {min}〜{max} 個の選択肢が必要です。
QB_QUESTION_NO_CORRECT=問題 {question} には少なくとも1つの正解が必要です。
QB_QUESTION_SELECTION_REQUIRED=問題 {question} が単一選択か複数選択かを選んでください。
QB_QUESTION_SURVEY_SCORED=アンケートの問題 {question} に配点または正解があります。アンケートにはどちらもありません。
QB_OPTION_EMPTY=問題 {question} の選択肢 {option} にはテキストか画像が必要です。
QB_MATERIAL_TITLE_REQUIRED=資料 {material} にはタイトルが必要です。
QB_MATERIAL_CONTENT_REQUIRED=資料 {material} に内容がありません。
QB_MATERIAL_NO_IMAGES=資料 {material} には1〜{max} 枚の画像が必要です。
QB_QUIZ_VERSION_UNCHANGED=バージョン {label} から変更はありません。
QB_QUIZ_TOO_LARGE=クイズが大きすぎるため、バージョンとして保存できません。
