# Signing in to the app with Google (docs/quizbuks/plans/QP-pages.md section 2, A-2; platform decision D39), switched
# on by the deployment with the Spring profile "google" (SPRING_PROFILES_ACTIVE=google): a deployment without a
# Google client starts without it. Register an OAuth client (web application) in the Google Cloud console with the
# app's callback, https://<host>/login/oidc, as QB_OIDC_REDIRECT_APP. The client id and secret come from the
# environment only.
#
# Takers only (Q2-16, Q-6): no redirect address for the sponsor console or the administration, so Google is offered
# to the app's entry alone. auto-provision opens a taker's account at the first sign-in with an address Google vouches
# for that nobody uses yet (the app's entry allows registration); an address in use answers OIDC_ACCOUNT_EXISTS, and
# its owner links Google on the account page after signing in the usual way.
jabiz:
  security:
    oidc:
      providers:
        - id: google
          kind: google
          client-id: ${JABIZ_OIDC_GOOGLE_CLIENT_ID}
          client-secret: ${JABIZ_OIDC_GOOGLE_CLIENT_SECRET}
          redirect-uris:
            app: ${QB_OIDC_REDIRECT_APP}
          labels: { en: Google, zh: Google, ja: Google }
          auto-provision: true
