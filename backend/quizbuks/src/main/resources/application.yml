spring:
  application:
    name: quizbuks
  # A JSON request body held in memory: Spring's default (256 KB) is less than a quiz file's content may be (Q16: up
  # to 2 MB of snapshot, ten 20 000-character articles alone are 600 KB in three-byte characters). Uploads are
  # streamed and limited by jabiz.files.*, not by this.
  http:
    codecs:
      max-in-memory-size: 4MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5440/quizbuks}
    username: ${SPRING_R2DBC_USERNAME:quizbuks}
    # No fallback (Q10b): without SPRING_R2DBC_PASSWORD or DB_PASSWORD the start fails. The compose files and
    # tools/quizbuks/local-demo.sh set it; the dev profile has the local database's.
    password: ${DB_PASSWORD}
  flyway:
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5440/quizbuks}
    user: ${SPRING_FLYWAY_USER:quizbuks}
    password: ${DB_PASSWORD}

jabiz:
  # The wallets are the ledger, kept in yen without decimals and shown as Kudos (docs/quizbuks/02-design.md
  # sections 4 and 7.4). The fiscal year is the calendar year, its days those of Japan (platform decision D48 item 2:
  # retention counts from the end of the fiscal year a record's date falls in; Q10b review L7).
  ledger:
    currency: JPY
    scale: 0
  fiscal-year-end: 12
  # Japan's dates: retention's fiscal years (decision D48) and the analytics' days (Q9e).
  fiscal-year-zone: Asia/Tokyo
  process:
    # The queues before a publication's two locks (platform decision D45, Q10a; Q10a4 split them): qb.pub-start before
    # the start lock (QB_ATTEMPT_START), qb.pub before the publication's lock (QB_ATTEMPT_SUBMIT with the publication
    # and the expiry job's QB_ATTEMPT_EXPIRE). Each per publication and instance two in their transaction at once, 50
    # waiting at most 2 s (the platform's defaults, written out here); beyond that 503 PROCESS_BUSY with Retry-After,
    # which the App retries. All keys together hold at most max-active permits (half the pool by default): a hot
    # publication takes up to 4 (docs/quizbuks/perf/Q10a-load-test.md §10). The family's name in brackets keeps its dot.
    admission:
      families:
        "[qb.pub]": { concurrency: 2, max-queue: 50, max-wait: 2s }
        "[qb.pub-start]": { concurrency: 2, max-queue: 50, max-wait: 2s }
    # Per player and instance (decision D45 item 5): far above a person's pace (one start and one submission a quiz),
    # so that only scripts are limited (429 RATE_LIMITED). The App's retries of a busy answer stay below it.
    rate-limits:
      "[QB_ATTEMPT_START]": { per-user: 60, period: 1m }
      "[QB_ATTEMPT_SUBMIT]": { per-user: 60, period: 1m }
      # Q10b (review L2, S-5): the other entries a script could hammer, each far above a person's use. Opening a
      # payout account and starting a top-up call Stripe; the journal's preview reads a month of the ledger; saving
      # answers (the App debounces), first views and a publication's draft are cheap but unbounded otherwise.
      "[QB_PAYOUT_ONBOARD]": { per-user: 5, period: 1h }
      # Q13b: saving a bank account tells whether it is another user's (and tells finance): not a way to look many up.
      "[QB_BANK_ACCOUNT_SAVE]": { per-user: 10, period: 1h }
      # Q29: saving the mail server opens an SMTP connection to the host typed (a test mail): not a probe to loop.
      "[QB_MAIL_SERVER_SET]": { per-user: 10, period: 1h }
      # Q33: loading codes seals up to a thousand of them; not a loop.
      "[QB_DIGITAL_CODES_LOAD]": { per-user: 30, period: 1h }
      # Q39: the audience count is rounded and floored, but narrowing conditions one at a time over many calls is how a
      # count gives a person away: a sponsor checks a few drafts an hour, not hundreds.
      "[QB_AUDIENCE_COUNT]": { per-user: 30, period: 1h }
      "[QB_PUBLICATION_AUDIENCE_SAVE]": { per-user: 120, period: 1h }
      "[QB_PROFILE_ATTRIBUTES_SAVE]": { per-user: 60, period: 1h }
      "[QB_WITHDRAWAL_REQUEST]": { per-user: 20, period: 1h }
      # Q16: importing a quiz file makes a whole draft (up to 100 questions) in one transaction.
      "[QB_QUIZ_IMPORT_CHECK]": { per-user: 60, period: 1h }
      "[QB_QUIZ_IMPORT]": { per-user: 20, period: 1h }
      "[QB_TOPUP_START]": { per-user: 20, period: 1h }
      "[QB_JOURNAL_PREVIEW]": { per-user: 10, period: 1m }
      # Q20: the result page polls it every 5 s while an expired attempt is finished; a script could loop on it.
      "[QB_ATTEMPT_RESULT]": { per-user: 120, period: 1m }
      # Q22b: the console asks for a rotating code once a minute (a few tabs at most); a scan checks and claims once.
      "[QB_REDEEM_CODE_ISSUE]": { per-user: 20, period: 1m }
      "[QB_REDEEM_TOKEN_CHECK]": { per-user: 60, period: 1m }
      "[QB_REDEMPTION_CLAIM]": { per-user: 30, period: 1m }
      "[QB_ATTEMPT_SAVE]": { per-user: 120, period: 1m }
      "[QB_VIEW]": { per-user: 300, period: 1m }
      "[QB_PUBLICATION_SAVE]": { per-user: 60, period: 1m }
      # Q25: a sponsor's invitation list.
      "[QB_INVITATION_ADD]": { per-user: 30, period: 1m }
      "[QB_INVITATION_REMOVE]": { per-user: 60, period: 1m }
      "[QB_INVITATION_SEND]": { per-user: 10, period: 1m }
      # Q7b: accepting the terms after sign-in (a person does it once per change).
      "[QB_CONSENT_ACCEPT]": { per-user: 10, period: 1m }
      # Q7c: marking the inbox (each opening and click) and its settings; a sponsor's notices (sending is also limited
      # per publication by the parameters, Q7-10).
      "[QB_MESSAGE_MARK]": { per-user: 120, period: 1m }
      "[QB_INBOX_READ_ALL]": { per-user: 30, period: 1m }
      "[QB_INBOX_SETTINGS_SAVE]": { per-user: 30, period: 1m }
      "[QB_BROADCAST_SAVE]": { per-user: 60, period: 1m }
      "[QB_BROADCAST_SEND]": { per-user: 10, period: 1h }
      # Q8a: asking the AI costs money (its limits are counted under the sponsor's lock, A-7); accepting reviewed
      # candidates writes up to 20 questions.
      "[QB_AI_QUESTIONS_REQUEST]": { per-user: 5, period: 1m }
      "[QB_AI_ACCEPT]": { per-user: 30, period: 1m }
      # Q8b: covers are asked for as questions are, and a sponsor picks one of three.
      "[QB_AI_COVER_REQUEST]": { per-user: 5, period: 1m }
      "[QB_AI_COVER_ACCEPT]": { per-user: 30, period: 1m }
  # The key signing the integrity seals (docs/design/21-audit-retention.md section 2), from the environment only:
  # Base64, at least 32 bytes. Startup fails without it. Keep a copy: without it the existing seals cannot be verified.
  integrity:
    key: ${JABIZ_INTEGRITY_KEY:}
  security:
    # The key signing access tokens comes from the environment only (docs/design/10-security.md).
    jwt:
      secret: ${JABIZ_JWT_SECRET:}
    # The key encrypting the users' TOTP secrets (docs/design/10-security.md section 9), from the environment only:
    # Base64, at least 32 bytes. Startup fails without it; without it, enrolled users cannot pass their second factor.
    mfa:
      key: ${JABIZ_MFA_KEY:}
    # The key sealing the secrets the application stores (the sponsors' mail server passwords, Q29; platform decision
    # D56), from the environment only: Base64, at least 32 bytes. Startup fails without it (a MailSenderSource is
    # declared). Keep a copy: without it the stored passwords cannot be opened and every sponsor sets theirs again.
    seal:
      key: ${JABIZ_SEAL_KEY:}
    # Sign-in entries (docs/design/10-security.md section 15; decision D36; docs/quizbuks/plans/Q2-accounts.md, D-Q2-1).
    # The administration accepts the administrators' roles only (QB_ADMIN_ROLES, comma-separated; ADMIN is the first
    # administrator's): never QB_TAKER or QB_SPONSOR, which anybody can get by registering (the startup check refuses
    # "*" or a registration role here while registration is on). The app (/) takes takers, who may sign in before
    # verifying their address (to browse; every QuizBuks write needs it verified). The sponsor console (/sponsor/)
    # takes sponsors with a verified address only. Registration needs QB_SETUP to have run (the roles) and mail to be
    # on (jabiz.mail.*), or nobody can verify their address.
    # Sessions per entry (design default Q12; docs/quizbuks/plans/QP-pages.md section 2): the app keeps its taker
    # signed in on the device for 30 days and never locks for idleness (an attempt has its own time limit); the
    # sponsor console and the administration lock after 30 minutes without activity and keep the session in the tab
    # (the administration cannot keep it on the device).
    # The app also signs in by a mailed link (Q15, decision D54): a publication's share link asks only for the address;
    # the link signs the taker in, or opens a verified account (self-registration on), and leads back to /p/<id>.
    entries:
      admin:
        accepted-roles: ${QB_ADMIN_ROLES:ADMIN,QB_ADMIN_SUPER,QB_ADMIN_CONTENT,QB_ADMIN_FINANCE}
        app-path: /admin/
        session:
          idle-timeout: PT30M
      app:
        accepted-roles: QB_TAKER
        self-registration: ${QB_APP_SELF_REGISTRATION:true}
        registration-roles: QB_TAKER
        require-verified-email: false
        email-link: ${QB_APP_EMAIL_LINK:true}
        app-path: /taker/
        session:
          persistence: device
          refresh-token-ttl: P30D
          idle-timeout: 0
      sponsor:
        accepted-roles: QB_SPONSOR
        self-registration: ${QB_SPONSOR_SELF_REGISTRATION:true}
        registration-roles: QB_SPONSOR
        require-verified-email: true
        app-path: /sponsor/
        session:
          persistence: tab
          idle-timeout: PT30M
    # Behind a reverse proxy, its addresses (or CIDR ranges), so that sign-in records keep the client's address. None
    # is an error in live mode unless quizbuks.deploy.direct-exposure says no proxy is in front; a range of every
    # address (0.0.0.0/0, ::/0) always is (Q10b, review M6; wallet.DeploySafetyCheck).
    trusted-proxies: ${JABIZ_TRUSTED_PROXIES:}
    # The first administrator, created at startup when both are set and no user exists yet.
    bootstrap-admin:
      user-name: ${JABIZ_BOOTSTRAP_ADMIN_USER:}
      password: ${JABIZ_BOOTSTRAP_ADMIN_PASSWORD:}
  # Mail (decision D35): verification, password reset, welcome and onboarding mail. Off unless switched on; the
  # server is spring.mail.* (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD). The
  # base address is the host's root: the platform's links go to each entry's own frontend (its app-path, decision
  # D43 item 4). So do the unsubscribe links (decision D52 item 3): the notifications declared for the sponsor console
  # (NotificationMails) lead to /sponsor/mail/unsubscribe, those for the app (the welcome mail) to /taker/mail/unsubscribe,
  # where each SPA mounts @jabiz/ui's MailUnsubscribe; takers and sponsors never need the administration. Any other
  # notification keeps the administration's page (unsubscribe-path), which also keeps the links mailed before working.
  mail:
    enabled: ${JABIZ_MAIL_ENABLED:false}
    from: ${JABIZ_MAIL_FROM:}
    base-url: ${JABIZ_MAIL_BASE_URL:}
    unsubscribe-path: /admin/mail/unsubscribe
    unsubscribe-paths:
      sponsor: mail/unsubscribe
      app: mail/unsubscribe
    # The sponsors' own mail servers (Q29, platform decision D56): the platform checks a public host, a mail port and
    # TLS. The switch accepts a server on this machine with any certificate: for the end-to-end tests only, never set
    # in production (docs/quizbuks/operations.md section 1.4; a startup warning outside dev).
    senders:
      trust-all-for-tests: ${JABIZ_MAIL_SENDERS_TRUST_ALL_FOR_TESTS:false}
  files:
    # Uploaded files (docs/design/14-files.md section 6): a directory of this host, a volume in containers.
    local:
      root: ${JABIZ_FILES_LOCAL_ROOT:}
  # Stripe (docs/quizbuks/plans/Q6-payments.md, D-Q6-1): the API through the platform's client only (decision D38),
  # its key in STRIPE_API_KEY (startup fails without it outside dev). Development and the tests point it at a stub.
  external-services:
    stripe:
      base-url: ${QB_STRIPE_API_URL:https://api.stripe.com}
      allowed-hosts: ${QB_STRIPE_API_HOSTS:api.stripe.com}
    # Claude (docs/quizbuks/plans/Q8-ai.md, D-Q8-1): Anthropic's Messages API, its key in ANTHROPIC_API_KEY only
    # (startup fails without it; the local compose file and local-demo.sh fill a placeholder that the provider refuses,
    # so nothing is spent before a real key is set). AI stays off until qb.ai.enabled = true is proposed and published
    # by a second administrator (a controlled change). Development, the tests and the end-to-end tests point it at the
    # local stub (tools/quizbuks/claude-stub), never the network.
    anthropic:
      base-url: ${QB_ANTHROPIC_API_URL:https://api.anthropic.com}
      allowed-hosts: ${QB_ANTHROPIC_API_HOSTS:api.anthropic.com}
  # Stripe's events (decision D37) at /api/inbound/stripe: the account endpoint's signing secret from the environment
  # only (STRIPE_WEBHOOK_SECRET; to rotate it, deploy/quizbuks/README.md). Startup fails without it.
  # Only the types QuizBuks consumes are stored; others are answered and dropped. The connected accounts' events come
  # to the Connect endpoint only, /api/inbound/stripe-connect, signed with its own secret (STRIPE_CONNECT_WEBHOOK_SECRET,
  # Q6b).
  inbound-webhooks:
    providers:
      stripe:
        scheme: stripe
        secrets: ["${STRIPE_WEBHOOK_SECRET:}"]
        event-types: [checkout.session.completed, checkout.session.expired, charge.refunded,
          charge.dispute.created, charge.dispute.closed, transfer.reversed, payout.paid, payout.failed]
      stripe-connect:
        scheme: stripe
        secrets: ["${STRIPE_CONNECT_WEBHOOK_SECRET:}"]
        event-types: [account.updated, account.application.deauthorized]
  # PDF reports and documents (the monthly reports, the top-up receipts in the sponsor's language; Q9d, D-5): Noto Sans
  # comes with the platform, Chinese and Japanese need TrueType fonts of the host, tried in order (comma-separated).
  # The image sets IPA Gothic (Japanese) and Droid Sans Fallback (Chinese) (deploy/quizbuks/Dockerfile); elsewhere
  # empty, and those characters print as "?" (CSV and Excel are not affected). A configured file that cannot be read
  # fails the startup.
  reports:
    pdf:
      fonts: ${JABIZ_REPORTS_PDF_FONTS:}
  # Anonymous reading (docs/design/15-public-access.md, decision D17; Q7b D-Q7-6): the help centre and the published
  # terms, privacy policy and notice, through the public templates qb.public.* only (GET /api/public/queries/{id}).
  # No public file field exists, so no file is public. JABIZ_PUBLIC_ENABLED=false turns every /api/public/** off (404);
  # the App's and the sponsor console's help and legal pages then show their error.
  public:
    enabled: ${JABIZ_PUBLIC_ENABLED:true}
  i18n:
    # Error messages in English when Accept-Language names none of the application's languages.
    default-locale: en
    bundles: messages
  # The front ends (/taker/, /sponsor/, /admin/ and the business site /biz/), as jabizApp in build.gradle.kts declares
  # them (the startup check WEB compares this list with the jar's). Written here as a whole because the App has a content
  # security policy of its own (docs/guide/app-spa.md section 2): the platform's default plus frame-src for the two video
  # players it shows (Q19, content.VideoEmbeds; YouTube without cookies). The others keep the default.
  # Q30 (docs/quizbuks/plans/Q30-paths.md): the bare address opens the business site (root-redirect, platform 16zf-a),
  # and the app's old addresses at the root (printed QR codes, mailed links from before the move) go on to /taker/.
  web:
    root-redirect: ${JABIZ_WEB_ROOT_REDIRECT:/biz/}
    redirects:
      - { from: /p, to: /taker/p }
      - { from: /play, to: /taker/play }
      - { from: /result, to: /taker/result }
      - { from: /redeem, to: /taker/redeem }
      - { from: /auth, to: /taker/auth }
      - { from: /mail, to: /taker/mail }
      - { from: /login, to: /taker/login }
      - { from: /signup, to: /taker/signup }
      - { from: /password-reset, to: /taker/password-reset }
      - { from: /welcome, to: /taker/welcome }
      - { from: /wallet, to: /taker/wallet }
      - { from: /history, to: /taker/history }
      - { from: /account, to: /taker/account }
      - { from: /inbox, to: /taker/inbox }
      - { from: /legal, to: /taker/legal }
      - { from: /help, to: /taker/help }
      - { from: /about, to: /taker/about }
    spa:
      - path: /taker
        entry: app
        pwa: "on"
        content-security-policy: "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'; worker-src 'self'; manifest-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com"
      - path: /sponsor
        entry: sponsor
        pwa: "off"
      - path: /admin
        entry: admin
        pwa: "off"
      - path: /biz

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:--}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # The health check decides whether a deployment is kept (deploy/quizbuks/DEPLOY.md): it covers the database only,
  # never the mail server, which is outside the server and whose outage must not roll a release back.
  health:
    mail:
      enabled: false

# On a stop (a new release, a restart) requests in progress finish before the application exits; the server's compose
# gives the container more than this to stop.
server:
  shutdown: graceful

# QuizBuks's own settings. The sponsor console's absolute address, where Stripe sends a sponsor back from Checkout;
# /sponsor/ on the host of jabiz.mail.base-url when not set (docs/quizbuks/plans/Q2-accounts.md, D-Q2-7). Mail links
# to each entry's front end by {entryUrl.<entry>} instead (jabiz.mail.base-url and the entry's app-path).
quizbuks:
  links:
    sponsor: ${QB_SPONSOR_LINK:}
    # The app's address, where Stripe sends a taker back after opening a payout account (Q6b); payout accounts are
    # refused without it.
    app: ${QB_APP_LINK:}
  # Stripe (D-Q6-1): test mode until the go-live (and the legal opinion, docs/quizbuks/03-plan.md section 4). The key,
  # Stripe's events and the development credit must agree with the mode (startup check). The API version is pinned on
  # every request; the webhook endpoints in Stripe's dashboard must use the same one.
  stripe:
    livemode: ${QB_STRIPE_LIVEMODE:false}
    api-version: ${QB_STRIPE_API_VERSION:2025-03-31.basil}
    checkout-ttl: ${QB_STRIPE_CHECKOUT_TTL:PT1H}
    # The Stripe account's balance currency (a payment's fee and net come in it). Charges are yen whatever it is; a
    # settlement in another currency is not posted automatically (a task for finance).
    settlement-currency: ${QB_STRIPE_SETTLEMENT_CURRENCY:jpy}
    # Going live refuses to start while test-mode top-ups or a non-zero 2110 are in the database (README go-live),
    # unless this is set on purpose.
    allow-live-with-test-data: ${QB_STRIPE_ALLOW_LIVE_WITH_TEST_DATA:false}
    # Payout accounts (Q6b): opened in this country only (no transfers across borders, Q18); Stripe's onboarding links
    # start with this address.
    connect-country: ${QB_STRIPE_CONNECT_COUNTRY:JP}
    # What a checkout's address must start with (the top-up page sends the sponsor there): Stripe's Checkout. Only a
    # test-mode deployment against a local stub changes it (an https address, or http on localhost / 127.0.0.1);
    # live mode refuses anything but Stripe's (startup check).
    checkout-url-prefix: ${QB_STRIPE_CHECKOUT_URL_PREFIX:https://checkout.stripe.com/}
    connect-url-prefix: ${QB_STRIPE_CONNECT_URL_PREFIX:https://connect.stripe.com/}
  # The daily automatic transfers (Q6b, D-Q6-12): 01:07 UTC, 10:07 in Tokyo; a six-field cron in UTC. Only the
  # end-to-end tests change it (every minute: a large transfer waits for review within a test, Q9c).
  transfers:
    run-cron: ${QB_TRANSFER_RUN_CRON:0 7 1 * * *}
  # The daily reconciliation (F-06): 18:37 UTC, 03:37 in Tokyo. Only the end-to-end tests change it (every minute: the
  # journal export waits for a clean reconciliation after the month's end, Q9d); refused next to live mode.
  reconcile:
    run-cron: ${QB_RECONCILE_RUN_CRON:0 37 18 * * *}
  # The sponsors' analytics (Q9e): every ten minutes, a six-field cron in UTC. Only the end-to-end tests change it
  # (every minute: the analytics pages show a test's attempts within it, Q9e2); refused next to live mode.
  # The schedule is a privacy control (a publication's figures are the job's snapshot; Q9e2 review M1): another value
  # also needs quizbuks.e2e.enabled, and none may run more than once a minute (TransferScheduleCheck).
  analytics:
    run-cron: ${QB_ANALYTICS_RUN_CRON:0 */10 * * * *}
  # The end-to-end tests' switch (Q9e2 review M1): only their deployment sets it; refused next to live mode.
  e2e:
    enabled: ${QB_E2E_ENABLED:false}
  # The journal export (Q9d review M1): another database transaction open this long stops it, since a posting it began
  # before the export's cut-off could commit after the export's reads. At most half of JournalPeriods.SETTLE (10 min).
  journal:
    max-open-transaction: PT5M
  # AI generation (docs/quizbuks/plans/Q8-ai.md, Q8a; operations.md section 7.8). The longest wait for Claude's whole
  # answer (at most two minutes, the platform's longest); an attempt without an answer is charged its estimate.
  # To stop AI in an incident, revoke the key at Anthropic, then switch qb.ai.enabled off (four eyes): that refuses new
  # requests and, through the job types' enabledBy (platform D52 item 4), holds queued and retrying jobs everywhere.
  ai:
    request-timeout: ${QB_AI_REQUEST_TIMEOUT:PT2M}
    max-concurrency: ${QB_AI_MAX_CONCURRENCY:4}
    # Q8b: PDF materials go to Claude as the files themselves: each at most max-bytes (at most 20 MiB). A request
    # reserves max-pages pages (at most 600) of its sponsor's monthly tokens until its job ends; no PDF is parsed here:
    # the provider's token count of the request may not exceed that reservation. A lower max-pages lets more PDF
    # requests run.
    pdf:
      max-bytes: ${QB_AI_PDF_MAX_BYTES:10485760}
      max-pages: ${QB_AI_PDF_MAX_PAGES:100}
  # Invitation-only publications (Q25, docs/quizbuks/plans/Q25-invitations.md): how many addresses one publication's
  # list holds and how many invitations one sponsor queues a day (the days of jabiz.fiscal-year-zone). Deployment
  # settings, not business parameters: a change here moves no scenario's ids.
  invitations:
    max-per-publication: ${QB_INVITATIONS_MAX_PER_PUBLICATION:5000}
    sends-per-day: ${QB_INVITATIONS_SENDS_PER_DAY:2000}
  # Q10b (review M6): true when no reverse proxy is in front of the application, so that no trusted proxy is listed on
  # purpose (deploy/quizbuks/README.md, "密钥与部署").
  deploy:
    direct-exposure: ${QB_DIRECT_EXPOSURE:false}
