# Security for tests only (docs/design/10-security.md): a fixed signing key (never used outside tests) and cheap BCrypt.
jabiz.security.jwt.secret=dGVzdC1vbmx5LWtleS1vZi10aGUtamFiaXotaW50ZWdyYXRpb24tdGVzdHMtMDAwMDA=
jabiz.security.password.bcrypt-strength=4
# Fixed keys of the integrity seals and of the TOTP secrets, for tests only (docs/design/21 section 2, 10 section 9).
jabiz.integrity.key=dGVzdC1vbmx5LWludGVncml0eS1rZXktb2YtdGhlLWphYml6LXRlc3RzLTAwMDAwMA==
jabiz.security.mfa.key=dGVzdC1vbmx5LW1mYS1rZXktb2YtdGhlLWphYml6LWludGVncmF0aW9uLXRlc3RzLTA=
# The key sealing the sponsors' mail server passwords (Q29, platform decision D56), for tests only; the tests' mail
# servers run on this machine without a real certificate (the switch accepts a server on this machine only).
jabiz.security.seal.key=dGVzdC1vbmx5LXNlYWwta2V5LW9mLXRoZS1xdWl6YnVrcy10ZXN0cy0wMDAwMDAw
jabiz.mail.senders.trust-all-for-tests=true
# Tests deliver events and run jobs themselves (docs/design/11-ledger-events-jobs.md): no background polling or timers.
jabiz.events.delivery.enabled=false
jabiz.jobs.scheduler.enabled=false
# Public counters (platform D65, Q60c) are written by the tests themselves (PublicCounters.flush): no timer.
jabiz.public.counters.flush-interval=0s
# Sign-in entries (docs/quizbuks/plans/Q2-accounts.md, D-Q2-1): the tests call the API with tokens of their own
# (TestTokens), so neither entry takes registrations; the classes that register turn it on.
jabiz.security.entries.app.self-registration=false
jabiz.security.entries.sponsor.self-registration=false
# The development credit stands in for top-ups until Q6 (docs/quizbuks/plans/Q5-answering.md, D-Q5-8).
quizbuks.wallet.dev-credit.enabled=true
# Stripe (docs/quizbuks/plans/Q6-payments.md, Q6a), for tests only: fixed fake keys, the API on this machine where
# nothing listens unless a test starts its stub there (StubHttpServer sets its own address), the inbound provider
# with a fixed secret, and the sponsor console where Stripe would send sponsors back. External jobs are run by the
# tests themselves (ExternalJobExecutor.runPending); scenarios write their results (completeExternalJob). The
# top-up tests set the sponsor console (quizbuks.links.sponsor) themselves (mail links to {entryUrl.sponsor} instead).
STRIPE_API_KEY=sk_test_test_only_quizbuks_key
jabiz.external-services.stripe.base-url=http://127.0.0.1:9
jabiz.external-services.stripe.allowed-hosts=127.0.0.1
jabiz.inbound-webhooks.providers.stripe.scheme=stripe
jabiz.inbound-webhooks.providers.stripe.secrets[0]=whsec_test_only_quizbuks_stripe_0123456789
jabiz.inbound-webhooks.providers.stripe.event-types[0]=checkout.session.completed
jabiz.inbound-webhooks.providers.stripe.event-types[1]=checkout.session.expired
jabiz.inbound-webhooks.providers.stripe.event-types[2]=charge.refunded
jabiz.inbound-webhooks.providers.stripe.event-types[3]=charge.dispute.created
jabiz.inbound-webhooks.providers.stripe.event-types[4]=charge.dispute.closed
jabiz.inbound-webhooks.providers.stripe.event-types[5]=transfer.reversed
jabiz.inbound-webhooks.providers.stripe.event-types[6]=payout.paid
jabiz.inbound-webhooks.providers.stripe.event-types[7]=payout.failed
jabiz.inbound-webhooks.providers.stripe-connect.scheme=stripe
jabiz.inbound-webhooks.providers.stripe-connect.secrets[0]=whsec_test_only_quizbuks_connect_0123456789
jabiz.inbound-webhooks.providers.stripe-connect.event-types[0]=account.updated
jabiz.inbound-webhooks.providers.stripe-connect.event-types[1]=account.application.deauthorized
jabiz.inbound-webhooks.providers.stripe-connect.rate-limit.per-minute=10000
jabiz.inbound-webhooks.providers.stripe.rate-limit.per-minute=10000
jabiz.external-jobs.executor.enabled=false
jabiz.external-jobs.simulated-results=true
quizbuks.stripe.checkout-url-prefix=https://checkout.stripe.com/
# Payout accounts (Q6b): where Stripe sends a taker back.
quizbuks.links.app=https://app.quizbuks.test/
# Claude (Q8a), for tests only: a fixed fake key and the API on this machine where nothing listens unless a test
# starts its stub there (AiItSupport); the jobs are run by the tests themselves.
ANTHROPIC_API_KEY=test-only-quizbuks-claude-key
jabiz.external-services.anthropic.base-url=http://127.0.0.1:9
jabiz.external-services.anthropic.allowed-hosts=127.0.0.1
# QuizBuks for Shopify (S1), for tests only: the app's fixed fake key and secret (session tokens and webhooks are
# signed with the secret by the tests), and the shops' Admin API on this machine where nothing listens unless a test
# starts its stub there (ShopifyItSupport sets both addresses).
SHOPIFY_API_KEY=test-only-quizbuks-shopify-key
SHOPIFY_API_SECRET=test_only_quizbuks_shopify_secret_0123456789
jabiz.external-services.shopify.base-url=http://127.0.0.1:9
jabiz.external-services.shopify.allowed-hosts=127.0.0.1
quizbuks.shopify.shop-url=http://127.0.0.1:9/shops/{shop}
jabiz.inbound-webhooks.providers.shopify.rate-limit.per-minute=10000
