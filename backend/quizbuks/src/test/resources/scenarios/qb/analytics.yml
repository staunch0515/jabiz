    input: { changeId: "${p35}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p36}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p37}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p38}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p39}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p40}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p41}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p42}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p43}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p44}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p45}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p46}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p47}" }
  - note: Publications go on without a review (the controlled switch, four eyes).
    actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.review.publication.auto, value: "true" },
      reason: Review switch }
    save: { auto: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${auto}" }

  - note: The people, created by an administrator.
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u1, displayName: Ume, email: u1@example.com }
    save: { u1: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u2, displayName: Ken, email: u2@example.com }
    save: { u2: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u3, displayName: Mio, email: u3@example.com }
    save: { u3: $.userId }
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ken, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u3}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Mio, countryCode: JP, preferredCurrency: JPY }

  - note: Sponsor A is onboarded (Q2); a content administrator approves.
    actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true }
    save: { onboarding: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${onboarding}", decision: APPROVE }
  - deliverEvents: true

  - note: A's quiz (two questions, 2 and 3 points) and a publication, on at once; the development credit.
    setClock: 2026-10-01T01:00:00Z
  - actor: { id: "${a}", permissions: [qb.content.write, qb.publication.write] }
    process: QB_QUIZ_SAVE@latest
    input: { title: World capitals, timeLimitSec: 300 }
    save: { quiz: $.quizId }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of France?, points: 2,
      options: [{ text: Paris, correct: true }, { text: Lyon }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of Japan?, points: 3,
      options: [{ text: Tokyo, correct: true }, { text: Osaka }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { version: $.versionId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${version}"
      name: Capitals week
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 4, reward: 10 }
        - { fromScore: 5, toScore: 5, reward: 100 }
    expectOutput: { problems: [] }
    save: { pub: $.publicationId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${pub}" }
    expectOutput: { status: LIVE, approval: NOT_REQUIRED }
  - process: QB_WALLET_DEV_CREDIT@latest
    input: { sponsorId: "${a}", amount: 1000 }
    expectOutput: { balance: 1000 }

  - note: The job's first run, before anybody took part (Q9e, D-Q9e-2).
    setClock: 2026-10-01T01:05:00Z
  - runJob: { job: qb.analytics, at: 2026-10-01T01:05:00Z }

  - note: Three view the publication, two of them start; U1 passes with full marks, U2's time runs out.
    setClock: 2026-10-01T01:10:00Z
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_VIEW@latest
    input: { publicationId: "${pub}" }
    expectOutput: { firstView: true }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_VIEW@latest
    input: { publicationId: "${pub}" }
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_VIEW@latest
    input: { publicationId: "${pub}" }
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_VIEW@latest
    input: { publicationId: "${pub}" }
    expectOutput: { firstView: false }
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t1: $.attemptId }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t2: $.attemptId }
  - advanceClock: PT1M
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t1}", publicationId: "${pub}", answers: [{ questionNo: 1, selected: [2] }, { questionNo: 2, selected: [2] }] }
    expectOutput: { status: SUBMITTED, score: 5, passed: true, reward: 100, rewardStatus: PAID }
  - setClock: 2026-10-01T01:17:00Z
  - runJob: { job: qb.attempt-expire, items: { succeeded: 1 } }
  - expect: { entity: QbAttempt, id: "${t2}", fields: { status: EXPIRED, score: 0 } }

  - note: >-
      The job adds the hour's increments (five minutes behind: everything up to 01:25) and closes the hour at 02:00
      with nothing new. Two completions are fewer than the minimum group (5): nothing per question is shown yet.
    setClock: 2026-10-01T01:30:00Z
  - runJob: { job: qb.analytics, at: 2026-10-01T01:30:00Z }
  - setClock: 2026-10-01T02:00:00Z
  - runJob: { job: qb.analytics, at: 2026-10-01T02:00:00Z }
  - note: >-
      The sponsor's templates are scoped to the caller's own publications: the installer (who holds every permission)
      reads none of A's (A's own figures are covered by AnalyticsIT).
    expect:
      query: qb.sponsor.analytics.overview
      params: { publicationId: "${pub}" }
      rows: 0
  - expect:
      query: qb.sponsor.analytics.questions
      params: { publicationId: "${pub}" }
      rows: 0
snapshot:
  entities: [QbAnalyticsHour, QbAnalyticsCursor, QbQuestionStat, QbStatsRun, QbPublicationCounter,
    QbPublicationStartCounter, QbPublicationView]
  asOf: end
