# Top-ups (docs/quizbuks/plans/Q6-payments.md, Q6a): QB_SETUP and its proposals (the top-up limits among them),
# the review switch on. Sponsor A publishes a quiz; the development credit pays one top reward, so U1 is paid and U2's
# reward waits (the publication underfunded). A tops up 5,000 Kudos: the job's result (written here, without Stripe)
# opens the checkout; Stripe's signed completion credits it once (the same event again is a duplicate), pays U2 and puts
# the publication back on; the fee's job records Stripe's fee. A second top-up expires. The daily reconciliation finds
# nothing; the wallets, the top-ups and October's monthly reports (Q9c) are read.
name: Top-ups
# The jobs run within the replay's few seconds: the cluster lock must not outlast a run.
properties:
  jabiz.jobs.lock-at-least-for: 0s
  quizbuks.links.sponsor: https://sponsor.quizbuks.test/sponsor/
clock: 2026-10-01T00:00:00Z
actor: { id: installer, permissions: ["*"] }
steps:
  - process: QB_SETUP@latest
    input: {}
    save: { p1: "$.proposals[0]", p2: "$.proposals[1]", p3: "$.proposals[2]", p4: "$.proposals[3]",
      p5: "$.proposals[4]", p6: "$.proposals[5]", p7: "$.proposals[6]", p8: "$.proposals[7]",
      p9: "$.proposals[8]", p10: "$.proposals[9]", p11: "$.proposals[10]",
      p12: "$.proposals[11]" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p1}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p2}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p3}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p4}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p5}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p6}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p7}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p8}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p9}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p10}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p11}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p12}" }
  - expect: { param: qb.topup.min, value: 1000 }
  - expect: { param: qb.topup.max, value: 1000000 }
  - note: Publications go on without a review (the controlled switch, four eyes).
    actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.review.publication.auto, value: "true" },
      reason: Review switch }
    save: { auto: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${auto}" }

  - note: The people, created by an administrator.
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u1, displayName: Ume, email: u1@example.com }
    save: { u1: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u2, displayName: Ken, email: u2@example.com }
    save: { u2: $.userId }
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ken, countryCode: JP, preferredCurrency: JPY }
  - note: Sponsor A is onboarded (Q2); a content administrator approves.
    actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true }
    save: { onboarding: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${onboarding}", decision: APPROVE }
  - deliverEvents: true

  - note: A's quiz and publication, on at once; the development credit is enough for one top reward.
    advanceClock: PT1H
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_SAVE@latest
    input: { title: World capitals, timeLimitSec: 300 }
    save: { quiz: $.quizId }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of France?, points: 2,
      options: [{ text: Paris, correct: true }, { text: Lyon }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of Japan?, points: 3,
      options: [{ text: Tokyo, correct: true }, { text: Osaka }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { version: $.versionId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${version}"
      name: Capitals week
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 4, reward: 10 }
        - { fromScore: 5, toScore: 5, reward: 100 }
    save: { pub: $.publicationId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${pub}" }
    expectOutput: { status: LIVE }
  - process: QB_WALLET_DEV_CREDIT@latest
    input: { sponsorId: "${a}", amount: 100 }
    expectOutput: { balance: 100 }

  - note: U1 and U2 start; U1's full marks are paid, U2's wait for a top-up.
    advanceClock: PT5M
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t1: $.attemptId }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t2: $.attemptId }
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t1}", answers: [{ questionNo: 1, selected: [1] }, { questionNo: 2, selected: [1] }] }
    expectOutput: { reward: 100, rewardStatus: PAID }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t2}", answers: [{ questionNo: 1, selected: [1] }, { questionNo: 2, selected: [1] }] }
    expectOutput: { reward: 100, rewardStatus: PENDING }
  - expect: { entity: QbPublication, id: "${pub}", fields: { status: FUNDS_SHORT } }

  - note: A tops up 5,000 Kudos; the job creating the checkout answers (here without Stripe), and the top-up opens.
    advanceClock: PT5M
  - actor: { id: "${a}", permissions: [qb.topup, qb.sponsor.finance.read] }
    process: QB_TOPUP_START@latest
    input: { amount: 5000 }
    expectOutput: { status: OPENING }
    save: { topup: $.topUpId }
  - completeExternalJob:
      jobType: qb.stripe.checkout-create
      reference: "${topup}"
      result: { id: cs_test_scenario1, status: open, paymentStatus: unpaid, mode: payment, currency: jpy,
        amountTotal: 5000, amountSubtotal: 5000, clientReferenceId: "${topup}", metadataTopUpId: "${topup}",
        metadataSponsorId: "${a}", livemode: false, url: "https://checkout.stripe.com/c/pay/cs_test_scenario1",
        expiresAt: 1790823600 }
  - deliverEvents: true
  - expect: { entity: QbTopUp, id: "${topup}", fields: { status: OPEN, checkoutSessionId: cs_test_scenario1 } }
  - expect:
      query: qb.admin.topups
      rows: 1
      values: [{ amount: 5000, status: OPEN, company: Capitals Inc }]

  - advanceClock: PT2M
  - note: Stripe's signed completion credits the top-up at the record's amount; U2 is paid and the publication is on.
    inbound:
      provider: stripe
      body:
        id: evt_scenario_paid
        object: event
        type: checkout.session.completed
        livemode: false
        data:
          object: { id: cs_test_scenario1, object: checkout.session, status: complete, payment_status: paid,
            mode: payment, currency: jpy, amount_total: 5000, amount_subtotal: 5000,
            client_reference_id: "${topup}", metadata: { topUpId: "${topup}", sponsorId: "${a}" },
            payment_intent: pi_scenario1, livemode: false }
  - deliverEvents: true
  - expect: { entity: QbTopUp, id: "${topup}", fields: { status: PAID, paymentIntentId: pi_scenario1 } }
  - expect: { entity: QbAttempt, id: "${t2}", fields: { rewardStatus: PAID } }
  - expect: { entity: QbPublication, id: "${pub}", fields: { status: LIVE } }
  - note: The same event again is answered and kept once.
    inbound:
      provider: stripe
      outcome: DUPLICATE
      body:
        id: evt_scenario_paid
        object: event
        type: checkout.session.completed
        livemode: false
        data:
          object: { id: cs_test_scenario1, object: checkout.session, status: complete, payment_status: paid,
            mode: payment, currency: jpy, amount_total: 5000, amount_subtotal: 5000,
            client_reference_id: "${topup}", metadata: { topUpId: "${topup}", sponsorId: "${a}" },
            payment_intent: pi_scenario1, livemode: false }
  - deliverEvents: true
  - note: Stripe's fee of the payment (F-04).
    completeExternalJob:
      jobType: qb.stripe.payment-fee
      reference: "${topup}"
      result: { chargeId: ch_scenario1, balanceTransactionId: txn_scenario1, amount: 5000, fee: 180, net: 4820,
        currency: jpy }
  - deliverEvents: true
  - expect: { entity: QbTopUp, id: "${topup}", fields: { stripeFee: 180, netAmount: 4820, chargeId: ch_scenario1 } }

  - note: A second top-up is never paid; Stripe reports its checkout expired.
    advanceClock: PT5M
  - actor: { id: "${a}", permissions: [qb.topup] }
    process: QB_TOPUP_START@latest
    input: { amount: 2000 }
    save: { unpaid: $.topUpId }
  - completeExternalJob:
      jobType: qb.stripe.checkout-create
      reference: "${unpaid}"
      result: { id: cs_test_scenario2, status: open, paymentStatus: unpaid, mode: payment, currency: jpy,
        amountTotal: 2000, amountSubtotal: 2000, clientReferenceId: "${unpaid}", metadataTopUpId: "${unpaid}",
        metadataSponsorId: "${a}", livemode: false, url: "https://checkout.stripe.com/c/pay/cs_test_scenario2",
        expiresAt: 1790823600 }
  - deliverEvents: true
  - advanceClock: PT1H
  - inbound:
      provider: stripe
      body:
        id: evt_scenario_expired
        object: event
        type: checkout.session.expired
        livemode: false
        data:
          object: { id: cs_test_scenario2, object: checkout.session, status: expired, payment_status: unpaid,
            mode: payment, currency: jpy, amount_total: 2000, amount_subtotal: 2000,
            client_reference_id: "${unpaid}", metadata: { topUpId: "${unpaid}", sponsorId: "${a}" },
            livemode: false }
  - deliverEvents: true
  - expect: { entity: QbTopUp, id: "${unpaid}", fields: { status: EXPIRED } }

  - note: The daily reconciliation finds the books in order.
    runJob: { job: qb.reconcile, at: 2026-10-01T18:37:00Z }
  - expect:
      query: qb.admin.recon-runs
      rows: 1
      values: [{ status: OK, itemCount: 0 }]
  - note: >-
      The wallets as the administrators read them (an expectation runs as the scenario's actor; the sponsor's and the
      takers' own templates, scoped to the caller, are covered by TopUpIT).
    expect:
      query: qb.admin.wallets
      params: { kind: SPONSOR }
      rows: 1
      values: [{ company: Capitals Inc, balance: 4900, pendingCount: 0, pendingAmount: 0 }]
  - expect:
      query: qb.admin.topups
      rows: 2
  - note: >-
      October's reports (F-08, Q9c), from the ledger alone: the top-up, Stripe's fee and the two rewards by kind (the
      development credit is of no known kind), every kind on its row; the balances with their checks.
    expect:
      query: qb.admin.monthly
      params: { from: "2026-10-01T00:00:00Z", to: "2026-11-01T00:00:00Z" }
      rows: 12
      values:
        - { category: TOPUP, transactionCount: 1, amount: 5000, stripeBalance: 5000, sponsorWallets: -5000 }
        - { category: REFUND, transactionCount: 0, amount: 0 }
        - { category: DISPUTE, transactionCount: 0, amount: 0 }
        - { category: STRIPE_FEE, transactionCount: 1, amount: 180, stripeBalance: -180, paymentFees: 180 }
        - { category: REWARD, transactionCount: 2, amount: 200, sponsorWallets: 200, takerWallets: -200, revenue: 0 }
        - { category: TRANSFER_SENT, transactionCount: 0 }
        - { category: TRANSFER_SETTLED, transactionCount: 0 }
        - { category: TRANSFER_FAILED, transactionCount: 0 }
        - { category: TRANSFER_REVERSED, transactionCount: 0 }
        - { category: PAYOUT, transactionCount: 0 }
        - { category: PAYOUT_FAILED, transactionCount: 0 }
        - { category: OTHER, transactionCount: 1, amount: 100, stripeBalance: 100, sponsorWallets: -100 }
  - expect:
      query: qb.admin.balances
      params: { from: "2026-10-01T00:00:00Z", to: "2026-11-01T00:00:00Z" }
      rows: 11
      values:
        - { rowKind: ACCOUNT, code: "1110", opening: 0, debit: 5100, credit: 180, closing: 4920 }
        - { rowKind: ACCOUNT, code: "1120", opening: 0, debit: 0, credit: 0, closing: 0 }
        - { rowKind: ACCOUNT, code: "2110", opening: 0, debit: 200, credit: 5100, closing: -4900 }
        - { rowKind: ACCOUNT, code: "2120", opening: 0, debit: 0, credit: 200, closing: -200 }
        - { rowKind: ACCOUNT, code: "2130", closing: 0 }
        - { rowKind: ACCOUNT, code: "4110", closing: 0 }
        - { rowKind: ACCOUNT, code: "5110", debit: 180, closing: 180 }
        - { rowKind: CHECK, code: SPONSOR_WALLETS, closing: -4900, partyTotal: -4900, matches: true }
        - { rowKind: CHECK, code: TAKER_WALLETS, closing: -200, partyTotal: -200, matches: true }
        - { rowKind: CHECK, code: NO_OVERDRAWN_WALLET, closing: 0, matches: true }
        - { rowKind: CHECK, code: BALANCED, debit: 5480, credit: 5480, closing: 0, matches: true }
  - note: >-
      The sponsor's transactions and their totals (Q9b) are scoped to the caller, and an expectation runs as the
      scenario's actor: the installer, with neither publications nor top-ups, sees none of A's rewards and top-ups
      (SponsorTransactionsIT reads A's own).
    expect:
      query: qb.sponsor.transactions
      rows: 0
  - expect:
      query: qb.sponsor.transaction-summary
      rows: 1
      values: [{ totalCount: 0, rewardCompletedAmount: 0, rewardProcessingAmount: 0, topUpCompletedAmount: 0,
        topUpRefundedAmount: 0, topUpFailedCount: 0 }]
snapshot:
  entities: [QbTopUp, QbWallet, QbAttempt, QbReconRun, QbReconItem, LedgerTransaction, LedgerEntry]
  asOf: end
