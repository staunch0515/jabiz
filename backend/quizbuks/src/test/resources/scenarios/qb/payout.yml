  - expect: { param: qb.transfer.fee, value: 0 }
  - note: Transfers on, from 10 Kudos, reviewed above 50; publications without a review (all four eyes).
    actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.transfer.enabled, value: "true" }, reason: Go }
    save: { on: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${on}" }
  - actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.transfer.threshold, value: "10" }, reason: Threshold }
    save: { threshold: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${threshold}" }
  - actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.transfer.review-above, value: "50" }, reason: Review }
    save: { review: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${review}" }
  - actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.review.publication.auto, value: "true" },
      reason: Review switch }
    save: { auto: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${auto}" }

  - note: The people, created by an administrator.
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u1, displayName: Ume, email: u1@example.com }
    save: { u1: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u2, displayName: Ken, email: u2@example.com }
    save: { u2: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u3, displayName: Sora, email: u3@example.com }
    save: { u3: $.userId }
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ken, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u3}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Sora, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true }
    save: { onboarding: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${onboarding}", decision: APPROVE }
  - deliverEvents: true

  - note: A's quiz pays 10 Kudos for 3 points and 100 for full marks.
    advanceClock: PT1H
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_SAVE@latest
    input: { title: World capitals, timeLimitSec: 300 }
    save: { quiz: $.quizId }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of France?, points: 2,
      options: [{ text: Paris, correct: true }, { text: Lyon }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of Japan?, points: 3,
      options: [{ text: Tokyo, correct: true }, { text: Osaka }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { version: $.versionId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${version}"
      name: Capitals week
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 4, reward: 10 }
        - { fromScore: 5, toScore: 5, reward: 100 }
    save: { pub: $.publicationId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${pub}" }
    expectOutput: { status: LIVE }
  - process: QB_WALLET_DEV_CREDIT@latest
    input: { sponsorId: "${a}", amount: 1000 }

  - note: U1 and U3 answer the second question only (10 Kudos), U2 both (100); their wallets follow by events.
    advanceClock: PT5M
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t1: $.attemptId }
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t1}", publicationId: "${pub}", answers: [{ questionNo: 1, selected: [2] }, { questionNo: 2, selected: [2] }] }
    expectOutput: { reward: 10, rewardStatus: PAID }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t2: $.attemptId }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t2}", publicationId: "${pub}", answers: [{ questionNo: 1, selected: [1] }, { questionNo: 2, selected: [1] }] }
    expectOutput: { reward: 100, rewardStatus: PAID }
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${pub}" }
    save: { t3: $.attemptId }
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t3}", publicationId: "${pub}", answers: [{ questionNo: 1, selected: [2] }, { questionNo: 2, selected: [2] }] }
    expectOutput: { reward: 10, rewardStatus: PAID }
  - deliverEvents: true

  - note: Each opens a payout account; the job's result (without Stripe) records it, Stripe's Connect event enables it.
    advanceClock: PT5M
  - actor: { id: "${u1}", permissions: [qb.payout.onboard, qb.me] }
    process: QB_PAYOUT_ONBOARD@latest
    input: {}
  - completeExternalJob:
      jobType: qb.stripe.connect-onboard
      reference: "${u1}"
      result: { accountId: acct_scenario1, accountCountry: JP, livemode: false,
        url: "https://connect.stripe.com/setup/e/acct_scenario1/one", expiresAt: 1790823600 }
  - actor: { id: "${u2}", permissions: [qb.payout.onboard, qb.me] }
    process: QB_PAYOUT_ONBOARD@latest
    input: {}
  - completeExternalJob:
      jobType: qb.stripe.connect-onboard
      reference: "${u2}"
      result: { accountId: acct_scenario2, accountCountry: JP, livemode: false,
        url: "https://connect.stripe.com/setup/e/acct_scenario2/two", expiresAt: 1790823600 }
  - actor: { id: "${u3}", permissions: [qb.payout.onboard, qb.me] }
    process: QB_PAYOUT_ONBOARD@latest
    input: {}
  - completeExternalJob:
      jobType: qb.stripe.connect-onboard
