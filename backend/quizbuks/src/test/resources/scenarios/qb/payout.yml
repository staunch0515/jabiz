      result: { accountId: acct_scenario3, accountCountry: JP, livemode: false,
        url: "https://connect.stripe.com/setup/e/acct_scenario3/three", expiresAt: 1790823600 }
  - deliverEvents: true
  - expect:
      query: qb.admin.payout-accounts
      rows: 3
      values: [{ status: PENDING }, { status: PENDING }, { status: PENDING }]
  - advanceClock: PT1M
  - inbound:
      provider: stripe-connect
      body: { id: evt_scenario_acct1, object: event, type: account.updated, account: acct_scenario1, livemode: false,
        data: { object: { id: acct_scenario1, object: account, country: JP, payouts_enabled: true,
          details_submitted: true, capabilities: { transfers: active }, requirements: { currently_due: [] },
          metadata: { userId: "${u1}" }, livemode: false } } }
  - inbound:
      provider: stripe-connect
      body: { id: evt_scenario_acct2, object: event, type: account.updated, account: acct_scenario2, livemode: false,
        data: { object: { id: acct_scenario2, object: account, country: JP, payouts_enabled: true,
          details_submitted: true, capabilities: { transfers: active }, requirements: { currently_due: [] },
          metadata: { userId: "${u2}" }, livemode: false } } }
  - inbound:
      provider: stripe-connect
      body: { id: evt_scenario_acct3, object: event, type: account.updated, account: acct_scenario3, livemode: false,
        data: { object: { id: acct_scenario3, object: account, country: JP, payouts_enabled: true,
          details_submitted: true, capabilities: { transfers: active }, requirements: { currently_due: [] },
          metadata: { userId: "${u3}" }, livemode: false } } }
  - deliverEvents: true
  - expect:
      query: qb.admin.payout-accounts
      rows: 3
      values: [{ status: ENABLED }, { status: ENABLED }, { status: ENABLED }]

  - note: Within the hold period (qb.transfer.hold-days, 7; Q10b) the rewards stay; nothing is created.
    advanceClock: PT1H
  - actor: { id: system }
    process: QB_TRANSFER_CREATE@latest
    input: { userId: "${u2}" }
    expectOutput: { transferId: null, reason: REWARDS_HELD }
  - note: U2's 100 Kudos need a review a week later; the payee prepared it, finance approves, and it is sent.
    advanceClock: P7D
  - actor: { id: system }
    process: QB_TRANSFER_CREATE@latest
    input: { userId: "${u2}" }
    expectOutput: { status: REVIEW }
    save: { x2: $.transferId, x2request: $.approvalRequestId }
  - actor: { id: finance-admin, permissions: [qb.payout.review, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${x2request}", decision: APPROVE }
  - deliverEvents: true
  - expect: { entity: QbTransfer, id: "${x2}", fields: { status: SENDING } }
  - completeExternalJob:
      jobType: qb.stripe.transfer
      reference: "${x2}"
      result: { found: true, transfer: { id: tr_scenario2, amount: 100, amountReversed: 0, currency: jpy,
        destination: acct_scenario2, transferGroup: "qb-${x2}", metadataTransferId: "${x2}", livemode: false } }
  - deliverEvents: true
  - expect: { entity: QbTransfer, id: "${x2}", fields: { status: SENT, stripeTransferId: tr_scenario2 } }

  - note: U3's transfer is sending; the daily run then finds only U1 (U2 has nothing left, U3 a transfer under way).
    actor: { id: system }
    process: QB_TRANSFER_CREATE@latest
    input: { userId: "${u3}" }
    expectOutput: { status: SENDING }
    save: { x3: $.transferId }
  - runJob: { job: qb.transfer-run, at: 2026-10-02T01:07:00Z }
  - note: The run's transfer of U1, as the creation tells when asked again (one is under way).
    actor: { id: system }
    process: QB_TRANSFER_CREATE@latest
    input: { userId: "${u1}" }
    expectOutput: { status: SENDING, reason: OPEN_TRANSFER }
    save: { x1: $.transferId }
  - completeExternalJob:
      jobType: qb.stripe.transfer
      reference: "${x1}"
      result: { found: true, transfer: { id: tr_scenario1, amount: 10, amountReversed: 0, currency: jpy,
        destination: acct_scenario1, transferGroup: "qb-${x1}", metadataTransferId: "${x1}", livemode: false } }
  - note: Stripe refuses U3's (certain); the sending is reversed and the 10 Kudos are back on U3's balance.
    completeExternalJob:
      jobType: qb.stripe.transfer
      reference: "${x3}"
      status: FAILED
      errorCode: STRIPE_DECLINED
      errorMessage: Stripe answered 400 (transfers_not_allowed)
  - deliverEvents: true
  - expect: { entity: QbTransfer, id: "${x1}", fields: { status: SENT, stripeTransferId: tr_scenario1 } }
  - expect: { entity: QbTransfer, id: "${x3}", fields: { status: FAILED, failureCode: STRIPE_DECLINED } }
  - expect:
      query: qb.admin.transfers
      rows: 3

  - note: The daily reconciliation finds the books in order.
    runJob: { job: qb.reconcile, at: 2026-10-02T18:37:00Z }
  - expect:
      query: qb.admin.recon-runs
      rows: 1
      values: [{ status: OK }]
snapshot:
  entities: [QbPayoutAccount, QbTransfer, QbWallet, QbReconRun, QbReconItem, LedgerTransaction, LedgerEntry]
  asOf: end
