# Payout accounts and transfers (docs/quizbuks/plans/Q6-payments.md, Q6b): QB_SETUP and its proposals (the transfer
# fee and the transfer review among them); transfers switched on with a threshold of 10 Kudos and a review above 50.
# Sponsor A's quiz pays U1 and U3 10 Kudos and U2 100. Each opens a payout account (the job's result written here,
# without Stripe) that Stripe's signed Connect event enables. U2's 100 need a review: approved by finance, sent. U3's
# is under way when the daily run sends U1's; Stripe refuses U3's: reversed. The reconciliation finds the books in order.
