# Question order and difficulty (docs/quizbuks/plans/impl/F-S7.md): QB_SETUP as in play.yml. Sponsor A's quiz of six
# questions of one point, two of each difficulty, keeps the default: its questions are shuffled for each taker (A2-14).
# One publication asks all six, each taker in an order of their own (U1's and U2's differ; the result keeps the
# version's numbers); another draws one question of each difficulty (pickCount 3, full score 3), shuffled too. A draw
# of more hard questions than the version has is refused (PICK_DIFFICULTY_SHORT); a question without a difficulty
# stops a draw by difficulty (PICK_DIFFICULTY_UNSET) until it has one.
name: Question order and difficulty
# The jobs run within the replay's few seconds: the cluster lock must not outlast a run.
