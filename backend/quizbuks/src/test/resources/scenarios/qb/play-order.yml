      options: [{ text: "6", correct: true }, { text: "66" }] }
    save: { six: $.itemId }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { v1: $.versionId }

  - note: A draw by difficulty is refused while a question has none.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${v1}"
      name: One of each
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      pickByDifficulty: { EASY: 1, MEDIUM: 1, HARD: 1 }
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 3, reward: 10 }
    save: { drawn: $.publicationId }
  - expectError:
      actor: { id: "${a}", permissions: [qb.publication.write] }
      process: QB_PUBLICATION_SUBMIT@latest
      input: { publicationId: "${drawn}" }
      status: 422
      ruleCode: QB_PUBLICATION_PICK_DIFFICULTY_UNSET

  - note: The sixth is made hard (in bulk, as the editor does) and a second version saved.
    actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_DIFFICULTY_SET@latest
    input: { quizId: "${quiz}", questionIds: ["${six}"], difficulty: HARD }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { v2: $.versionId }

  - note: Three hard questions are more than the version has.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${v2}"
      name: Too hard
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      pickByDifficulty: { HARD: 3 }
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 3, reward: 10 }
    save: { tooHard: $.publicationId }
  - expectError:
      actor: { id: "${a}", permissions: [qb.publication.write] }
      process: QB_PUBLICATION_SUBMIT@latest
      input: { publicationId: "${tooHard}" }
      status: 422
      ruleCode: QB_PUBLICATION_PICK_DIFFICULTY_SHORT

  - note: One of each difficulty from the second version; and all six, shuffled.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      publicationId: "${drawn}"
      versionId: "${v2}"
      name: One of each
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      budgetCap: 20000
      maxWinners: 100
      pickByDifficulty: { EASY: 1, MEDIUM: 1, HARD: 1 }
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 3, reward: 10 }
    expectOutput: { problems: [] }
  - expect: { entity: QbPublication, id: "${drawn}", fields: { pickCount: 3 } }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${drawn}" }
    expectOutput: { status: LIVE, approval: NOT_REQUIRED }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${v2}"
      name: All six
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 6
      budgetCap: 20000
      maxWinners: 100
      tiers:
        - { fromScore: 0, toScore: 5, reward: 0 }
        - { fromScore: 6, toScore: 6, reward: 10 }
    expectOutput: { problems: [] }
    save: { all: $.publicationId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${all}" }
    expectOutput: { status: LIVE, approval: NOT_REQUIRED }
  - process: QB_WALLET_DEV_CREDIT@latest
    input: { sponsorId: "${a}", amount: 100 }
    expectOutput: { balance: 100 }

  - note: U1 and U2 each get the six questions in an order of their own (the snapshot shows both).
    advanceClock: PT5M
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${all}" }
    expectOutput: { status: IN_PROGRESS, resumed: false }
    save: { u1all: $.attemptId }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${all}" }
    save: { u2all: $.attemptId }
  - note: Continuing gives the same order.
    actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${all}" }
    expectOutput: { attemptId: "${u1all}", resumed: true }
  - note: U1 and U2 answer the first option of every place; each result names the version's numbers.
    advanceClock: PT1M
  - actor: { id: "${u1}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${u1all}", publicationId: "${all}", answers: [{ questionNo: 1, selected: [1] },
      { questionNo: 2, selected: [1] }, { questionNo: 3, selected: [1] }, { questionNo: 4, selected: [1] },
      { questionNo: 5, selected: [1] }, { questionNo: 6, selected: [1] }] }
    expectOutput: { status: SUBMITTED }
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${u2all}", publicationId: "${all}", answers: [{ questionNo: 1, selected: [1] },
      { questionNo: 2, selected: [1] }, { questionNo: 3, selected: [1] }, { questionNo: 4, selected: [1] },
      { questionNo: 5, selected: [1] }, { questionNo: 6, selected: [1] }] }
    expectOutput: { status: SUBMITTED }

  - note: U3 is given one question of each difficulty, in an order of their own.
    actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${drawn}" }
    expectOutput: { status: IN_PROGRESS, resumed: false }
    save: { u3drawn: $.attemptId }
  - advanceClock: PT1M
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${u3drawn}", publicationId: "${drawn}", answers: [{ questionNo: 1, selected: [1] },
      { questionNo: 2, selected: [1] }, { questionNo: 3, selected: [1] }] }
    expectOutput: { status: SUBMITTED }
snapshot:
  # The attempts' results list the questions in the order each was given (the version's numbers); the versions say
  # nothing of the order (shuffled, the default) and the card freezes the draw by difficulty.
  entities: [QbAttempt, QbQuizVersion, QbPublicationCard]
  asOf: end
