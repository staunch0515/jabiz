    input: { changeId: "${o1}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o2}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o3}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o4}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o5}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o6}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o7}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o8}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o9}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${o10}" }


  - note: The tax is 10%, the monthly fee 1,000 yen, and the onboarding credit is on and is 1,100 yen.
    actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.fee.monthly, value: "1000" }, reason: Monthly fee }
    save: { monthly: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${monthly}" }
  - actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.fee-credit.grant.enabled, value: "true" }, reason: Onboarding credit }
    save: { grantOn: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${grantOn}" }
  - actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.fee-credit.grant.basic, value: "1100" }, reason: Onboarding credit covers a month }
    save: { grantBasic: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${grantBasic}" }

  - note: The default operator and its lead; a second operator and its lead.
    actor: { id: installer, permissions: ["*"], mfa: true }
    process: SEC_USER_CREATE@latest
    input: { userName: operator-lead, displayName: Operator lead, email: operator-lead@example.com }
    save: { operatorLead: $.userId }
  - verifyEmail: "${operatorLead}"
  - actor: { id: operators-admin, permissions: [qb.admin.operators.write] }
    process: QB_OPERATOR_SAVE@latest
    input: { name: QuizBuks, contactName: QuizBuks, contactEmail: support@quizbuks.example,
      leadUserId: "${operatorLead}", defaultForNew: true }
    save: { quizbuks: $.operatorId }
  - actor: { id: installer, permissions: ["*"], mfa: true }
    process: SEC_USER_CREATE@latest
    input: { userName: beta-lead, displayName: Beta lead, email: beta-lead@example.com }
    save: { betaLead: $.userId }
  - verifyEmail: "${betaLead}"
  - actor: { id: operators-admin, permissions: [qb.admin.operators.write] }
    process: QB_OPERATOR_SAVE@latest
    input: { name: Beta Quiz, contactName: Beta, contactEmail: beta@example.com, leadUserId: "${betaLead}" }
    save: { beta: $.operatorId }

  - note: Alice, a Sponsor of the default operator (prepaid), and Bob, whom headquarters moves to Beta Quiz (postpaid).
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true }
    save: { applyA: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${applyA}", decision: APPROVE }
  - actor: { id: installer, permissions: ["*"] }
    process: SEC_USER_CREATE@latest
    input: { userName: bob, displayName: Bob, email: bob@example.com }
    save: { b: $.userId }
  - verifyEmail: "${b}"
  - actor: { id: "${b}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Bob, company: Beta Trading, acceptTerms: true }
    save: { applyB: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${applyB}", decision: APPROVE }
  - deliverEvents: true
  - actor: { id: operators-admin, permissions: [qb.admin.operators.write] }
    process: QB_SPONSOR_OPERATOR_ASSIGN@latest
    input: { userId: "${b}", operatorId: "${beta}", reason: Beta Quiz serves Bob }
  - actor: { id: billing-admin, permissions: [qb.fee.billing] }
    process: QB_OPERATOR_BILLING_SET@latest
    input: { userId: "${b}", billingMode: POSTPAID, creditLimit: 50000, reason: Pays after the month }

  - note: Alice's operator's lead confirms her onboarding; the 1,100 of credit is hers.
    advanceClock: PT1H
  - actor: { id: "${operatorLead}", permissions: [qb.fee-credit.onboarding.confirm] }
    process: QB_FEE_CREDIT_ONBOARDING@latest
    input: { sponsorId: "${a}" }
    expectOutput: { granted: true }

  - note: "October's monthly fee of both: Alice's (1,100) is paid by the credit at once, Bob's is on the invoice to come."
    advanceClock: PT1H
  - actor: { id: system }
    process: QB_FEE_MONTHLY_ITEM@latest
    input: { sponsorId: "${a}", period: "2026-10" }
    expectOutput: { outcome: CHARGED }
    save: { chargeA: $.id }
  - actor: { id: system }
    process: QB_FEE_MONTHLY_ITEM@latest
    input: { sponsorId: "${b}", period: "2026-10" }
    expectOutput: { outcome: CHARGED }

  - note: The month ends. November's run invoices Bob's October fee (nothing pays it yet).
    setClock: 2026-11-01T17:05:00Z
  - actor: { id: system }
    process: QB_FEE_INVOICE_ISSUE_ITEM@latest
    input: { sponsorId: "${b}", period: "2026-10" }
    expectOutput: { outcome: ISSUED }
    save: { invoiceB: $.id }

  - note: The operator settlement job of 2 November (02:13 in Japan) settles October for both operators.
    setClock: 2026-11-01T17:30:00Z
  - runJob: { job: qb.operator-settlement, at: 2026-11-01T17:13:00Z }
  - expect:
      query: qb.admin.operator-settlements
      params: { operatorId: "${quizbuks}" }
      rows: 1
      values: [{ month: "2026-10", platformFees: 1000, operatorShare: 500, giftRecovered: 500, giftCarriedOut: 600,
        payable: 0 }]
  - expect:
      query: qb.admin.operator-settlements
      params: { operatorId: "${beta}" }
      rows: 1
      values: [{ month: "2026-10", platformFees: 1000, operatorShare: 500, giftRecovered: 0, giftCarriedOut: 0,
        payable: 500 }]

  - note: November. Finance gives Alice a credit note of 1,000 (1,100 with tax) on October's fee; it gives the credit back.
    setClock: 2026-11-10T01:00:00Z
  - actor: { id: finance, permissions: [qb.fee.manage] }
    process: QB_FEE_REQUEST@latest
    input: { kind: CREDIT_NOTE, chargeId: "${chargeA}", amount: 1000, reason: The quizzes were not published }
    save: { noteApproval: $.approvalRequestId }
  - actor: { id: approver, permissions: [qb.topup.bank.approve, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${noteApproval}", decision: APPROVE }
  - deliverEvents: true

  - note: Bob is granted 1,100 by hand (borne by the platform) and pays October's invoice with it, a month after the fee was counted.
    setClock: 2026-11-12T01:00:00Z
  - actor: { id: finance, permissions: [qb.fee.manage] }
    process: QB_FEE_REQUEST@latest
    input: { kind: CREDIT, sponsorId: "${b}", amount: 1100, validDays: 30, reason: Goodwill for a late start }
    save: { grantApproval: $.approvalRequestId }
  - actor: { id: approver, permissions: [qb.topup.bank.approve, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${grantApproval}", decision: APPROVE }
  - deliverEvents: true
  - actor: { id: "${b}", permissions: [qb.topup] }
    process: QB_FEE_INVOICE_PAY@latest
    input: { invoiceId: "${invoiceB}" }
    expectOutput: { status: PAID }

  - note: "The job of 2 December settles November: Alice's refund of credit and its carry, Bob's late credit."
    setClock: 2026-12-01T17:30:00Z
  - runJob: { job: qb.operator-settlement, at: 2026-12-01T17:13:00Z }
  - expect:
      query: qb.admin.operator-settlements
      params: { operatorId: "${quizbuks}" }
      rows: 2
  - runJob: { job: qb.reconcile, at: 2026-12-01T18:37:00Z }
  - expect:
      query: qb.admin.recon-runs
      rows: 1
      values: [{ status: OK }]
snapshot:
  entities: [QbFeeCharge, QbFeeCreditGrant, QbFeeInvoice, QbFeeCreditNote, QbFeeRequest, QbOperatorSettlement,
    QbOperatorSettlementLine, LedgerTransaction, LedgerEntry, QbReconRun]
  asOf: end
