# Granted credit in the operators' settlement (docs/quizbuks/plans/impl/F-M12.md §3.3-§3.5, L6): QB_SETUP and its
# proposals, the tax at 10%, the monthly fee of 1,000 yen, the onboarding credit on (1,100 yen), the plan keeping half
# of the base for the operator, and the credit's source ONBOARDING borne by the operator (treatment OPERATOR, the default).
#
# 1. QuizBuks (the default operator), Alice, prepaid. October's fee: 1,000 + 100 tax = 1,100, paid by her onboarding
#    credit of 1,100. Settling October (the job of 2 November, 02:13 in Japan): the fee is shared as usual, the
#    operator's share is 500; the credit used (1,100, taken at the rate 1) is taken back, but only 500 is left of the
#    share to take it from: giftRecovered 500, giftCarriedOut 600, payable 0.
#    In November finance gives Alice a credit note of 1,000 (1,100 with tax); it gives the credit back. November's
#    settlement (2 December): the note's own deduction is 500, the credit given back is -1,100, the 600 carried in
#    is taken off it: giftDue -1,100, giftCarriedIn 600, giftRecovered -500, nothing carried, payable 0.
# 2. Beta Quiz, Bob, postpaid. October's fee (1,100) is invoiced on 2 November with nothing to pay it; October is settled
#    with the fee shared as usual (500). On 5 November Bob is granted 1,100 by hand (source MANUAL, borne by the
#    platform) and pays the invoice with it: the credit is used a month after the fee was counted. November's settlement:
#    the part of the fee the platform's credit paid is not shared after all, giftShareDeduction 500 (a cost, more than
#    November's share of 0: carried).
# The daily reconciliation finds nothing at the end.
