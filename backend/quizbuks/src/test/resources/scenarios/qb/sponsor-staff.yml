  - note: Publications go on without a review (the controlled switch, four eyes).
    actor: { id: super-admin, permissions: [control.propose] }
    process: CONTROL_CHANGE_PROPOSE@latest
    input: { targetEntity: SysParam, values: { paramKey: qb.review.publication.auto, value: "true" },
      reason: Review switch }
    save: { auto: $.changeId }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${auto}" }

  - note: The people, created by an administrator. Ume will be A's staff; Ken and Mio win prizes.
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u1, displayName: Ume, email: u1@example.com }
    save: { u1: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u2, displayName: Ken, email: u2@example.com }
    save: { u2: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u3, displayName: Mio, email: u3@example.com }
    save: { u3: $.userId }
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ken, countryCode: JP, preferredCurrency: JPY }
  - actor: { id: "${u3}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Mio, countryCode: JP, preferredCurrency: JPY }

  - note: Sponsor A is onboarded (Q2) and allowed prizes collected at the counter (Q22b).
    actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true }
    save: { onboarding: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${onboarding}", decision: APPROVE }
  - deliverEvents: true
  - actor: { id: methods-admin, permissions: [qb.admin.reward-methods] }
    process: QB_SPONSOR_REWARD_METHODS_SET@latest
    input: { userId: "${a}", methods: [PLATFORM, OFFLINE_REDEEM], note: Counter prizes allowed }

  - note: A's quiz (two questions, 2 and 3 points), a coffee at the counter for a pass.
    advanceClock: PT1H
  - actor: { id: "${a}", permissions: [qb.content.write, qb.publication.write] }
    process: QB_QUIZ_SAVE@latest
    input: { title: World capitals, timeLimitSec: 300 }
    save: { quiz: $.quizId }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of France?, points: 2,
      options: [{ text: Paris, correct: true }, { text: Lyon }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUESTION_SAVE@latest
    input: { quizId: "${quiz}", stem: Capital of Japan?, points: 3,
      options: [{ text: Tokyo, correct: true }, { text: Osaka }] }
  - actor: { id: "${a}", permissions: [qb.content.write] }
    process: QB_QUIZ_PUBLISH_VERSION@latest
    input: { quizId: "${quiz}" }
    save: { version: $.versionId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SAVE@latest
    input:
      versionId: "${version}"
      name: Coffee week
      regions: [JP, ASIA]
      startAt: 2026-10-01T01:00:00Z
      endAt: 2026-10-08T00:00:00Z
      passScore: 3
      maxWinners: 100
      rewardMethod: OFFLINE_REDEEM
      redeemDescription: A coffee at our counter
      tiers:
        - { fromScore: 0, toScore: 2, reward: 0 }
        - { fromScore: 3, toScore: 5, reward: 300 }
    expectOutput: { problems: [] }
    save: { coffee: $.publicationId }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_PUBLICATION_SUBMIT@latest
    input: { publicationId: "${coffee}" }
    expectOutput: { status: LIVE, approval: NOT_REQUIRED }

  - note: Ume gives A the ID the App shows; A looks it up, sees the name and names Ume to the staff.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_SPONSOR_STAFF_FIND@latest
    input: { userId: "${u1}" }
    expectOutput: { displayName: Ume, onStaff: false }
  - actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_SPONSOR_STAFF_ADD@latest
    input: { userId: "${u1}" }
    expectOutput: { changed: true }
  - expectError:
      actor: { id: "${a}", permissions: [qb.publication.write] }
      process: QB_SPONSOR_STAFF_ADD@latest
      input: { userId: "${a}" }
      status: 422
      ruleCode: QB_STAFF_SELF

  - note: Ken wins; Ume shows A's rotating code at the counter and Ken collects at once, handed over by Ume.
    advanceClock: PT5M
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${coffee}" }
    save: { t2: $.attemptId }
  - advanceClock: PT1M
  - actor: { id: "${u2}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t2}", publicationId: "${coffee}",
      answers: [{ questionNo: 1, selected: [2] }, { questionNo: 2, selected: [1] }] }
    expectOutput: { passed: true, rewardStatus: REDEEM }
  - deliverEvents: true
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_STAFF_REDEEM_CODE_ISSUE@latest
    input: {}
    expectOutput: { kind: ROTATING }
    save: { rotating: $.redeemKey }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_REDEEM_TOKEN_CHECK@latest
    input: { scannedKey: "${rotating}" }
    expectOutput: { sponsorCompany: Capitals Inc, kind: ROTATING }
    save: { kenPrize: "$.prizes[0].redemptionId" }
  - actor: { id: "${u2}", permissions: [qb.me] }
    process: QB_REDEMPTION_CLAIM@latest
    input: { scannedKey: "${rotating}", redemptionId: "${kenPrize}" }
    expectOutput: { status: REDEEMED }
  - deliverEvents: true

  - note: Mio wins and scans A's printed poster; Ume confirms the claim at the counter.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_REDEEM_CODE_ISSUE@latest
    input: { kind: PRINTED }
    save: { printed: $.redeemKey }
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_START@latest
    input: { publicationId: "${coffee}" }
    save: { t3: $.attemptId }
  - advanceClock: PT1M
  - actor: { id: "${u3}", permissions: [qb.play, qb.me] }
    process: QB_ATTEMPT_SUBMIT@latest
    input: { attemptId: "${t3}", publicationId: "${coffee}",
      answers: [{ questionNo: 1, selected: [2] }, { questionNo: 2, selected: [2] }] }
    expectOutput: { passed: true, rewardStatus: REDEEM }
  - deliverEvents: true
  - actor: { id: "${u3}", permissions: [qb.me] }
    process: QB_REDEEM_TOKEN_CHECK@latest
    input: { scannedKey: "${printed}" }
    save: { mioPrize: "$.prizes[0].redemptionId" }
  - actor: { id: "${u3}", permissions: [qb.me] }
    process: QB_REDEMPTION_CLAIM@latest
    input: { scannedKey: "${printed}", redemptionId: "${mioPrize}" }
    expectOutput: { status: CLAIMED }
  - deliverEvents: true
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_STAFF_REDEMPTION_CONFIRM@latest
    input: { redemptionId: "${mioPrize}" }
    expectOutput: { status: REDEEMED }
  - deliverEvents: true
  - expect: { entity: QbRedemption, id: "${kenPrize}", fields: { status: REDEEMED, redeemedBy: "${u1}" } }
  - expect: { entity: QbRedemption, id: "${mioPrize}", fields: { status: REDEEMED, redeemedBy: "${u1}" } }

  - note: A takes Ume off the staff; Ume's counter is closed at once.
    actor: { id: "${a}", permissions: [qb.publication.write] }
    process: QB_SPONSOR_STAFF_REMOVE@latest
    input: { userId: "${u1}" }
    expectOutput: { changed: true }
  - expectError:
      actor: { id: "${u1}", permissions: [qb.me] }
      process: QB_STAFF_REDEEM_CODE_ISSUE@latest
      input: {}
      status: 422
      ruleCode: QB_NOT_STAFF
snapshot:
  entities: [QbSponsorStaff, QbRedemption, QbMessage]
  asOf: end
