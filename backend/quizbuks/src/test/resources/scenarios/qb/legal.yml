# Terms and consent (docs/quizbuks/plans/Q7-messages-legal.md, Q7b): QB_SETUP creates the drafts of the legal texts
# (marked test placeholders) and nothing is published; a content administrator (with a second factor) publishes the
# takers' terms, the sponsors' terms and the privacy policy. A taker accepts them on the welcome step (refused without),
# a sponsor with the application. The sponsors' terms change: version 2, which asks for consent again, is published to
# take effect a week later. Before then the sponsor tops up as before; once it is in effect a top-up is refused until
# the sponsor accepts it, then goes on.
name: Terms and consent
properties:
  quizbuks.links.sponsor: https://sponsor.quizbuks.test/sponsor/
clock: 2026-10-01T00:00:00Z
actor: { id: installer, permissions: ["*"] }
steps:
  - process: QB_SETUP@latest
    input: {}
    save: { p1: "$.proposals[0]", p2: "$.proposals[1]", p3: "$.proposals[2]", p4: "$.proposals[3]",
      p5: "$.proposals[4]", p6: "$.proposals[5]", p7: "$.proposals[6]", p8: "$.proposals[7]", p9: "$.proposals[8]",
      p10: "$.proposals[9]", p11: "$.proposals[10]", p12: "$.proposals[11]", p13: "$.proposals[12]",
      p14: "$.proposals[13]", p15: "$.proposals[14]", p16: "$.proposals[15]", p17: "$.proposals[16]",
      p18: "$.proposals[17]", p19: "$.proposals[18]", p20: "$.proposals[19]", p21: "$.proposals[20]",
      p22: "$.proposals[21]", p23: "$.proposals[22]", p24: "$.proposals[23]",
      p25: "$.proposals[24]", p26: "$.proposals[25]", p27: "$.proposals[26]", p28: "$.proposals[27]",
      p29: "$.proposals[28]", p30: "$.proposals[29]", p31: "$.proposals[30]",
      p32: "$.proposals[31]", p33: "$.proposals[32]", p34: "$.proposals[33]",
      p35: "$.proposals[34]", p36: "$.proposals[35]", p37: "$.proposals[36]", p38: "$.proposals[37]",
      p39: "$.proposals[38]", p40: "$.proposals[39]", p41: "$.proposals[40]", p42: "$.proposals[41]",
      p43: "$.proposals[42]", p44: "$.proposals[43]", p45: "$.proposals[44]", p46: "$.proposals[45]", p47: "$.proposals[46]",
      termsApp: "$.legalDraftIds[0]", termsSponsor: "$.legalDraftIds[1]", privacy: "$.legalDraftIds[2]" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p1}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p2}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p3}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p4}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p5}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p6}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p7}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p8}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p9}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p10}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p11}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p12}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p13}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p14}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p15}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p16}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p17}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p18}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p19}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p20}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p21}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p22}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p23}" }
