    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p38}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p39}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p40}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p41}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p42}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p43}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p44}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p45}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p46}" }
  - process: CONTROL_CHANGE_PUBLISH@latest
    actor: { id: publisher, permissions: [control.publish] }
    input: { changeId: "${p47}" }

  - note: Nothing is published yet; the content administrator publishes the three texts, in effect at once.
    actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${termsApp}", baseRevision: 1 }
    expectOutput: { kind: TERMS_APP, versionNo: 1, requiresConsent: true }
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${termsSponsor}", baseRevision: 1 }
    expectOutput: { kind: TERMS_SPONSOR, versionNo: 1 }
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${privacy}", baseRevision: 1 }
    expectOutput: { kind: PRIVACY, versionNo: 1 }

  - note: The people, created by an administrator.
    process: SEC_USER_CREATE@latest
    input: { userName: alice, displayName: Alice, email: alice@example.com }
    save: { a: $.userId }
  - process: SEC_USER_CREATE@latest
    input: { userName: u1, displayName: Ume, email: u1@example.com }
    save: { u1: $.userId }
  - note: The welcome step needs the terms accepted, at the versions in effect.
    expectError:
      actor: { id: "${u1}", permissions: [qb.me] }
      process: QB_PROFILE_SAVE@latest
      input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY }
      status: 422
      ruleCode: QB_TERMS_REQUIRED
  - expectError:
      actor: { id: "${u1}", permissions: [qb.me] }
      process: QB_PROFILE_SAVE@latest
      input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY, acceptTerms: true, termsVersionNo: 2,
        privacyVersionNo: 1 }
      status: 422
      ruleCode: QB_TERMS_OUTDATED
  - actor: { id: "${u1}", permissions: [qb.me] }
    process: QB_PROFILE_SAVE@latest
    input: { displayName: Ume, countryCode: JP, preferredCurrency: JPY, acceptTerms: true, termsVersionNo: 1,
      privacyVersionNo: 1 }
    expectOutput: { created: true }
  - note: Sponsor A applies accepting the sponsors' terms; a content administrator approves.
    actor: { id: "${a}", permissions: [qb.sponsor.me] }
    process: QB_SPONSOR_APPLY@latest
    input: { displayName: Alice, company: Capitals Inc, acceptTerms: true, termsVersionNo: 1, privacyVersionNo: 1 }
    save: { onboarding: $.approvalRequestId }
  - actor: { id: content-admin, permissions: [qb.review.sponsor, approval.decide] }
    process: APPROVAL_DECIDE@latest
    input: { requestId: "${onboarding}", decision: APPROVE }
  - deliverEvents: true

  - note: The sponsors' terms change; version 2 asks for consent again and takes effect on October 8.
    advanceClock: PT1H
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: UPDATE_ENTITY@latest
    input:
      entityType: QbLegalDoc
      id: "${termsSponsor}"
      version: 2
      attributes:
        body: { en: "[TEST PLACEHOLDER] Sponsor terms, version 2.", ja: "[TEST PLACEHOLDER] スポンサー利用規約 第 2 版。" }
        changeSummary: { en: Fees are explained., ja: 手数料を説明しました。 }
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${termsSponsor}", effectiveAt: 2026-10-08T00:00:00Z, requiresConsent: true, baseRevision: 3 }
    expectOutput: { kind: TERMS_SPONSOR, versionNo: 2, effectiveAt: 2026-10-08T00:00:00Z }
  - note: Before it takes effect, A tops up as before.
    actor: { id: "${a}", permissions: [qb.topup, qb.sponsor.finance.read] }
    process: QB_TOPUP_START@latest
    input: { amount: 1000 }
    expectOutput: { status: OPENING }

  - note: On October 9 version 2 is in effect; A's top-up waits for A's consent.
    setClock: 2026-10-09T00:00:00Z
  - expectError:
      actor: { id: "${a}", permissions: [qb.topup, qb.sponsor.finance.read] }
      process: QB_TOPUP_START@latest
      input: { amount: 1000 }
      status: 422
      ruleCode: QB_CONSENT_REQUIRED
  - actor: { id: "${a}", permissions: [qb.account.read, qb.sponsor.me] }
    process: QB_CONSENT_ACCEPT@latest
    input: { items: [{ kind: TERMS_SPONSOR, versionNo: 2 }] }
    expectOutput: { recorded: [TERMS_SPONSOR] }
  - actor: { id: "${a}", permissions: [qb.topup, qb.sponsor.finance.read] }
    process: QB_TOPUP_START@latest
    input: { amount: 1000 }
    expectOutput: { status: OPENING }
  - expect:
      query: qb.admin.consents
      params: { userId: "${a}" }
      rows: 3
      values: [{ kind: TERMS_SPONSOR, versionNo: 2, source: RECONSENT }]
  - expect:
      query: qb.public.legal-history
      params: { kind: TERMS_SPONSOR }
      rows: 2

  - note: >-
      A change of the privacy policy is announced for December 1 by mistake and withdrawn before then (review M1); it
      never takes effect, nobody is asked, and the next version is number 3.
    actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: UPDATE_ENTITY@latest
    input:
      entityType: QbLegalDoc
      id: "${privacy}"
      version: 2
      attributes:
        body: { en: "[TEST PLACEHOLDER] Privacy policy, version 2.", ja: "[TEST PLACEHOLDER] プライバシーポリシー 第 2 版。" }
        changeSummary: { en: Retention is explained., ja: 保存期間を説明しました。 }
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${privacy}", effectiveAt: 2026-12-01T00:00:00Z, requiresConsent: true, baseRevision: 3 }
    expectOutput: { kind: PRIVACY, versionNo: 2 }
    save: { privacy2: $.versionId }
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_WITHDRAW@latest
    input: { legalVersionId: "${privacy2}", reason: Announced by mistake }
    expectOutput: { kind: PRIVACY, versionNo: 2 }
  - setClock: 2026-12-02T00:00:00Z
  - expectError:
      actor: { id: "${a}", permissions: [qb.account.read, qb.sponsor.me] }
      process: QB_CONSENT_ACCEPT@latest
      input: { items: [{ kind: PRIVACY, versionNo: 2 }] }
      status: 422
      ruleCode: QB_TERMS_OUTDATED
  - expect:
      query: qb.public.legal-history
      params: { kind: PRIVACY }
      rows: 2
      values: [{ versionNo: 2, withdrawn: true }, { versionNo: 1, withdrawn: false }]
  - actor: { id: legal-admin, permissions: [qb.admin.content.write], mfa: true }
    process: QB_LEGAL_PUBLISH@latest
    input: { docId: "${privacy}", requiresConsent: false, baseRevision: 4 }
    expectOutput: { kind: PRIVACY, versionNo: 3 }
snapshot:
  entities: [QbLegalDoc, QbLegalVersion, QbLegalWithdrawal, QbConsent, QbSponsor, QbTopUp]
  asOf: end
