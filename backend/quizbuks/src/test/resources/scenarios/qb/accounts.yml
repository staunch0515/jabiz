        qb.topup-manual.review, qb.operator-settlement.review, qb.sod.control-changes, qb.sod.security-administration]
    save: { p1: "$.proposals[0]", p2: "$.proposals[1]", p3: "$.proposals[2]", p4: "$.proposals[3]",
