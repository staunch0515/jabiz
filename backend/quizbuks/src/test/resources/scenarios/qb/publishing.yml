# Publishing a quiz (docs/quizbuks/plans/Q4-publishing.md): QB_SETUP proposes the review switches and the review
# rules, which a second administrator publishes. Sponsor A is onboarded first (Q2: only an approved sponsor
# publishes): A applies, a content administrator approves. Sponsor A makes a quiz with version v1.0, saves a publication with three
# reward tiers and submits it; the reviewer sends it back with a reason, A lowers the rewards and submits again, the
# reviewer approves. The minute's job puts it live at its start; A pauses and resumes it; the job ends it at its end.
# A copies it with new times; sponsor B cannot touch A's publication. No files: a scenario cannot upload one yet
# (platform gap 2 of the Q3 plan); ContentFilesIT covers them.
name: Publishing a quiz
# The job runs twice within the replay's few seconds: the cluster lock must not outlast a run.
properties:
  jabiz.jobs.lock-at-least-for: 0s
clock: 2026-10-01T00:00:00Z
actor: { id: installer, permissions: ["*"] }
