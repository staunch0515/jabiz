# Credit notes (docs/quizbuks/plans/impl/F-M.md §10.3-16, F-M7): QB_SETUP and its proposals, the monthly fee of 1,000
# yen. Alice, a postpaid Sponsor, is charged October's fee (1,100 with tax). Finance credits 400 of it (a note of 440
# by hand: one administrator proposes, another approves); with no invoice unpaid it is all credit, nothing given back.
# November's run issues October's invoice, which takes the credit first: 440 of 1,100 paid by it, 660 owed. The daily
# reconciliation finds nothing.
