# The build's own settings (the daemon's memory stays at Gradle's defaults).
#
# Dependency downloads on a cold CI runner (phase 17zz26): Maven Central answers 429 when a shared address asks too
# often, and Gradle gives up after 3 tries one second apart. Gradle 9.1 already treats 408, 429 and 5xx as transient and
# backs off exponentially; these raise how long it tries. Two layers: the transport (every download) and the
# repository's own access (a module's metadata). Not used by anything outside the build.
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
