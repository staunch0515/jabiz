# Messages of Culture, Unfiltered (docs/culture/00-design.md): rule codes, then entity and field labels.
# Rule codes of the fields, the entity checks and the processes.
LOCATION_SLUG_FORMAT=网址名只能包含小写字母、数字和连字符。
THEME_SLUG_FORMAT=网址名只能包含小写字母、数字和连字符。
PARTICIPANT_SLUG_FORMAT=网址名只能包含小写字母、数字和连字符。
STORY_SLUG_FORMAT=网址名只能包含小写字母、数字和连字符。
RESOURCE_SLUG_FORMAT=网址名只能包含小写字母、数字和连字符。
COUNTRY_CODE_FORMAT=国家代码为两个大写字母（ISO 3166-1），例如 JP。
LATITUDE_RANGE=纬度必须在 {min} 到 {max} 之间。
LONGITUDE_RANGE=经度必须在 {min} 到 {max} 之间。
DISPLAY_NAME_BLANK=请输入名字或化名。
VIDEO_ID_FORMAT=请输入视频 ID（6 到 32 个字母、数字、- 或 _），而不是网址。
DURATION_RANGE=时长必须在 {min} 到 {max} 分钟之间。
BLOCK_KEY_FORMAT=键只能包含小写字母、数字、点和连字符。
CONSENT_SIGNED_IN_FUTURE=签署日期不能晚于今天。
PORTRAIT_ALT_REQUIRED=有头像时必须填写英语替代文本。
VIDEO_INCOMPLETE=视频需要同时填写平台和视频 ID。
MEDIA_FILE_KIND=照片只能有图片文件，音频只能有音频文件。
WRONG_STATE=当前状态为 {state}，无法执行（需要 {expected}）。
ENGLISH_REQUIRED={entity} {id}：缺少“{field}”的英语文本。
THUMBNAIL_REQUIRED=故事需要缩略图。
THEME_REQUIRED=故事至少要属于一个主题。
BODY_REQUIRED=文章或访谈需要正文（故事正文或视角文字）。
VIDEO_REQUIRED=视频故事需要一个视频（故事或视角中）。
STORY_EMPTY=故事既没有视角也没有正文。
CAPTIONS_NOT_CONFIRMED={entity} {id}：请确认视频有准确的字幕。
TRANSCRIPT_REQUIRED={entity} {id}：音频需要文字稿。
ALT_TEXT_REQUIRED={entity} {id}：照片需要英语替代文本。
PEOPLE_CONSENT_NOT_CONFIRMED={entity} {id}：请确认照片中可辨认的人已经同意。
MEDIA_STORY_MISMATCH={entity} {id} 属于其他故事的视角。
PARTICIPANT_NOT_ACTIVE={entity} {id}：参与者 {participant} 未公开。
CONSENT_MISSING=参与者 {participant}：缺少同意（{missing}）。
CONTRIBUTION_OWNER_MISMATCH={entity} {id} 不是由参与者 {participant} 本人添加的。
CONSENT_ALREADY_WITHDRAWN=该同意已经撤回。
AGE_GROUP_REQUIRED=资源需要年龄段。
DURATION_REQUIRED=资源需要时长。

