# Messages of Culture, Unfiltered (docs/culture/00-design.md): rule codes, then entity and field labels.
# Rule codes of the fields, the entity checks and the processes.
LOCATION_SLUG_FORMAT=The slug may contain only lower-case letters, digits and hyphens.
THEME_SLUG_FORMAT=The slug may contain only lower-case letters, digits and hyphens.
PARTICIPANT_SLUG_FORMAT=The slug may contain only lower-case letters, digits and hyphens.
STORY_SLUG_FORMAT=The slug may contain only lower-case letters, digits and hyphens.
RESOURCE_SLUG_FORMAT=The slug may contain only lower-case letters, digits and hyphens.
COUNTRY_CODE_FORMAT=The country code is two capital letters (ISO 3166-1), for example JP.
LATITUDE_RANGE=The latitude must be between {min} and {max}.
LONGITUDE_RANGE=The longitude must be between {min} and {max}.
DISPLAY_NAME_BLANK=Enter a first name or a chosen name.
VIDEO_ID_FORMAT=Enter the video's id (6 to 32 letters, digits, - or _), not its address.
DURATION_RANGE=The duration must be between {min} and {max} minutes.
BLOCK_KEY_FORMAT=The key may contain only lower-case letters, digits, dots and hyphens.
CONSENT_SIGNED_IN_FUTURE=The signing date must not be in the future.
PORTRAIT_ALT_REQUIRED=A portrait needs an English text alternative.
VIDEO_INCOMPLETE=A video needs both its platform and its id.
MEDIA_FILE_KIND=A photo needs an image file only, an audio item an audio file only.
WRONG_STATE=This cannot be done while the item is {state} (it must be {expected}).
ENGLISH_REQUIRED={entity} {id}: the English text of "{field}" is missing.
THUMBNAIL_REQUIRED=The story needs a thumbnail.
THEME_REQUIRED=The story must belong to at least one theme.
BODY_REQUIRED=An article or interview needs its text, in the story or in a perspective.
VIDEO_REQUIRED=A video story needs a video, in the story or in a perspective.
STORY_EMPTY=The story has neither perspectives nor text.
CAPTIONS_NOT_CONFIRMED={entity} {id}: confirm that the video has accurate captions.
TRANSCRIPT_REQUIRED={entity} {id}: the audio needs a transcript.
ALT_TEXT_REQUIRED={entity} {id}: the photo needs an English text alternative.
PEOPLE_CONSENT_NOT_CONFIRMED={entity} {id}: confirm that the people who can be recognised in the photo agreed.
MEDIA_STORY_MISMATCH={entity} {id} belongs to a perspective of another story.
PARTICIPANT_NOT_ACTIVE={entity} {id}: participant {participant} is not active.
CONSENT_MISSING=Participant {participant}: consent is missing ({missing}).
CONTRIBUTION_OWNER_MISMATCH={entity} {id} was added by someone other than participant {participant}.
CONSENT_ALREADY_WITHDRAWN=The consent is already withdrawn.
AGE_GROUP_REQUIRED=The resource needs an age group.
DURATION_REQUIRED=The resource needs a duration.

