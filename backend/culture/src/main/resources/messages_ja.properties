# Messages of Culture, Unfiltered (docs/culture/00-design.md): rule codes, then entity and field labels.
# Rule codes of the fields, the entity checks and the processes.
LOCATION_SLUG_FORMAT=スラッグには小文字、数字、ハイフンのみ使えます。
THEME_SLUG_FORMAT=スラッグには小文字、数字、ハイフンのみ使えます。
PARTICIPANT_SLUG_FORMAT=スラッグには小文字、数字、ハイフンのみ使えます。
STORY_SLUG_FORMAT=スラッグには小文字、数字、ハイフンのみ使えます。
RESOURCE_SLUG_FORMAT=スラッグには小文字、数字、ハイフンのみ使えます。
COUNTRY_CODE_FORMAT=国コードは大文字 2 文字（ISO 3166-1）です。例：JP
LATITUDE_RANGE=緯度は {min} から {max} の間で入力してください。
LONGITUDE_RANGE=経度は {min} から {max} の間で入力してください。
DISPLAY_NAME_BLANK=名前または呼び名を入力してください。
VIDEO_ID_FORMAT=動画のアドレスではなく ID（英数字・-・_ の 6〜32 文字）を入力してください。
DURATION_RANGE=所要時間は {min}〜{max} 分で入力してください。
BLOCK_KEY_FORMAT=キーには小文字、数字、ドット、ハイフンのみ使えます。
CONSENT_SIGNED_IN_FUTURE=署名日を未来の日付にすることはできません。
PORTRAIT_ALT_REQUIRED=顔写真には英語の代替テキストが必要です。
VIDEO_INCOMPLETE=動画にはプラットフォームと ID の両方が必要です。
MEDIA_FILE_KIND=写真には画像ファイルのみ、音声には音声ファイルのみを指定してください。
WRONG_STATE=現在の状態（{state}）では実行できません（必要な状態：{expected}）。
ENGLISH_REQUIRED={entity} {id}：「{field}」の英語テキストがありません。
THUMBNAIL_REQUIRED=ストーリーにはサムネイルが必要です。
THEME_REQUIRED=ストーリーは少なくとも 1 つのテーマに属している必要があります。
BODY_REQUIRED=記事やインタビューには本文（ストーリーまたは視点）が必要です。
VIDEO_REQUIRED=動画ストーリーには動画（ストーリーまたは視点）が必要です。
STORY_EMPTY=ストーリーに視点も本文もありません。
CAPTIONS_NOT_CONFIRMED={entity} {id}：動画に正確な字幕があることを確認してください。
TRANSCRIPT_REQUIRED={entity} {id}：音声には書き起こしが必要です。
ALT_TEXT_REQUIRED={entity} {id}：写真には英語の代替テキストが必要です。
PEOPLE_CONSENT_NOT_CONFIRMED={entity} {id}：写真に写っている人の同意を確認してください。
MEDIA_STORY_MISMATCH={entity} {id} は別のストーリーの視点に属しています。
PARTICIPANT_NOT_ACTIVE={entity} {id}：参加者 {participant} は公開されていません。
CONSENT_MISSING=参加者 {participant}：同意がありません（{missing}）。
CONTRIBUTION_OWNER_MISMATCH={entity} {id} は参加者 {participant} 本人以外が追加しました。
CONSENT_ALREADY_WITHDRAWN=この同意はすでに撤回されています。
AGE_GROUP_REQUIRED=教材には対象年齢が必要です。
DURATION_REQUIRED=教材には所要時間が必要です。

