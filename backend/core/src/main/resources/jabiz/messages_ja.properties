# プラットフォームのエラーメッセージ（docs/design/02-metamodel.md 3.1 節）。プレースホルダーは名前付き：{field}、{limit} など
UNKNOWN_FIELD=項目「{field}」は存在しません。
INVALID_VALUE=項目「{field}」の値が正しくありません。
REQUIRED=項目「{field}」は必須です。
RULE_EVALUATION_FAILED=項目「{field}」のルール {rule} を評価できませんでした。
REFERENCE_NOT_FOUND=項目「{field}」が参照する{target} {id} は存在しません。
ID_MISMATCH=項目「{field}」がエンティティの ID と一致しません。
IMMUTABLE_FIELD=項目「{field}」は変更できません。
ILLEGAL_TRANSITION=ステータスを {from} から {to} に変更することはできません。
INVALID_INITIAL_STATE=新規登録時にステータス {state} は指定できません。指定可能：{allowed}。
STATE_REQUIRED=ステータスは必須です。指定可能：{allowed}。
STATE_CLEARED=ステータスを空にすることはできません。
OUT_OF_SCOPE=このビューでは項目「{field}」は {expected} でなければなりません。
DATASET_READ_ONLY=このビューは読み取り専用です。
ENTITY_READ_ONLY={entity} は読み取り専用です。
BATCH_TOO_LARGE=一度に登録できる変更は {limit} 件までです（{size} 件）。
STILL_REFERENCED=この{entity}は{source}から参照されているため削除できません。
TOO_LONG=項目「{field}」は {max} 文字以内で入力してください。
NUMERIC_PRECISION=項目「{field}」は {precision} 桁（小数 {scale} 桁）以内で入力してください。
MONETARY_SCALE=項目「{field}」の小数は {scale} 桁以内で入力してください（{currency}）。
NOT_IN_DICTIONARY=「{value}」は項目「{field}」の選択肢にありません。
UNIQUE_VIOLATION=「{field}」の値は既に使用されています。
OPERATOR_NOT_ALLOWED=項目「{field}」は {operator} で比較できません。
FILTER_NOT_ALLOWED=ここでは項目「{field}」で絞り込めません。
SORT_NOT_ALLOWED=ここでは項目「{field}」で並べ替えできません。
GUARD_EVALUATION_FAILED=ステータス変更の条件 {guard} を確認できませんでした。
SCOPE_UNAVAILABLE=「{source}」がないため、この画面は利用できません。
REASON_REQUIRED=この変更には理由の入力が必要です。
NOT_TEMPORAL={entity} は履歴を保持しません。
TIME_TRAVEL_NOT_ALLOWED=このビューでは現在の状態のみ参照できます。
SCHEDULING_NOT_ALLOWED={entity} の変更は将来の日時に予約できません。
NOT_SCHEDULED={time} に予約された変更はありません。
NOTHING_TO_REVERT=操作 {operation} には取り消せる履歴がありません。
PERMISSION_DENIED=この操作を行う権限がありません（{permission}）。
MFA_REQUIRED=この操作には認証アプリでの確認が必要です。
INVALID_IDEMPOTENCY_KEY=冪等キーは英数字と . _ : - からなる 1〜128 文字で指定してください。
IDEMPOTENCY_KEY_REUSED=この冪等キーは別の処理ですでに使用されています。
SENSITIVE_FIELD=項目「{field}」はここでは設定できません。
PASSWORD_TOO_SHORT=パスワードは {min} 文字以上にしてください。
PASSWORD_TOO_LONG=パスワードは {max} バイト以内にしてください。
UNAUTHENTICATED=ログインしてください。
LOGIN_FAILED=ユーザー名またはパスワードが正しくないか、現在このアカウントではログインできません。
INVALID_REFRESH_TOKEN=セッションの有効期限が切れました。もう一度ログインしてください。
CHECK_EVALUATION_FAILED=ルール {check} を評価できませんでした。
PARAM_NOT_FOUND=業務パラメータ {key} には {asOf} 時点で有効な値がありません。
PARAM_VALUE_INVALID=値がパラメータの型 {kind} に合いません。
EFFECTIVE_TIME_NOT_FUTURE=適用開始日時 {time} は現在より後でなければなりません。
PROCESS_ONLY_DATASET={dataset} のデータは業務処理を通じてのみ変更できます。
REVERT_NOT_ALLOWED=操作 {operation} は取り消せません。{entity} は新しい記帳で訂正してください。
WRITE_ONCE={entity} [ID: {id}] は一度だけ書き込まれ、変更できません。新しい記帳で訂正してください。
LEDGER_TOO_FEW_LINES=取引には {min} 件以上の仕訳明細が必要です。
LEDGER_TOO_MANY_LINES=取引の仕訳明細は {max} 件までです。
LEDGER_AMOUNT_NOT_POSITIVE=明細 {line}：金額は 0 より大きくしてください。
LEDGER_AMOUNT_SCALE=明細 {line}：金額の小数は {scale} 桁までです。
LEDGER_UNBALANCED=借方合計（{debit}）と貸方合計（{credit}）が一致しません（差額 {difference}）。
LEDGER_ACCOUNT_NOT_FOUND=明細 {line}：勘定科目 {account} は存在しません。
LEDGER_ACCOUNT_DISABLED=明細 {line}：勘定科目 {account} は記帳できません。
LEDGER_ALREADY_REVERSED=取引 {transaction} はすでに取り消し済みです。
LEDGER_REVERSAL_NOT_REVERSIBLE=取引 {transaction} は取消取引のため、取り消せません。
LEDGER_ACCOUNT_NOT_POSTABLE=明細 {line}：勘定科目 {account} は集計科目のため記帳できません。
LEDGER_DIMENSION_UNKNOWN=明細 {line}：ディメンション {dimension} はありません。
LEDGER_DIMENSION_INVALID=明細 {line}：{value} は有効な {dimension} ではありません。
LEDGER_SOURCE_NOT_FOUND=元伝票 {entity} {id} は存在しません。
LEDGER_PARENT_NOT_SUMMARY=親科目 {account} は集計科目でなければなりません。
LEDGER_ACCOUNT_CYCLE=勘定科目 {account} を自分の下位科目の下に置くことはできません。
LEDGER_SUMMARY_HAS_ENTRIES=勘定科目 {account} は記帳済みのため集計科目にできません。
LEDGER_ACCOUNT_HAS_CHILDREN=勘定科目 {account} には下位科目があるため集計科目のままにする必要があります。
LEDGER_CURRENCY_INVALID=明細 {line}：{currency} はこの帳簿の外貨ではありません。
LEDGER_RATE_INVALID=明細 {line}：為替レート {rate} は 0 より大きく、小数 {scale} 桁以内にしてください。
LEDGER_FX_AMOUNT_MISMATCH=明細 {line}：このレートでは金額は {expected} で、{amount} ではありません。
LEDGER_UNBALANCED_IN_CURRENCY={currency} の借方合計（{debit}）と貸方合計（{credit}）が一致しません（差額 {difference}）。
REPORT_TOO_LARGE=レポートが {limit} 行を超えています。パラメータや絞り込み条件で範囲を狭めてください。
REPORT_SUPERSEDE_MISMATCH=置き換える実行は {template} のレポートで、このレポートのものではありません。
REPORT_ALREADY_SUPERSEDED=置き換える実行はすでに {run} に置き換えられています。
RETENTION_ACTIVE=このレコードは {until} まで保存する必要があり、それまでは削除できません。
LEGAL_HOLD=このレコードはリーガルホールド「{hold}」の対象であり、削除できません。
LEGAL_HOLD_NOT_ACTIVE=このリーガルホールドはすでに解除されています。
MFA_CODE_INVALID=コードが正しくありません。認証アプリの現在のコード、またはリカバリーコードを入力してください。
MFA_NOT_ENROLLED=先に 2 段階認証を設定してください。
MFA_ALREADY_ENROLLED=2 段階認証はすでに設定されています。管理者がリセットできます。
IMPORT_FILE_INVALID=このインポートの形式でファイルを読み取れません：{detail}
IMPORT_TOO_MANY_ROWS=ファイルが {max} 行を超えています。小さなファイルに分割してください。
IMPORT_COLUMN_MISSING=「{field}」に対応する列がファイルにありません。すべての行で必要です。
IMPORT_UNKNOWN_COLUMN=ファイルに列「{column}」がありません。
IMPORT_UNKNOWN_FIELD=このインポートに項目「{field}」はありません。
IMPORT_EXTRA_CELLS=行のセル数がファイルの列数より多くなっています。
IMPORT_VALUE_INVALID=項目「{field}」：「{value}」を読み取れません。
IMPORT_DUPLICATE_REF=参照 {ref} はすでにインポート済みか、ファイル内で先に出現しています。
IMPORT_ALREADY_IMPORTED=このファイルはすでにインポートされています（インポート {run}）。
IMPORT_EMPTY=ファイルに行がありません。
IMPORT_REJECTED=ファイルはインポートされませんでした：{count} 件の問題が見つかりました。何も変更されていません。
IMPORT_WRONG_FILE=このファイルはこのインポート用にアップロードされていません。
IMPORT_ROW_FAILED=行を処理できませんでした：{detail}
APPROVAL_NOT_PENDING=承認依頼 {request} は承認待ちではありません（{status}）。
APPROVAL_OWN_REQUEST=作成者は自分で作成したものを承認・却下できません。
APPROVAL_ALREADY_DECIDED=この承認依頼の別の段階をすでに判断しています。
APPROVAL_LIMIT_EXCEEDED=承認限度額（{limit}）では {fact} {value} を承認できません。
CONTROL_CHANGE_INVALID=変更が正しくありません：{detail}
CONTROL_CHANGE_NOT_PROPOSED=変更 {change} はもう提案中ではありません。
CONTROL_SAME_PERSON=変更は提案者以外の人が公開する必要があります。
SOD_CONFLICT=職務分掌（{rule}）：同じ人が両方のグループの権限を持つことはできません。
FILE_TYPE_NOT_ALLOWED=この種類のファイルは受け付けていません（受け付ける種類：{allowed}）。
FILE_TOO_LARGE=ファイルが大きすぎます（最大 {max}）。
FILE_INVALID=ファイルが壊れているか、処理できません。
FILE_NOT_FOUND=ファイル {file} は存在しません。
FILE_POLICY_MISMATCH=ファイル {file} はこの項目用にアップロードされたものではありません（期待：{policy}）。
FILE_IN_USE=ファイルはまだ {entity}.{field} で使われています。
RATE_LIMITED=リクエストが多すぎます。{retryAfter} 秒後にもう一度お試しください。
TRANSLATION_REQUIRED=項目「{field}」は言語「{lang}」の入力が必要です。
PROCESS_ONLY_FIELD=項目「{field}」は処理によってのみ変更できます。
DISPLAY_NOT_DECLARED=エンティティ「{entity}」には表示項目が宣言されていません。
DATA_PERIOD_ORDER=データ期間の終了はその開始より後でなければなりません。
ACCESS_REVIEW_PERIOD=アクセスレビューの期間は終了しており、終了が開始より後でなければなりません。
ACCESS_REVIEW_REPORT=アクセスレビューが参照するレポートは、期末時点で発行され改変されていないアクセス権レポートでなければなりません。
MASKED_VALUE=項目「{field}」の値はマスクされた形式のため書き込めません。完全な値を入力してください。

