# プラットフォームのエラーメッセージ（docs/design/02-metamodel.md 3.1 節）。プレースホルダーは名前付き：{field}、{limit} など
UNKNOWN_FIELD=項目「{field}」は存在しません。
INVALID_VALUE=項目「{field}」の値が正しくありません。
REQUIRED=項目「{field}」は必須です。
RULE_EVALUATION_FAILED=項目「{field}」のルール {rule} を評価できませんでした。
REFERENCE_NOT_FOUND=項目「{field}」が参照する{target} {id} は存在しません。
ID_MISMATCH=項目「{field}」がエンティティの ID と一致しません。
IMMUTABLE_FIELD=項目「{field}」は変更できません。
ILLEGAL_TRANSITION=ステータスを {from} から {to} に変更することはできません。
INVALID_INITIAL_STATE=新規登録時にステータス {state} は指定できません。指定可能：{allowed}。
STATE_REQUIRED=ステータスは必須です。指定可能：{allowed}。
STATE_CLEARED=ステータスを空にすることはできません。
OUT_OF_SCOPE=このビューでは項目「{field}」は {expected} でなければなりません。
DATASET_READ_ONLY=このビューは読み取り専用です。
ENTITY_READ_ONLY={entity} は読み取り専用です。
BATCH_TOO_LARGE=一度に登録できる変更は {limit} 件までです（{size} 件）。
STILL_REFERENCED=この{entity}は{source}から参照されているため削除できません。
TOO_LONG=項目「{field}」は {max} 文字以内で入力してください。
NUMERIC_PRECISION=項目「{field}」は {precision} 桁（小数 {scale} 桁）以内で入力してください。
NOT_IN_DICTIONARY=「{value}」は項目「{field}」の選択肢にありません。
UNIQUE_VIOLATION=「{field}」の値は既に使用されています。
OPERATOR_NOT_ALLOWED=項目「{field}」は {operator} で比較できません。
FILTER_NOT_ALLOWED=ここでは項目「{field}」で絞り込めません。
SORT_NOT_ALLOWED=ここでは項目「{field}」で並べ替えできません。
GUARD_EVALUATION_FAILED=ステータス変更の条件 {guard} を確認できませんでした。
SCOPE_UNAVAILABLE=「{source}」がないため、この画面は利用できません。
REASON_REQUIRED=この変更には理由の入力が必要です。
NOT_TEMPORAL={entity} は履歴を保持しません。
TIME_TRAVEL_NOT_ALLOWED=このビューでは現在の状態のみ参照できます。
SCHEDULING_NOT_ALLOWED={entity} の変更は将来の日時に予約できません。
NOT_SCHEDULED={time} に予約された変更はありません。
NOTHING_TO_REVERT=操作 {operation} には取り消せる履歴がありません。
PERMISSION_DENIED=この操作を行う権限がありません（{permission}）。
INVALID_IDEMPOTENCY_KEY=冪等キーは英数字と . _ : - からなる 1〜128 文字で指定してください。
IDEMPOTENCY_KEY_REUSED=この冪等キーは別の処理ですでに使用されています。
SENSITIVE_FIELD=項目「{field}」はここでは設定できません。
PASSWORD_TOO_SHORT=パスワードは {min} 文字以上にしてください。
PASSWORD_TOO_LONG=パスワードは {max} バイト以内にしてください。
UNAUTHENTICATED=ログインしてください。
LOGIN_FAILED=ユーザー名またはパスワードが正しくないか、現在このアカウントではログインできません。
INVALID_REFRESH_TOKEN=セッションの有効期限が切れました。もう一度ログインしてください。
CHECK_EVALUATION_FAILED=ルール {check} を評価できませんでした。
PARAM_NOT_FOUND=業務パラメータ {key} には {asOf} 時点で有効な値がありません。
PARAM_VALUE_INVALID=値がパラメータの型 {kind} に合いません。
EFFECTIVE_TIME_NOT_FUTURE=適用開始日時 {time} は現在より後でなければなりません。
PROCESS_ONLY_DATASET={dataset} のデータは業務処理を通じてのみ変更できます。
REVERT_NOT_ALLOWED=操作 {operation} は取り消せません。{entity} は新しい記帳で訂正してください。
LEDGER_TOO_FEW_LINES=取引には {min} 件以上の仕訳明細が必要です。
LEDGER_TOO_MANY_LINES=取引の仕訳明細は {max} 件までです。
LEDGER_AMOUNT_NOT_POSITIVE=明細 {line}：金額は 0 より大きくしてください。
LEDGER_AMOUNT_SCALE=明細 {line}：金額の小数は {scale} 桁までです。
LEDGER_UNBALANCED=借方合計（{debit}）と貸方合計（{credit}）が一致しません。
LEDGER_ACCOUNT_NOT_FOUND=明細 {line}：勘定科目 {account} は存在しません。
LEDGER_ACCOUNT_DISABLED=明細 {line}：勘定科目 {account} は記帳できません。
LEDGER_ALREADY_REVERSED=取引 {transaction} はすでに取り消し済みです。
LEDGER_REVERSAL_NOT_REVERSIBLE=取引 {transaction} は取消取引のため、取り消せません。
TRANSLATION_REQUIRED=項目「{field}」は言語「{lang}」の入力が必要です。
PROCESS_ONLY_FIELD=項目「{field}」は処理によってのみ変更できます。
DISPLAY_NOT_DECLARED=エンティティ「{entity}」には表示項目が宣言されていません。
