# プラットフォームのエラーメッセージ（docs/design/02-metamodel.md 3.1 節）。プレースホルダーは名前付き：{field}、{limit} など
UNKNOWN_FIELD=項目「{field}」は存在しません。
INVALID_VALUE=項目「{field}」の値が正しくありません。
REQUIRED=項目「{field}」は必須です。
RULE_EVALUATION_FAILED=項目「{field}」のルール {rule} を評価できませんでした。
REFERENCE_NOT_FOUND=項目「{field}」が参照する{target} {id} は存在しません。
ID_MISMATCH=項目「{field}」がエンティティの ID と一致しません。
IMMUTABLE_FIELD=項目「{field}」は変更できません。
ILLEGAL_TRANSITION=ステータスを {from} から {to} に変更することはできません。
INVALID_INITIAL_STATE=新規登録時にステータス {state} は指定できません。指定可能：{allowed}。
STATE_REQUIRED=ステータスは必須です。指定可能：{allowed}。
STATE_CLEARED=ステータスを空にすることはできません。
OUT_OF_SCOPE=このビューでは項目「{field}」は {expected} でなければなりません。
SPATIAL_GUARD_REJECTED=現在の位置ではステータス {status} に変更できません。
SPATIAL_GUARD_LOCATION_MISSING=ステータス {status} には項目「{field}」が必須です。
DATASET_READ_ONLY=このビューは読み取り専用です。
ENTITY_READ_ONLY={entity} は読み取り専用です。
BATCH_TOO_LARGE=一度に登録できる変更は {limit} 件までです（{size} 件）。
STILL_REFERENCED=この{entity}は{source}から参照されているため削除できません。
