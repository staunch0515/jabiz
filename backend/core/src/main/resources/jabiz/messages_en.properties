# Platform error messages (docs/design/02-metamodel.md section 3.1). Placeholders are named: {field}, {limit} ...
UNKNOWN_FIELD=Unknown field "{field}".
INVALID_VALUE=Field "{field}" has an invalid value.
REQUIRED=Field "{field}" is required.
RULE_EVALUATION_FAILED=Rule {rule} of field "{field}" could not be evaluated.
REFERENCE_NOT_FOUND=Field "{field}" refers to {target} {id}, which does not exist.
ID_MISMATCH=Field "{field}" does not match the id of the entity.
IMMUTABLE_FIELD=Field "{field}" cannot be changed.
ILLEGAL_TRANSITION=The status cannot change from {from} to {to}.
INVALID_INITIAL_STATE=A new entry cannot start in status {state}. Allowed: {allowed}.
STATE_REQUIRED=A status is required. Allowed: {allowed}.
STATE_CLEARED=The status cannot be cleared.
OUT_OF_SCOPE=Field "{field}" must be {expected} in this view.
DATASET_READ_ONLY=This view is read-only.
ENTITY_READ_ONLY={entity} is read-only.
BATCH_TOO_LARGE=Too many changes at once: {size} (at most {limit}).
STILL_REFERENCED=This {entity} is still referenced by {source} and cannot be deleted.
TOO_LONG=Field "{field}" allows at most {max} characters.
NUMERIC_PRECISION=Field "{field}" allows at most {precision} digits, {scale} of them after the decimal point.
MONETARY_SCALE=Field "{field}" allows at most {scale} digits after the decimal point ({currency}).
NOT_IN_DICTIONARY="{value}" is not a valid choice for field "{field}".
UNIQUE_VIOLATION=The value of "{field}" is already in use.
OPERATOR_NOT_ALLOWED=Field "{field}" cannot be compared with {operator}.
FILTER_NOT_ALLOWED=Filtering by field "{field}" is not allowed here.
SORT_NOT_ALLOWED=Sorting by field "{field}" is not allowed here.
GUARD_EVALUATION_FAILED=Condition {guard} of the status change could not be checked.
SCOPE_UNAVAILABLE=This view is not available without "{source}".
REASON_REQUIRED=A reason is required for this change.
NOT_TEMPORAL={entity} keeps no history.
TIME_TRAVEL_NOT_ALLOWED=This view shows the current state only.
SCHEDULING_NOT_ALLOWED=Changes to {entity} cannot be scheduled for a later time.
NOT_SCHEDULED=There is no scheduled change of this entry at {time}.
NOTHING_TO_REVERT=Operation {operation} changed no history that could be reverted.
PERMISSION_DENIED=You are not allowed to do this ({permission}).
INVALID_IDEMPOTENCY_KEY=The idempotency key must be 1 to 128 letters, digits or the characters . _ : -.
IDEMPOTENCY_KEY_REUSED=This idempotency key was already used for another process.
SENSITIVE_FIELD=Field "{field}" cannot be set here.
PASSWORD_TOO_SHORT=The password must have at least {min} characters.
PASSWORD_TOO_LONG=The password must not exceed {max} bytes.
UNAUTHENTICATED=Please sign in.
LOGIN_FAILED=The user name or password is incorrect, or the account cannot sign in right now.
INVALID_REFRESH_TOKEN=The session has expired. Please sign in again.
CHECK_EVALUATION_FAILED=The rule {check} could not be evaluated.
PARAM_NOT_FOUND=Business parameter {key} has no value in effect at {asOf}.
PARAM_VALUE_INVALID=The value does not match the parameter type {kind}.
EFFECTIVE_TIME_NOT_FUTURE=The effective time {time} must be later than now.
PROCESS_ONLY_DATASET=Data of {dataset} can only be changed through its business processes.
REVERT_NOT_ALLOWED=Operation {operation} cannot be reverted; {entity} is corrected by a new entry instead.
LEDGER_TOO_FEW_LINES=A transaction needs at least {min} entries.
LEDGER_TOO_MANY_LINES=A transaction has at most {max} entries.
LEDGER_AMOUNT_NOT_POSITIVE=Entry {line}: the amount must be greater than zero.
LEDGER_AMOUNT_SCALE=Entry {line}: the amount allows at most {scale} decimal places.
LEDGER_UNBALANCED=Debits ({debit}) and credits ({credit}) must be equal.
LEDGER_ACCOUNT_NOT_FOUND=Entry {line}: there is no account {account}.
LEDGER_ACCOUNT_DISABLED=Entry {line}: account {account} is closed for postings.
LEDGER_ALREADY_REVERSED=Transaction {transaction} has already been reversed.
LEDGER_REVERSAL_NOT_REVERSIBLE=Transaction {transaction} is itself a reversal and cannot be reversed.
LEDGER_ACCOUNT_NOT_POSTABLE=Entry {line}: account {account} is a summary account and takes no postings.
LEDGER_DIMENSION_UNKNOWN=Entry {line}: there is no dimension {dimension}.
LEDGER_DIMENSION_INVALID=Entry {line}: {value} is not a valid {dimension}.
LEDGER_SOURCE_NOT_FOUND=The source document {entity} {id} does not exist.
LEDGER_PARENT_NOT_SUMMARY=The parent account {account} must be a summary account.
LEDGER_ACCOUNT_CYCLE=Account {account} cannot be placed under one of its own sub-accounts.
LEDGER_SUMMARY_HAS_ENTRIES=Account {account} has postings and cannot become a summary account.
LEDGER_ACCOUNT_HAS_CHILDREN=Account {account} has sub-accounts and must stay a summary account.
APPROVAL_NOT_PENDING=Approval request {request} is not pending ({status}).
APPROVAL_OWN_REQUEST=You prepared this and cannot approve or reject it yourself.
APPROVAL_ALREADY_DECIDED=You have already decided another level of this approval request.
APPROVAL_LIMIT_EXCEEDED=Your approval limit ({limit}) does not cover {fact} {value}.
CONTROL_CHANGE_INVALID=The change is not valid: {detail}
CONTROL_CHANGE_NOT_PROPOSED=Change {change} is no longer a proposal.
CONTROL_SAME_PERSON=A change must be published by someone other than its proposer.
SOD_CONFLICT=Segregation of duties ({rule}): the same person may not hold both groups of permissions.
FILE_TYPE_NOT_ALLOWED=This type of file is not accepted here (accepted: {allowed}).
FILE_TOO_LARGE=The file is too large (at most {max}).
FILE_INVALID=The file is damaged or cannot be processed.
FILE_NOT_FOUND=File {file} does not exist.
FILE_POLICY_MISMATCH=File {file} was not uploaded for this field (expected {policy}).
FILE_IN_USE=The file is still used by {entity}.{field}.
RATE_LIMITED=Too many requests. Please try again in {retryAfter} seconds.
TRANSLATION_REQUIRED=Field "{field}" needs a text in language "{lang}".
PROCESS_ONLY_FIELD=Field "{field}" is changed by processes only.
DISPLAY_NOT_DECLARED=Entity "{entity}" does not declare a display field.

# Titles of platform tasks (docs/design/18-numbering-approvals-tasks.md section 5)
task.approval=Approve {subject} {entity} (level {level})
