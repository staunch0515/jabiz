# Mail of self-registration, address verification and password reset (docs/design/10-security.md section 15;
# decision D36). The links lead to the pages of the entry's own frontend ({entryUrl}auth/..., decision D43 item 4).
mail.jabiz.auth.verify-email.subject=Verify your e-mail address
mail.jabiz.auth.verify-email.body=Please confirm that this e-mail address is yours:\n\n\
[Verify my address]({entryUrl}auth/verify-email?entry={entry}&token={jabiz.verify})\n\n\
The link can be used once and expires after a while. If you did not sign up, you can ignore this mail.
mail.jabiz.auth.email-link.subject=Your sign-in link
mail.jabiz.auth.email-link.body=Use this link to sign in. If you have no account yet, it opens one with this address:\n\n\
[Sign in]({entryUrl}auth/email-link?entry={entry}&token={jabiz.signIn}&to={to})\n\n\
The link can be used once and expires after 15 minutes. If you did not ask for it, you can ignore this mail.
mail.jabiz.auth.account-exists.subject=You already have an account
mail.jabiz.auth.account-exists.body=Someone, probably you, tried to register with this e-mail address, but it already \
belongs to an account. Nothing has been changed.\n\n\
If it was you and you want to use your account here as well, \
[continue with your existing account]({entryUrl}auth/join?entry={entry}&token={jabiz.join}).\n\n\
If it was not you, you can ignore this mail.
mail.jabiz.auth.password-reset.subject=Reset your password
mail.jabiz.auth.password-reset.body=We received a request to reset the password of your account.\n\n\
[Choose a new password]({entryUrl}auth/password-reset?entry={entry}&token={jabiz.reset})\n\n\
The link can be used once and expires soon. If you did not ask for this, you can ignore this mail: your password \
stays as it is.
mail.jabiz.auth.password-changed.subject=Your password was changed
mail.jabiz.auth.password-changed.body=The password of your account was just changed, and your other sessions were \
signed out.\n\n\
If that was you, there is nothing to do. If it was not, \
[choose a new password]({entryUrl}auth/password-reset?entry={entry}) right away and tell your administrator.
mail.jabiz.auth.email-changed.subject=The address of your account was changed
mail.jabiz.auth.email-changed.body=The e-mail address of your account was changed to {address}, with an \
administrator's approval. Mail about your account now goes there.\n\n\
If you did not ask for this, tell your administrator right away.
mail.jabiz.auth.identity-linked.subject=A sign-in method was added to your account
mail.jabiz.auth.identity-linked.body=Your account can now be signed in to with {provider}.\n\n\
If that was you, there is nothing to do. If it was not, \
[choose a new password]({entryUrl}auth/password-reset?entry={entry}) right away, remove {provider} in your account \
settings and tell your administrator.
