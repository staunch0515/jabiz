EXTERNAL_CALL_FAILED.kind.BAD_RESPONSE=its answer could not be used
EXTERNAL_JOB_INPUT_SECRET=The input of external job {jobType} holds a secret ({field}); a job keeps its input, so secrets cannot be passed this way.
EXTERNAL_JOB_INPUT_TOO_LARGE=The input of external job {jobType} is larger than {max} bytes.
EXTERNAL_JOB_INPUT_FILE=File {fileId} cannot be given to external job {jobType}: it does not exist, is not a file this job reads, or you may not read it.
EXTERNAL_JOB_INPUT_FILE_LIMIT=External job {jobType} reads at most {maxFiles} files of at most {maxBytes} bytes each.
EXTERNAL_JOB_FINISHED=The external job has finished already and can no longer be cancelled.
