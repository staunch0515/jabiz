# 自助注册、邮箱验证与找回密码的邮件（docs/design/10-security.md 第 15 节，决策 D36）。
mail.jabiz.auth.verify-email.subject=验证您的邮箱
mail.jabiz.auth.verify-email.body=请确认此邮箱属于您：\n\n\
[验证邮箱]({entryUrl}auth/verify-email?entry={entry}&token={jabiz.verify})\n\n\
链接只能使用一次，一段时间后失效。如果您没有注册，请忽略此邮件。
mail.jabiz.auth.account-exists.subject=您已有账号
mail.jabiz.auth.account-exists.body=有人（可能是您）尝试用此邮箱注册，但此邮箱已属于一个账号，未做任何更改。\n\n\
如果是您本人，并希望在此处也使用该账号，请[用已有账号继续]({entryUrl}auth/join?entry={entry}&token={jabiz.join})。\n\n\
如果不是您，请忽略此邮件。
mail.jabiz.auth.password-reset.subject=重置密码
mail.jabiz.auth.password-reset.body=我们收到了重置您账号密码的请求。\n\n\
[设置新密码]({entryUrl}auth/password-reset?entry={entry}&token={jabiz.reset})\n\n\
链接只能使用一次，很快会失效。如果不是您本人的请求，请忽略此邮件，您的密码不会改变。
mail.jabiz.auth.password-changed.subject=您的密码已修改
mail.jabiz.auth.password-changed.body=您账号的密码刚刚被修改，其他会话已退出登录。\n\n\
如果是您本人操作，无需处理。如果不是，请立即[重新设置密码]({entryUrl}auth/password-reset?entry={entry})并告知管理员。
mail.jabiz.auth.email-changed.subject=您账号的邮箱已更改
mail.jabiz.auth.email-changed.body=经管理员审批，您账号的邮箱已改为 {address}，此后与账号有关的邮件发往该地址。\n\n\
如果这不是您的要求，请立即告知管理员。
mail.jabiz.auth.identity-linked.subject=您的账号新增了登录方式
mail.jabiz.auth.identity-linked.body=您的账号现在可以通过 {provider} 登录。\n\n\
如果是您本人操作，无需处理。如果不是，请立即[重新设置密码]({entryUrl}auth/password-reset?entry={entry})，\
在账户设置中解除 {provider} 的关联，并告知管理员。
