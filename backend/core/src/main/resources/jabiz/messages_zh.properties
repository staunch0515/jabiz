# 平台错误文案（docs/design/02-metamodel.md 3.1 节）。占位符为命名形式：{field}、{limit} ……
UNKNOWN_FIELD=未知字段“{field}”。
INVALID_VALUE=字段“{field}”的值无效。
REQUIRED=字段“{field}”为必填项。
RULE_EVALUATION_FAILED=字段“{field}”的规则 {rule} 无法执行。
REFERENCE_NOT_FOUND=字段“{field}”引用的{target} {id} 不存在。
ID_MISMATCH=字段“{field}”与实体标识不一致。
IMMUTABLE_FIELD=字段“{field}”不可修改。
ILLEGAL_TRANSITION=状态不能从 {from} 变更为 {to}。
INVALID_INITIAL_STATE=新记录不能以状态 {state} 开始。允许的状态：{allowed}。
STATE_REQUIRED=必须指定状态。允许的状态：{allowed}。
STATE_CLEARED=状态不能被清空。
OUT_OF_SCOPE=在此视图中，字段“{field}”必须为 {expected}。
DATASET_READ_ONLY=此视图为只读。
ENTITY_READ_ONLY={entity} 为只读。
BATCH_TOO_LARGE=一次提交的变更过多：{size} 条（最多 {limit} 条）。
STILL_REFERENCED=该{entity}仍被{source}引用，无法删除。
TOO_LONG=字段“{field}”最多 {max} 个字符。
NUMERIC_PRECISION=字段“{field}”最多 {precision} 位数字，其中小数 {scale} 位。
MONETARY_SCALE=字段“{field}”的小数最多 {scale} 位（{currency}）。
NOT_IN_DICTIONARY=“{value}”不是字段“{field}”的有效选项。
UNIQUE_VIOLATION=“{field}”的值已被使用。
OPERATOR_NOT_ALLOWED=字段“{field}”不能使用 {operator} 比较。
FILTER_NOT_ALLOWED=此处不允许按字段“{field}”筛选。
SORT_NOT_ALLOWED=此处不允许按字段“{field}”排序。
GUARD_EVALUATION_FAILED=无法检查状态变更条件 {guard}。
SCOPE_UNAVAILABLE=缺少“{source}”，无法使用此视图。
REASON_REQUIRED=此修改必须填写原因。
NOT_TEMPORAL={entity} 不保存历史。
TIME_TRAVEL_NOT_ALLOWED=此视图只能查看当前状态。
SCHEDULING_NOT_ALLOWED={entity} 的修改不能预定在以后生效。
NOT_SCHEDULED=该数据在 {time} 没有预定的修改。
NOTHING_TO_REVERT=操作 {operation} 没有可以撤销的历史。
PERMISSION_DENIED=没有执行此操作的权限（{permission}）。
INVALID_IDEMPOTENCY_KEY=幂等键必须是 1 到 128 个字母、数字或 . _ : - 字符。
IDEMPOTENCY_KEY_REUSED=此幂等键已被其他流程使用。
SENSITIVE_FIELD=字段“{field}”不能在此处设置。
PASSWORD_TOO_SHORT=密码至少需要 {min} 个字符。
PASSWORD_TOO_LONG=密码不能超过 {max} 字节。
UNAUTHENTICATED=请先登录。
LOGIN_FAILED=用户名或密码错误，或该账号当前无法登录。
INVALID_REFRESH_TOKEN=会话已过期，请重新登录。
CHECK_EVALUATION_FAILED=规则 {check} 无法评估。
PARAM_NOT_FOUND=业务参数 {key} 在 {asOf} 没有生效的值。
PARAM_VALUE_INVALID=值与参数类型 {kind} 不符。
EFFECTIVE_TIME_NOT_FUTURE=生效时间 {time} 必须晚于当前时间。
PROCESS_ONLY_DATASET={dataset} 的数据只能通过业务流程修改。
REVERT_NOT_ALLOWED=操作 {operation} 不能撤销；{entity} 请用新的记账更正。
LEDGER_TOO_FEW_LINES=一笔交易至少需要 {min} 条分录。
LEDGER_TOO_MANY_LINES=一笔交易至多 {max} 条分录。
LEDGER_AMOUNT_NOT_POSITIVE=第 {line} 条分录：金额必须大于零。
LEDGER_AMOUNT_SCALE=第 {line} 条分录：金额最多 {scale} 位小数。
LEDGER_UNBALANCED=借方合计（{debit}）与贷方合计（{credit}）不相等。
LEDGER_ACCOUNT_NOT_FOUND=第 {line} 条分录：科目 {account} 不存在。
LEDGER_ACCOUNT_DISABLED=第 {line} 条分录：科目 {account} 已停止记账。
LEDGER_ALREADY_REVERSED=交易 {transaction} 已被冲正。
LEDGER_REVERSAL_NOT_REVERSIBLE=交易 {transaction} 本身是冲正交易，不能再冲正。
APPROVAL_NOT_PENDING=审批请求 {request} 不在待审批状态（{status}）。
APPROVAL_OWN_REQUEST=您是准备人，不能审批或驳回自己准备的单据。
APPROVAL_ALREADY_DECIDED=您已审批过此请求的其他层级。
APPROVAL_LIMIT_EXCEEDED=您的审批限额（{limit}）不足以审批 {fact} {value}。
CONTROL_CHANGE_INVALID=变更无效：{detail}
CONTROL_CHANGE_NOT_PROPOSED=变更 {change} 已不是待发布的提案。
CONTROL_SAME_PERSON=变更必须由提出人以外的人发布。
SOD_CONFLICT=职责分离（{rule}）：同一人不能同时持有两组互斥的权限。
FILE_TYPE_NOT_ALLOWED=此处不接受这种类型的文件（可接受：{allowed}）。
FILE_TOO_LARGE=文件过大（最大 {max}）。
FILE_INVALID=文件已损坏或无法处理。
FILE_NOT_FOUND=文件 {file} 不存在。
FILE_POLICY_MISMATCH=文件 {file} 不是为此字段上传的（应为 {policy}）。
FILE_IN_USE=文件仍被 {entity}.{field} 使用。
RATE_LIMITED=请求过于频繁，请在 {retryAfter} 秒后重试。
TRANSLATION_REQUIRED=字段“{field}”必须填写语言“{lang}”的内容。
PROCESS_ONLY_FIELD=字段“{field}”只能由流程修改。
DISPLAY_NOT_DECLARED=实体“{entity}”没有声明显示字段。

# Titles of platform tasks (docs/design/18-numbering-approvals-tasks.md section 5)
task.approval=审批 {subject} {entity}（第 {level} 级）
