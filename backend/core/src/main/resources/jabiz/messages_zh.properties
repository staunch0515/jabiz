PROCESS_READ_TOO_LARGE=读取 {source} 将超过 {limit} 行，请用参数或条件缩小范围。
QUERY_TIMEOUT=查询未能在时限内完成，请用参数或条件缩小范围，或稍后再试。
EXTERNAL_CALL_FAILED=外部服务 {service} 调用失败（{kind}），请稍后再试。
