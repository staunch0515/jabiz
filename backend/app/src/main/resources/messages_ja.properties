ORDER_NO_FORMAT=受注番号は 2〜30 文字の英大文字・数字・ハイフンで入力してください。
ORDER_CUSTOMER_BLANK=顧客コードを入力してください。
STOCK_LEVEL_INVALID=在庫は負にできず、引当は在庫数を超えられません（在庫 {onHand}、引当 {reserved}）。
