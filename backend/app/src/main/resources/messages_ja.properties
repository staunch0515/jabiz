# サンプルアプリケーションのルールコードのメッセージ（docs/design/02-metamodel.md 3.1 節）。
NON_NEGATIVE_AMOUNT=項目「{field}」に負の値は指定できません。
NON_NEGATIVE_AMOUNT_SCALE=項目「{field}」の小数点以下は {scale} 桁までです。
NON_NEGATIVE_CHARGE=運賃に負の値は指定できません。
NON_NEGATIVE_CHARGE_SCALE=運賃の小数点以下は {scale} 桁までです。
NON_NEGATIVE_DUTY=関税額に負の値は指定できません。
NON_NEGATIVE_DUTY_SCALE=関税額の小数点以下は {scale} 桁までです。
VALID_MASS_RANGE=項目「{field}」は {min} 以上 {max} 以下で指定してください。
TEMPORAL_CAUSALITY=項目「{field}」に未来の日時は指定できません。
PRICE_CAUSALITY=適用開始日時に未来の日時は指定できません。
TITLE_NOT_BLANK=タイトルは必須です。
DONE_IS_BOOLEAN=項目「{field}」は true または false で指定してください。
PRICE_ADJUSTMENT_RANGE=調整率は {min}% から {max}% の範囲で指定してください。
PRICE_NOT_POSITIVE=調整後の価格は 0 より大きくなければなりません。
FREIGHT_MONTH_CLOSED={month} は締め済みです。
FREIGHT_MONTH_NOT_ENDED={month} はまだ終わっていません。
FREIGHT_WAYBILL_INCOMPLETE=運送状に運賃または出荷日時がありません。
FREIGHT_MONTH_TOO_LARGE=この月の運賃が {max} 件を超えるため、一度に締められません。
CARRIER_CODE_FORMAT=運送会社コードは英大文字または数字 2～10 文字で入力してください。
CARRIER_NAME_BLANK=運送会社名を入力してください。
CREDIT_LIMIT_RANGE=与信限度額は {min} 以上 {max} 以下で入力してください。
CREDIT_LIMIT_SCALE=与信限度額の小数部は {scale} 桁までです。
CONTACT_EMAIL_FORMAT=正しいメールアドレスを入力してください。

