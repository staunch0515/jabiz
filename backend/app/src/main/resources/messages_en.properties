# Messages of the sample application's rule codes (docs/design/02-metamodel.md section 3.1).
NON_NEGATIVE_AMOUNT=Field "{field}" must not be negative.
NON_NEGATIVE_AMOUNT_SCALE=Field "{field}" allows at most {scale} decimal places.
NON_NEGATIVE_CHARGE=The freight charge must not be negative.
NON_NEGATIVE_CHARGE_SCALE=The freight charge allows at most {scale} decimal places.
NON_NEGATIVE_DUTY=The duty amount must not be negative.
NON_NEGATIVE_DUTY_SCALE=The duty amount allows at most {scale} decimal places.
VALID_MASS_RANGE=Field "{field}" must be between {min} and {max}.
TEMPORAL_CAUSALITY=Field "{field}" must not be in the future.
PRICE_CAUSALITY=The effective time must not be in the future.
TITLE_NOT_BLANK=The title must not be blank.
DONE_IS_BOOLEAN=Field "{field}" must be true or false.
PRICE_ADJUSTMENT_RANGE=The adjustment must be between {min}% and {max}%.
PRICE_NOT_POSITIVE=The adjusted price must be greater than zero.
FREIGHT_MONTH_CLOSED=Month {month} is already closed.
FREIGHT_MONTH_NOT_ENDED=Month {month} has not ended yet.
FREIGHT_WAYBILL_INCOMPLETE=The waybill has no freight or shipping time yet.
FREIGHT_MONTH_TOO_LARGE=The month has more than {max} charges and cannot be closed at once.
CARRIER_CODE_FORMAT=The carrier code must be 2 to 10 capital letters or digits.
CARRIER_NAME_BLANK=The carrier name must not be blank.
CREDIT_LIMIT_RANGE=The credit limit must be between {min} and {max}.
CREDIT_LIMIT_SCALE=The credit limit allows at most {scale} decimal places.
CONTACT_EMAIL_FORMAT=Enter a valid e-mail address.

