# Orders and inventory (ROADMAP phase 11, com.jabiz.app.commerce).
PRODUCT_SKU_FORMAT=SKU 必须是 2 到 30 位大写字母、数字或连字符。
PRODUCT_NAME_BLANK=商品名称不能为空。
PRODUCT_PRICE_RANGE=单价必须在 {min} 到 {max} 之间。
PRODUCT_PRICE_SCALE=单价最多允许 {scale} 位小数。
WAREHOUSE_CODE_FORMAT=仓库代码必须是 2 到 10 位大写字母或数字。
WAREHOUSE_NAME_BLANK=仓库名称不能为空。
ORDER_NO_FORMAT=订单号必须是 2 到 30 位大写字母、数字或连字符。
ORDER_CUSTOMER_BLANK=客户代码不能为空。
STOCK_LEVEL_INVALID=库存不能为负，预留不能超过在库数（在库 {onHand}，预留 {reserved}）。
COMMERCE_WAREHOUSE_NOT_FOUND=仓库 {warehouseCode} 不存在。
COMMERCE_WAREHOUSE_INACTIVE=仓库 {warehouseCode} 已停用。
COMMERCE_PRODUCT_NOT_FOUND=商品 {sku} 不存在。
COMMERCE_PRODUCT_INACTIVE=商品 {sku} 已停售。
COMMERCE_DUPLICATE_SKU=商品 {sku} 出现在多行中。
COMMERCE_STOCK_INSUFFICIENT=商品 {sku} 可用库存只有 {available}，订购了 {requested}。
COMMERCE_ORDER_NOT_PLACED=订单状态为 {status}，不能再变更。
