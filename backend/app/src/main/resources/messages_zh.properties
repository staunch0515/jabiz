# 示范应用规则代码的文案（docs/design/02-metamodel.md 3.1 节）。
NON_NEGATIVE_AMOUNT=字段“{field}”不能为负数。
NON_NEGATIVE_AMOUNT_SCALE=字段“{field}”最多允许 {scale} 位小数。
NON_NEGATIVE_CHARGE=运费不能为负数。
NON_NEGATIVE_CHARGE_SCALE=运费最多允许 {scale} 位小数。
NON_NEGATIVE_DUTY=关税金额不能为负数。
NON_NEGATIVE_DUTY_SCALE=关税金额最多允许 {scale} 位小数。
VALID_MASS_RANGE=字段“{field}”必须介于 {min} 与 {max} 之间。
TEMPORAL_CAUSALITY=字段“{field}”不能是未来时间。
PRICE_CAUSALITY=生效时间不能是未来时间。
TITLE_NOT_BLANK=标题不能为空。
DONE_IS_BOOLEAN=字段“{field}”必须是 true 或 false。
PRICE_ADJUSTMENT_RANGE=调整幅度必须在 {min}% 到 {max}% 之间。
PRICE_NOT_POSITIVE=调整后的价格必须大于零。
FREIGHT_MONTH_CLOSED={month} 已结算。
FREIGHT_MONTH_NOT_ENDED={month} 尚未结束。
FREIGHT_WAYBILL_INCOMPLETE=运单还没有运费或发运时间。
FREIGHT_MONTH_TOO_LARGE=该月运费超过 {max} 笔，无法一次结算。
CARRIER_CODE_FORMAT=承运商代码须为 2～10 位大写字母或数字。
CARRIER_NAME_BLANK=承运商名称不能为空。
CREDIT_LIMIT_RANGE=信用额度须在 {min} 与 {max} 之间。
CREDIT_LIMIT_SCALE=信用额度最多保留 {scale} 位小数。
CONTACT_EMAIL_FORMAT=请输入有效的电子邮件地址。

