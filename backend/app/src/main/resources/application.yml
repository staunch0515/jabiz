spring:
  application:
    name: app
  r2dbc:
    url: r2dbc:postgresql://localhost:5436/app
    username: app
    password: ${DB_PASSWORD:app}
  flyway:
    url: jdbc:postgresql://localhost:5436/app
    user: app
    password: ${DB_PASSWORD:app}

jabiz:
  # The key signing the integrity seals (docs/design/21-audit-retention.md section 2), from the environment only:
  # Base64, at least 32 bytes. Startup fails without it, except in the dev profile. Keep a copy: without it the
  # existing seals cannot be verified.
  integrity:
    key: ${JABIZ_INTEGRITY_KEY:}
  security:
    # The key encrypting the users' TOTP secrets (docs/design/10-security.md section 9), from the environment only:
    # Base64, at least 32 bytes. Startup fails without it, except in the dev profile. Without it, enrolled users
    # cannot pass their second factor.
    mfa:
      key: ${JABIZ_MFA_KEY:}
    # Authentication (docs/design/10-security.md). The key signing access tokens comes from the environment only:
    # a Base64 value of at least 32 bytes (for example: openssl rand -base64 48). Startup fails without it, except in
    # the dev profile. Lifetimes, lock rules and password rules have defaults (see SecurityConfig).
    jwt:
      secret: ${JABIZ_JWT_SECRET:}
    # Sign-in entries (docs/design/10-security.md section 15; decision D36). The administration (admin) accepts the
    # back-office roles only (comma-separated JABIZ_ADMIN_ROLES; ADMIN is the first administrator's): never CUSTOMER,
    # which anybody can get by registering (the startup check refuses "*" or a registration role here while
    # registration is on). The customer portal (its own SPA at /portal/, backend/app/portal, decision D43) accepts the
    # CUSTOMER role only, lets customers register themselves (they get CUSTOMER) and requires a verified address
    # (JABIZ_PORTAL_REQUIRE_VERIFIED_EMAIL=false: the end-to-end tests, where no mail is sent); its mailed links lead to
    # its own pages (app-path) and its sessions stay on the device, so the installed app keeps its customer signed in.
    # Registration needs the role to exist and mail to be on (jabiz.mail.*), or nobody can verify their address;
    # JABIZ_PORTAL_SELF_REGISTRATION=false turns it off (the end-to-end tests, whose roles are their own).
    entries:
      admin:
        accepted-roles: ${JABIZ_ADMIN_ROLES:ADMIN}
      portal:
        accepted-roles: CUSTOMER
        self-registration: ${JABIZ_PORTAL_SELF_REGISTRATION:true}
        registration-roles: CUSTOMER
        require-verified-email: ${JABIZ_PORTAL_REQUIRE_VERIFIED_EMAIL:true}
        app-path: /portal/
        session:
          persistence: device
          refresh-token-ttl: P30D
          idle-timeout: 0
    # Signing in with Google at the portal, which may open a customer's account at the first sign-in (decision D39;
    # docs/design/10-security.md section 12; guide app-spa.md). Off in the sample: no client is registered for it.
    # To turn it on, register an OAuth client at Google with the portal's callback and uncomment (the secret comes from
    # the environment only):
    # oidc:
    #   providers:
    #     - id: google
    #       kind: google
    #       client-id: ${JABIZ_OIDC_GOOGLE_CLIENT_ID}
    #       client-secret: ${JABIZ_OIDC_GOOGLE_CLIENT_SECRET}
    #       redirect-uris:
    #         portal: ${JABIZ_PUBLIC_URL:https://shop.example.com}/portal/login/oidc
    #       labels: { en: Google, zh: Google, ja: Google }
    #       auto-provision: true
    # Signing in from inside another platform's administration with the short-lived token it signs (decision D59;
    # docs/design/10-security.md section 15.12): an entry of its own, a provider with the application's key and secret
    # there (from the environment only), and an SPA that the tenant may frame. Off in the sample: no platform is
    # registered for it. To turn it on, add the entry and the SPA, and uncomment:
    # external-tokens:
    #   shop:
    #     secrets: [ "${JABIZ_SHOP_APP_SECRET:}" ]
    #     audience: ${JABIZ_SHOP_APP_KEY}
    #     tenant-pattern: '[a-z0-9][a-z0-9-]*\.myshopify\.com'
    #     issuer-format: https://{tenant}/admin
    #     destination-format: https://{tenant}
    #     auto-provision: true
    #     frame-ancestors: [ https://admin.shopify.com ]
    # entries.shop: { accepted-roles: CUSTOMER, self-registration: true, registration-roles: CUSTOMER,
    #                 external-token: shop }
    # web.spa[i]: { path: /shop, entry: shop, embedding: shop }
    # The first administrator, created at startup when both are set and no user exists yet.
    bootstrap-admin:
      user-name: ${JABIZ_BOOTSTRAP_ADMIN_USER:}
      password: ${JABIZ_BOOTSTRAP_ADMIN_PASSWORD:}
  mail:
    # The unsubscribe page of notifications declared for the portal (commerce.order-shipped), under its app-path: the
    # portal mounts @jabiz/ui's MailUnsubscribe there, so customers never land in the administration (decision D52).
    # Notifications for every entry keep the application's page, jabiz.mail.unsubscribe-path (/mail/unsubscribe).
    unsubscribe-paths:
      portal: mail/unsubscribe
  files:
    # Where uploaded files are kept (docs/design/14-files.md section 6). No default: startup fails without it, since the
    # application declares file policies. A directory of this host (a volume in containers); single instance only.
    local:
      root: ${JABIZ_FILES_LOCAL_ROOT:}
  public:
    # Anonymous read access to public templates and files (docs/design/15-public-access.md). Off unless switched on;
    # the checks of public datasets and templates run either way. Limits, caching and rate limit have defaults.
    enabled: ${JABIZ_PUBLIC_ENABLED:false}
  # External services blocking steps call (decision D38), declared in code (ModerateText.DEMO_AI); each environment
  # may point them elsewhere. The demo AI service's address is an example: set yours, and its key in JABIZ_DEMO_AI_KEY
  # (startup fails without it, except in the dev profile). Requests go to the allowed hosts only.
  external-services:
    demo-ai:
      base-url: ${JABIZ_DEMO_AI_URL:https://ai.example.com/v1}
      allowed-hosts: ${JABIZ_DEMO_AI_HOSTS:ai.example.com}
    # The same service's images (commerce.product-image, decision D50): answers of up to 16 MiB, for that job only.
    demo-ai-images:
      base-url: ${JABIZ_DEMO_AI_URL:https://ai.example.com/v1}
      allowed-hosts: ${JABIZ_DEMO_AI_HOSTS:ai.example.com}
  process:
    # The queue before the order lock (decision D45; ORDER_CANCEL and ORDER_SHIP declare it): the defaults are
    # 2 per order at once, 50 waiting, 2 s. Process names as map keys in brackets keep their case.
    admission:
      families:
        "[commerce.order]": { concurrency: 2, max-queue: 20, max-wait: 2s }
    # Rate limits of the process API, per process (decision D45): a customer places at most 20 orders a minute.
    rate-limits:
      "[PORTAL_ORDER_PLACE]": { per-user: 20, period: 1m }
  i18n:
    # Language of error messages when Accept-Language names none of zh, ja, en.
    default-locale: en
    # Application bundles after the platform's: the app's own codes, then the geo extension's.
    bundles: messages,jabiz/ext/geo/messages

logging:
  pattern:
    # Every line carries the request id (docs/design/01-core-vs-runtime.md section 5); "-" outside requests.
    level: "%5p [requestId=%X{requestId:--}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
