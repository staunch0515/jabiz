# Self-registration at the customer portal (ROADMAP phase 16b-2; docs/design/10-security.md section 15; decision D36).
# A new address gets an unverified user named after it (in lower case), the portal's registration role and a
# verification mail. The same address again, in other letters, gets no user and never the password it came with: its
# user hears by mail that the account exists. Mail is off in tests, so the messages are recorded and SKIPPED, and no
# token is drawn (tokens exist only in mail that is sent).
name: Self-registration
clock: 2026-05-01T00:00:00Z
actor: { id: shop-admin, permissions: ["*"], mfa: true }
steps:
  - note: The portal grants the CUSTOMER role to whoever registers there; roles are data.
    process: ADD_ENTITY@latest
    input: { entityType: SecRole, attributes: { roleCode: CUSTOMER, labels: { en: Customer }, enabled: true } }

  - note: A new address.
    process: SPONSOR_SIGN_UP@latest
    input: { entry: portal, email: Mei@example.com, password: correct horse battery, displayName: Mei, locale: ja }
  - advanceClock: PT1H
  - note: The same address in other letters, with another password.
    process: SPONSOR_SIGN_UP@latest
    input: { entry: portal, email: mei@EXAMPLE.com, password: another horse battery }

  - note: The administration takes no registrations.
    expectError:
      process: SPONSOR_SIGN_UP@latest
      input: { entry: admin, email: someone@example.com, password: correct horse battery }
      status: 422
      ruleCode: SIGN_UP_DISABLED
  - note: Asking for a new verification or a password reset of an unknown address sends nothing.
    process: SPONSOR_EMAIL_VERIFY_SEND@latest
    input: { entry: portal, email: nobody@example.com }
  - process: SPONSOR_PASSWORD_RESET_REQUEST@latest
    input: { entry: portal, email: nobody@example.com }
  - note: The outbox runs MAIL_SEND; with mail off the messages are recorded as skipped.
    deliverEvents: true
snapshot:
  entities: [SecUser, SecUserRole, MailMessage, MailAttempt]
  asOf: end
