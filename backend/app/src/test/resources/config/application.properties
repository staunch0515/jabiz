# Test fixtures (it.fixture.ItFixtures) bring their own rule codes and messages.
jabiz.i18n.bundles=messages,jabiz/ext/geo/messages,it-messages
# Security for tests only (docs/design/10-security.md): a fixed signing key (never used outside tests) and cheap BCrypt.
jabiz.security.jwt.secret=dGVzdC1vbmx5LWtleS1vZi10aGUtamFiaXotaW50ZWdyYXRpb24tdGVzdHMtMDAwMDA=
jabiz.integrity.key=dGVzdC1vbmx5LWludGVncml0eS1rZXktb2YtdGhlLWphYml6LXRlc3RzLTAwMDAwMA==
jabiz.security.mfa.key=dGVzdC1vbmx5LW1mYS1rZXktb2YtdGhlLWphYml6LWludGVncmF0aW9uLXRlc3RzLTA=
jabiz.security.password.bcrypt-strength=4
# Tests deliver events and run jobs themselves (docs/design/11-ledger-events-jobs.md): no background polling or timers.
jabiz.events.delivery.enabled=false
jabiz.jobs.scheduler.enabled=false
# External jobs (decision D38) are run by the tests themselves (ExternalJobExecutor.runPending): no polling.
jabiz.external-jobs.executor.enabled=false
# Scenario replay writes results without running handlers (completeExternalJob); never outside tests.
jabiz.external-jobs.simulated-results=true
# Integration tests sign in with roles of their own on the administration: it accepts every role, so the customer
# portal takes no registrations here (decision D36; the startup check refuses both at once). The sign-up tests and
# the sign-up scenario turn registration on with an administration of their own.
jabiz.security.entries.admin.accepted-roles=*
jabiz.security.entries.portal.self-registration=false
# External services (decision D38): the demo AI service points at this machine, where nothing listens unless a test
# starts its stub there (ExternalServiceIT sets its own address), with a key for tests only.
jabiz.external-services.demo-ai.base-url=http://127.0.0.1:9/v1
jabiz.external-services.demo-ai.allowed-hosts=127.0.0.1
jabiz.external-services.demo-ai-images.base-url=http://127.0.0.1:9/v1
jabiz.external-services.demo-ai-images.allowed-hosts=127.0.0.1
JABIZ_DEMO_AI_KEY=test-only-demo-ai-key
# The payment provider of the orders sample (decision D37; CommercePayments) with a fixed secret used only in tests.
# Configured for development and tests only, never in application.yml.
jabiz.inbound-webhooks.providers.demo-pay.scheme=stripe
jabiz.inbound-webhooks.providers.demo-pay.secrets[0]=whsec_test_only_demo_pay_0123456789abcdef
jabiz.inbound-webhooks.providers.demo-pay.event-types[0]=payment_intent.succeeded
# Integration tests sign in again and again from one (mock) address, often as one user: the limits of the sign-in
# endpoints (decision D47) are out of their way here. SignInRateLimitIT checks them with their defaults.
jabiz.security.sign-in.rate-limit.per-user-address=100000
jabiz.security.sign-in.rate-limit.user-burst=100000
jabiz.security.sign-in.rate-limit.per-address=100000
jabiz.security.sign-in.rate-limit.burst=100000
jabiz.security.sign-in.rate-limit.per-network=100000
jabiz.security.sign-in.rate-limit.network-burst=100000
jabiz.security.sign-in.rate-limit.global-per-second=100000
