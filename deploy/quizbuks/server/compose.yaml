# QuizBuks on the shared Docker server (deploy/quizbuks/DEPLOY.md), one file for every environment. Installed as
# /opt/apps/<APP_NAME>/compose.yaml by the deploy workflow (.github/workflows/quizbuks-deploy.yml) and run there by
# /opt/infra/scripts/deploy-app.sh, which sets IMAGE_TAG. APP_NAME (quizbuks for production, quizbuks-staging for
# staging) comes from that directory's .env, so each environment is its own project with its own container and
# volumes. No ports and no database: Caddy reaches the application over the external network "proxy", and the
# server's shared PostgreSQL (container "postgres") is reached over the external network "db". Every setting and
# secret comes from the environment's .env, kept on the server only. The local compose with its own database is
# deploy/quizbuks/compose.dev.yaml and is never used here.
name: ${APP_NAME:?APP_NAME is required (set it in the environment's .env)}

services:
  app:
    image: ghcr.io/staunch0515/jabiz-quizbuks:${IMAGE_TAG:?IMAGE_TAG is required}
    # Caddy's upstream (deploy/quizbuks/server/site.caddy.tpl).
    container_name: ${APP_NAME:?APP_NAME is required}-app
    restart: unless-stopped
    env_file: .env
    environment:
      # A server never makes its own keys or Stripe placeholders (deploy/quizbuks/README.md, "密钥与部署"): a missing
      # secret refuses the start instead.
      QB_LOCAL_SECRETS: "false"
      QB_STRIPE_PLACEHOLDERS: "false"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Which system the pages say they are (platform 16zd): only production's .env sets it to "production"; every
      # other environment shows the test banner on every page. The deploy workflow checks the line against APP_NAME.
      JABIZ_WEB_ENVIRONMENT: ${JABIZ_WEB_ENVIRONMENT:-test}
    # The image sizes the heap at 60 % of this and caps Netty's direct buffers at 256 MiB (JAVA_TOOL_OPTIONS in
    # deploy/quizbuks/Dockerfile); the rest is for metaspace, code cache and the native memory of PDF and cover
    # rendering. Setting JAVA_TOOL_OPTIONS in .env replaces the image's value.
    mem_limit: 2g
    # Spring Boot's graceful shutdown waits up to 30 s for requests in progress (application.yml).
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      # The first start migrates an empty database and runs every startup check.
      start_period: 180s
    volumes:
      - files:/var/lib/jabiz/files
      - secrets:/var/lib/jabiz/secrets
    # telemetry: the environment's own LGTM below (profile "observability"), at http://lgtm:4318 for the OTLP settings
    # of the .env (docs/quizbuks/operations.md section 1.5).
    networks: [proxy, db, telemetry]
    # The shared server keeps every application's logs: bounded here, whatever the daemon's defaults.
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # Metrics, traces and logs of this environment, and its alerts (platform 13 section 7; docs/quizbuks/operations.md
  # section 5): Grafana, Prometheus, Tempo, Loki and an OpenTelemetry collector in one container, as the platform's
  # docker-compose.yml, started only when the .env sets COMPOSE_PROFILES=observability. The alert rules are the
  # platform's and QuizBuks's (the deploy workflow uploads them to ./alerting), rendered with the settings below when
  # the container starts (render.sh): a setting with anything but letters, digits and @._+,;- stops it. Grafana is
  # reached through an SSH tunnel to 127.0.0.1:${QB_GRAFANA_PORT} (staging and production each their own port), never
  # published; it mails the alerts itself, so it needs its own SMTP settings (GF_SMTP_*).
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    profiles: [observability]
    container_name: ${APP_NAME:?APP_NAME is required}-lgtm
    restart: unless-stopped
    ports: ["127.0.0.1:${QB_GRAFANA_PORT:-3000}:3000"]
    volumes:
      - ./alerting:/otel-lgtm/jabiz/alerting:ro
      - lgtm:/data
    command: ["bash", "/otel-lgtm/jabiz/alerting/render.sh"]
    environment:
      JABIZ_ALERT_EMAIL: ${JABIZ_ALERT_EMAIL:-oncall@example.com}
      # The application's spring.application.name: the metrics' job label.
      JABIZ_ALERT_SERVICE: ${JABIZ_ALERT_SERVICE:-quizbuks}
      JABIZ_ALERT_DISK_PERCENT: ${JABIZ_ALERT_DISK_PERCENT:-80}
      JABIZ_ALERT_REFRESH_GRANTED_MIN: ${JABIZ_ALERT_REFRESH_GRANTED_MIN:-10}
      JABIZ_ALERT_REFRESH_GRANTED_RATIO: ${JABIZ_ALERT_REFRESH_GRANTED_RATIO:-0.02}
      JABIZ_ALERT_REFRESH_REVOKED_MAX: ${JABIZ_ALERT_REFRESH_REVOKED_MAX:-20}
      # QuizBuks: 1 while AI is off on purpose (no alert); 0 once qb.ai.enabled is meant to be true.
      JABIZ_ALERT_QB_AI_HELD_MAX: ${JABIZ_ALERT_QB_AI_HELD_MAX:-1}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-alerts@example.com}
    mem_limit: 2g
    networks: [telemetry]
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  # Uploaded images, PDFs and audio (JABIZ_FILES_LOCAL_ROOT), <APP_NAME>_files: back up together with the database.
  files:
  # The image's secrets folder: no platform key or administrator password is generated on a server (the start is
  # refused instead); the platform's entrypoint keeps only the demo application's placeholder key here.
  secrets:
  # The LGTM container's data (metrics, logs, traces, Grafana's state), <APP_NAME>_lgtm.
  lgtm:

networks:
  proxy:
    external: true
  db:
    external: true
  # This environment's own (<APP_NAME>_telemetry): the application and its LGTM. Not internal: Grafana mails the alerts.
  telemetry:
