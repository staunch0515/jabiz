# QuizBuks (docs/quizbuks/02-design.md). From the repository root:
#
#   QB_LOCAL_SECRETS=true docker compose -f deploy/quizbuks/compose.dev.yaml up -d --build
#
# (QB_LOCAL_SECRETS=true, or in .env, lets the image make the platform's keys and the first administrator's password
# for this machine; without it every secret must be given, as on a server: Q10b, review L5.)
# then open http://localhost:8080/ (the app), /sponsor/ (the sponsor console) or /admin/ (the administration); the
# first administrator's password is never printed (Q10b, M5): read it with
# `docker compose -f deploy/quizbuks/compose.dev.yaml exec app cat /var/lib/jabiz/secrets/admin-password`. The
# application's service is named "app", as the platform's entrypoint (docker/app-entrypoint.sh) names it. Settings come
# from deploy/quizbuks/.env (never committed); the variables are listed in README.md beside this file. This compose is
# for this machine: on a server leave QB_LOCAL_SECRETS unset, set QB_STRIPE_PLACEHOLDERS=false and give every secret.
name: quizbuks

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: quizbuks
      POSTGRES_USER: quizbuks
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quizbuks}
    ports: ["127.0.0.1:${QUIZBUKS_DB_PORT:-5440}:5432"]
    volumes: [quizbuks-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizbuks -d quizbuks"]
      interval: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: deploy/quizbuks/Dockerfile
    image: quizbuks:local
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:${QUIZBUKS_PORT:-8080}:8080"]
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://db:5432/quizbuks
      SPRING_R2DBC_USERNAME: quizbuks
      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD:-quizbuks}
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/quizbuks
      SPRING_FLYWAY_USER: quizbuks
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:-quizbuks}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # Stripe (README.md, "本机的 compose"): without STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET and
      # STRIPE_CONNECT_WEBHOOK_SECRET in .env, the image's entrypoint fills placeholders in test mode (loud warnings;
      # top-ups and payouts do not work). false on a server, so that a missing value fails the startup check.
      QB_STRIPE_PLACEHOLDERS: ${QB_STRIPE_PLACEHOLDERS:-true}
      # Claude (README.md, "AI 生成题目"): ANTHROPIC_API_KEY from .env; without it a placeholder the provider refuses.
      # AI stays off until an administrator publishes qb.ai.enabled = true, so nothing is sent or spent before.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-local-placeholder-not-a-claude-key}
      # The platform's keys and the first administrator's password (README.md, "密钥与部署"): false unless set, so a
      # missing one refuses the start (review L5); a local demonstration sets QB_LOCAL_SECRETS=true, and the keys are
      # then made once into the secrets volume (and the startup check refuses them next to live mode).
      QB_LOCAL_SECRETS: ${QB_LOCAL_SECRETS:-false}
      # Sign-in entries and mail (README.md, "账户"): registration is on at the app and the sponsor console; mail is
      # off unless switched on, and then registered users cannot verify their address. The mail server (SPRING_MAIL_*)
      # comes from .env as it is.
      QB_ADMIN_ROLES: ${QB_ADMIN_ROLES:-ADMIN,QB_ADMIN_SUPER,QB_ADMIN_CONTENT,QB_ADMIN_FINANCE}
      QB_APP_SELF_REGISTRATION: ${QB_APP_SELF_REGISTRATION:-true}
      QB_SPONSOR_SELF_REGISTRATION: ${QB_SPONSOR_SELF_REGISTRATION:-true}
      JABIZ_MAIL_ENABLED: ${JABIZ_MAIL_ENABLED:-false}
      JABIZ_MAIL_FROM: ${JABIZ_MAIL_FROM:-}
      JABIZ_MAIL_BASE_URL: ${JABIZ_MAIL_BASE_URL:-http://localhost:8080}
      QB_SPONSOR_LINK: ${QB_SPONSOR_LINK:-}
      QB_APP_LINK: ${QB_APP_LINK:-}
      JABIZ_TRUSTED_PROXIES: ${JABIZ_TRUSTED_PROXIES:-}
      # Google sign-in for the app (README.md, "前端"): SPRING_PROFILES_ACTIVE=google with the client from .env.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      QB_OIDC_REDIRECT_APP: ${QB_OIDC_REDIRECT_APP:-}
      JABIZ_OIDC_GOOGLE_CLIENT_ID: ${JABIZ_OIDC_GOOGLE_CLIENT_ID:-}
      JABIZ_OIDC_GOOGLE_CLIENT_SECRET: ${JABIZ_OIDC_GOOGLE_CLIENT_SECRET:-}
    volumes: [quizbuks-secrets:/var/lib/jabiz/secrets, quizbuks-files:/var/lib/jabiz/files]

  # Catches the mail of a local installation, so that sign-ups can be verified on this machine (--profile tools):
  # JABIZ_MAIL_ENABLED=true, JABIZ_MAIL_FROM=noreply@quizbuks.local, SPRING_MAIL_HOST=mailpit, SPRING_MAIL_PORT=1025
  # in .env; the mail is read at http://localhost:8025. Never for a reachable installation.
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: [tools]
    ports: ["127.0.0.1:${QUIZBUKS_MAILPIT_PORT:-8025}:8025"]

volumes:
  quizbuks-db:
  quizbuks-secrets:
  quizbuks-files:
