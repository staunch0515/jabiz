# pgBackRest for the shared PostgreSQL (deploy/quizbuks/DEPLOY.md, "备份"). No secret here: the bucket, endpoint, keys
# and cipher passphrases come from the environment (PGBACKREST_REPO1_S3_KEY ... in backup.env, which the postgres
# container and the host's backup scripts both read). The whole cluster is backed up: every database on the server.
#
# Two repositories in one dedicated R2 bucket (docs/quizbuks/operations.md section 2.3):
#   repo1  point-in-time recovery: a full backup on Sundays and a differential one every other day; full backups are
#          kept while they are needed for 14 days of recovery
#   repo2  month-end full backups, kept 120 (10 years: vouchers and journal entries, L-4)
# Both are encrypted by pgBackRest before they leave the server.
[global]
repo1-type=s3
repo1-path=/pgbackrest-pitr
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=time
repo1-retention-full=14

repo2-type=s3
repo2-path=/pgbackrest-monthly
repo2-s3-region=auto
repo2-s3-uri-style=path
repo2-cipher-type=aes-256-cbc
repo2-retention-full=120
# WAL in repo2 only for each backup to be consistent, not for point-in-time recovery (repo1 does that).
repo2-retention-archive-type=full
repo2-retention-archive=1

compress-type=zst
process-max=2
start-fast=y
# WAL goes to the bucket in the background, so that a slow upload never holds up a commit.
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail

[main]
pg1-path=/var/lib/postgresql/data
